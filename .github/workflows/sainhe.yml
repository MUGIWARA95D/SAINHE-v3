name: SAINHE — Data Pipeline

# ┌─────────────────────────────────────────────────────────────┐
# │  DÉCLENCHEURS                                               │
# │  • push dev          → deploy (+ fetches optionnels)        │
# │  • schedule 1        → news  : 4H 10H 14H 18H 22H Paris    │
# │  • schedule 2        → fx    : midi + minuit Paris          │
# │  • schedule 3        → full  : lun-ven minuit Paris         │
# │  • workflow_dispatch → news (déclenchement manuel GitHub)   │
# │  • repository_dispatch event_type:                          │
# │      "news"     → Job 1 (news + macro)                      │
# │      "fx"       → Job 2 (fx)                                │
# │      "pipeline" → Job 3 (full pipeline)                     │
# │    ➜ Utilisé par cron-job.org pour contourner les délais    │
# │      du scheduler GitHub Actions (free tier).               │
# └─────────────────────────────────────────────────────────────┘
#
#  Tags commit pour fetches à la demande (Job 0) :
#    [refresh:news]   → fetch_news uniquement
#    [refresh:fx]     → fetch_fx uniquement
#    [refresh:prices] → fetch_prices uniquement (lent ~30 min)
#    [refresh:macro]  → fetch_macro_liquidity uniquement
#    [refresh:all]    → tout fetcher (= pipeline complet)
#
# ── Sécurité forks (repo public) ─────────────────────────────────
#  Aucun trigger `pull_request` → un fork externe ne peut jamais
#  déclencher ce workflow ni accéder aux secrets GitHub Actions.
#  workflow_dispatch / repository_dispatch nécessitent les droits
#  d'écriture sur le repo (impossibles depuis un fork).
# ─────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - dev

  schedule:
    # News — 4H 10H 14H 18H 22H Paris (CEST UTC+2)
    - cron: "0 2,8,12,16,20 * * *"
    # FX — midi Paris (CEST UTC+2) + 21h UTC (décalé de 22h pour éviter collision full pipeline)
    - cron: "0 10,21 * * *"
    # Full pipeline — lun-ven minuit Paris (CEST UTC+2)
    - cron: "0 22 * * 1-5"

  workflow_dispatch:

  repository_dispatch:
    types: [news, fx, pipeline]

env:
  DB_PATH: db/sainhe.db
  PYTHONIOENCODING: utf-8

permissions:
  contents: read
  deployments: write

jobs:

  # ════════════════════════════════════════════════════════════
  #  JOB 0 — DEPLOY (push sur dev)
  #
  #  Sans tag dans le commit message → deploy pur avec DB actuelle.
  #  Avec [refresh:X] → fetche X avant de déployer.
  #
  #  Les indicateurs (calc.py) sont TOUJOURS recalculés, même sans fetch,
  #  pour s'assurer que le HTML est cohérent avec la DB actuelle.
  # ════════════════════════════════════════════════════════════
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Migrate DB (idempotent)
        run: python scripts/db_init.py

      - name: "[refresh:fx] Fetch FX rates"
        if: |
          contains(github.event.head_commit.message, '[refresh:fx]') ||
          contains(github.event.head_commit.message, '[refresh:all]')
        run: python scripts/fetch_fx.py
        continue-on-error: true

      - name: "[refresh:news] Fetch News"
        if: |
          contains(github.event.head_commit.message, '[refresh:news]') ||
          contains(github.event.head_commit.message, '[refresh:all]')
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: "[refresh:prices] Fetch Prices (~30 min)"
        if: |
          contains(github.event.head_commit.message, '[refresh:prices]') ||
          contains(github.event.head_commit.message, '[refresh:all]')
        run: python scripts/fetch_prices.py
        continue-on-error: true

      - name: "[refresh:prices] Fetch Fundamentals (P/E S&P 500 → ERP)"
        if: |
          contains(github.event.head_commit.message, '[refresh:prices]') ||
          contains(github.event.head_commit.message, '[refresh:all]')
        run: python scripts/fetch_fundamentals.py
        continue-on-error: true

      - name: "[refresh:macro] Fetch Macro Liquidity (FRED, ECB, CAPE, HY)"
        if: |
          contains(github.event.head_commit.message, '[refresh:macro]') ||
          contains(github.event.head_commit.message, '[refresh:all]')
        run: python scripts/fetch_macro_liquidity.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Calculate indicators
        run: python scripts/calc.py
        continue-on-error: true

      - name: Render HTML — dev preview (STOCK_ANALYSIS_LIVE=true)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "true"

      - name: Deploy to Cloudflare Pages (dev preview)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=dev

      - name: Render HTML — production (STOCK_ANALYSIS_LIVE=false)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "false"

      - name: Upload DB to Google Drive
        if: |
          contains(github.event.head_commit.message, '[refresh:fx]')     ||
          contains(github.event.head_commit.message, '[refresh:news]')   ||
          contains(github.event.head_commit.message, '[refresh:prices]') ||
          contains(github.event.head_commit.message, '[refresh:macro]')  ||
          contains(github.event.head_commit.message, '[refresh:all]')
        run: python scripts/gdrive_sync.py upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Deploy to Cloudflare Pages (main → sainhe.com)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=main

  # ════════════════════════════════════════════════════════════
  #  JOB 1 — NEWS
  #  Cron : 4H 10H 14H 18H 22H heure Paris (CEST, UTC+2)
  #         → 2H 8H 12H 16H 20H UTC
  #  workflow_dispatch : déclenchement manuel depuis GitHub UI
  # ════════════════════════════════════════════════════════════
  news:
    name: Fetch News
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 2,8,12,16,20 * * *')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'news')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Migrate DB (idempotent)
        run: python scripts/db_init.py

      - name: Fetch Macro Liquidity (FRED, ECB, CAPE, HY)
        run: python scripts/fetch_macro_liquidity.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Fetch News
        run: python scripts/fetch_news.py

      - name: Calculate indicators
        run: python scripts/calc.py

      - name: Render HTML — dev preview (STOCK_ANALYSIS_LIVE=true)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "true"

      - name: Deploy to Cloudflare Pages (dev preview)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=dev

      - name: Render HTML — production (STOCK_ANALYSIS_LIVE=false)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "false"

      - name: Upload DB to Google Drive
        run: python scripts/gdrive_sync.py upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Deploy to Cloudflare Pages (main → sainhe.com)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=main

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — FX
  #  Cron : midi + minuit heure Paris (CEST, UTC+2)
  #         → 10H UTC + 22H UTC
  #  NB : à 22H UTC lun-ven, le full pipeline tourne aussi —
  #       les deux jobs sont indépendants, le pipeline re-fetche FX
  #       de toute façon, donc pas de conflit fonctionnel.
  # ════════════════════════════════════════════════════════════
  fx:
    name: Fetch FX
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 10,21 * * *')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'fx')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Migrate DB (idempotent)
        run: python scripts/db_init.py

      - name: Fetch FX rates
        run: python scripts/fetch_fx.py

      - name: Render HTML — dev preview (STOCK_ANALYSIS_LIVE=true)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "true"

      - name: Deploy to Cloudflare Pages (dev preview)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=dev

      - name: Render HTML — production (STOCK_ANALYSIS_LIVE=false)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "false"

      - name: Upload DB to Google Drive
        run: python scripts/gdrive_sync.py upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Deploy to Cloudflare Pages (main → sainhe.com)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=main

  # ════════════════════════════════════════════════════════════
  #  JOB 3 — FULL PIPELINE
  #  Cron : lun-ven minuit Paris (CEST, UTC+2) → 22H UTC
  #  Fetche tout : prix (lent) + FX + news → calc → render → deploy
  # ════════════════════════════════════════════════════════════
  pipeline:
    name: Full Data Pipeline
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 22 * * 1-5')) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'pipeline')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Migrate DB (idempotent)
        run: python scripts/db_init.py

      - name: Fetch FX rates
        run: python scripts/fetch_fx.py

      - name: Fetch Prices
        run: python scripts/fetch_prices.py

      - name: Fetch Fundamentals (P/E S&P 500 → ERP)
        run: python scripts/fetch_fundamentals.py
        continue-on-error: true

      - name: Fetch Macro Liquidity (FRED, ECB, CAPE, HY)
        run: python scripts/fetch_macro_liquidity.py
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Fetch News
        run: python scripts/fetch_news.py

      - name: Calculate indicators
        run: python scripts/calc.py

      - name: Render HTML — dev preview (STOCK_ANALYSIS_LIVE=true)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "true"

      - name: Deploy to Cloudflare Pages (dev preview)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=dev

      - name: Render HTML — production (STOCK_ANALYSIS_LIVE=false)
        run: python render_html.py
        env:
          STOCK_ANALYSIS_LIVE: "false"

      - name: Upload DB to Google Drive
        run: python scripts/gdrive_sync.py upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Deploy to Cloudflare Pages (main → sainhe.com)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: "3.99.0"
          command: pages deploy output --project-name=sainhe --branch=main
