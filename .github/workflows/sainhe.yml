name: SAINHE — Data Pipeline

on:
  push:
    branches:
      - dev

  schedule:
    # News : toutes les 4h (6×/jour)
    - cron: "0 */4 * * *"
    # Pipeline fin de journée : 22h UTC lun-ven
    - cron: "0 22 * * 1-5"

  workflow_dispatch:

env:
  DB_PATH: db/sainhe.db
  PYTHONIOENCODING: utf-8

permissions:
  contents: read
  deployments: write

jobs:

  # ════════════════════════════════════════════════════════════
  #  JOB 0 — PREVIEW DEV (push sur dev uniquement)
  #  Download DB → render → deploy preview
  # ════════════════════════════════════════════════════════════
  preview:
    name: Preview Dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init DB (idempotent)
        run: python scripts/db_init.py

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Render HTML
        run: python render_html.py

      - name: Deploy preview to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: sainhe
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: dev

  # ════════════════════════════════════════════════════════════
  #  JOB 1 — NEWS (toutes les 4h)
  #  Download DB → fetch news → calc → render → upload → deploy
  # ════════════════════════════════════════════════════════════
  news:
    name: Fetch News
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 */4 * * *'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init DB (idempotent)
        run: python scripts/db_init.py

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Fetch News
        run: python scripts/fetch_news.py

      - name: Calculate indicators
        run: python scripts/calc.py
        continue-on-error: true

      - name: Render HTML
        run: python render_html.py

      - name: Upload DB to Google Drive
        run: python scripts/gdrive_sync.py upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: sainhe
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — FULL PIPELINE lun-ven 22h UTC
  #  Download DB → fetch tout → calc → render → upload → deploy
  # ════════════════════════════════════════════════════════════
  pipeline:
    name: Full Data Pipeline
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 22 * * 1-5'))

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init DB (idempotent)
        run: python scripts/db_init.py

      - name: Download DB from Google Drive
        run: python scripts/gdrive_sync.py download
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Fetch FX rates
        run: python scripts/fetch_fx.py

      - name: Fetch Prices
        run: python scripts/fetch_prices.py

      - name: Fetch Indices
        run: python scripts/fetch_indices.py

      - name: Fetch News
        run: python scripts/fetch_news.py

      - name: Calculate indicators
        run: python scripts/calc.py

      - name: Render HTML
        run: python render_html.py

      - name: Upload DB to Google Drive
        run: python scripts/gdrive_sync.py upload
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          GDRIVE_FILE_ID: ${{ secrets.GDRIVE_FILE_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: sainhe
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
