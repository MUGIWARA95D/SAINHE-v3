name: SAINHE — Data Pipeline

on:
  schedule:
    # News : toutes les 4h (6×/jour au lieu de 24)
    - cron: "0 */4 * * *"
    # Pipeline fin de journée : 22h UTC lun-ven (FX inclus)
    - cron: "0 22 * * 1-5"

  # Déclenchement manuel
  workflow_dispatch:
    inputs:
      mode:
        description: "Fetch mode"
        required: false
        default: "update"
        type: choice
        options:
          - update   # 5 derniers jours (rapide)
          - full     # 2 ans complets (reset historique)

env:
  DB_PATH: db/sainhe.db
  PYTHONIOENCODING: utf-8

permissions:
  contents: read
  deployments: write

jobs:

  # ════════════════════════════════════════════════════════════
  #  JOB 1 — NEWS (toutes les 4h)
  # ════════════════════════════════════════════════════════════
  news:
    name: Fetch News
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 */4 * * *'))

    steps:
      - uses: actions/checkout@v4

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: db/sainhe.db
          key: sainhe-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sainhe-db-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init DB (idempotent)
        run: python scripts/db_init.py

      - name: Fetch News
        run: python scripts/fetch_news.py

      - name: Calculate indicators
        run: python scripts/calc.py
        continue-on-error: true

      - name: Render HTML
        run: python render_html.py

      - name: Save DB cache
        uses: actions/cache@v4
        with:
          path: db/sainhe.db
          key: sainhe-db-${{ runner.os }}-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: sainhe
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════
  #  JOB 2 — FULL PIPELINE lun-ven 22h UTC
  #  Inclut FX + prix + indices + news + calc + deploy
  # ════════════════════════════════════════════════════════════
  pipeline:
    name: Full Data Pipeline
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && contains(github.event.schedule, '0 22 * * 1-5'))

    steps:
      - uses: actions/checkout@v4

      - name: Restore DB cache
        uses: actions/cache@v4
        with:
          path: db/sainhe.db
          key: sainhe-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sainhe-db-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Init DB (idempotent)
        run: python scripts/db_init.py

      - name: Fetch FX rates
        run: python scripts/fetch_fx.py

      - name: Fetch Prices
        run: |
          MODE=${{ github.event.inputs.mode || 'update' }}
          python scripts/fetch_prices.py --mode $MODE

      - name: Fetch Indices
        run: python scripts/fetch_indices.py

      - name: Fetch News
        run: python scripts/fetch_news.py

      - name: Calculate indicators
        run: python scripts/calc.py

      - name: Render HTML
        run: python render_html.py

      - name: Save DB cache
        uses: actions/cache@v4
        with:
          path: db/sainhe.db
          key: sainhe-db-${{ runner.os }}-${{ github.run_id }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: sainhe
          directory: output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
