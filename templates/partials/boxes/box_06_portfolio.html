<!-- ═══ BOX_06 — PORTFOLIO SCANNER ══════════════════════════ -->
<!-- DATA: box_portfolio = {currency, tickers:[{ticker,nom,secteur,close,chg_pct,ret_1m,ret_3m,ret_6m,ret_1y,score,above_dma200,rvol,mfi,dma_200,sentiment_label,signal,sparkline,ts_update}], total:int} -->
<section class="card" id="box-portfolio">
  <div class="card-h">
    <span class="card-t">Portfolio Signal Table</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts">Updated {{ ts_portfolio }}</span>
      <span class="badge badge-green" id="pt-cur-badge">{{ box_portfolio.total }} tickers &middot; <span id="pt-cur-label">{{ box_portfolio.currency }}</span></span>
    </div>
  </div>
  <div id="pt-anomalies"></div>
  <div id="pt-pulse"></div>
  <div style="overflow-x:auto">
    <table id="pt-table">
      <thead><tr id="pt-head">
        <th data-sort="secteur">Category</th>
        <th data-sort="ticker">Ticker</th>
        <th></th>
        <th data-sort="close">Price</th>
        <th data-sort="chg_pct" class="pt-ret-parent" style="white-space:nowrap">Today&thinsp;<span id="pt-ret-btn" class="pt-ret-toggle" title="Toggle 1M · 3M · 1Y">▸</span></th>
        <th class="pt-ret" data-sort="ret_1m">1M</th>
        <th class="pt-ret" data-sort="ret_3m">3M</th>
        <th class="pt-ret" data-sort="ret_1y">1Y</th>
        <th data-sort="score">Score</th>
        <th class="pt-sig-parent" style="white-space:nowrap">Momentum&thinsp;<span id="pt-sig-btn" class="pt-sig-toggle" title="Toggle MFI · RVOL · DMA200">▸</span></th>
        <th class="pt-sig" data-sort="mfi">MFI</th>
        <th class="pt-sig" data-sort="rvol">RVOL</th>
        <th class="pt-sig" data-sort="above_dma200">DMA200</th>
      </tr></thead>
      <tbody id="ptb"></tbody>
    </table>
  </div>
</section>
<script>
(function(){
  const PORT = {{ box_portfolio.tickers | tojson }};
  const tb   = document.getElementById("ptb");

  /* sparkline registry — destroyed before re-render */
  var ptSparks = {};

  /* ── helpers ────────────────────────────────────────────── */
  function mk(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!=null)el.textContent=txt;return el;}
  function clear(el){while(el.firstChild) el.removeChild(el.firstChild);}
  function pct(n){return n!=null?(n>=0?"+":"")+n.toFixed(2)+"%":"—";}
  function fmt(n){return n!=null?n.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2}):"—";}

  function staleInfo(ts){
    if(!ts) return {cls:"ts-unk",label:"?"};
    const h=(Date.now()-new Date(ts))/3600000;
    const l=h<1?"<1h":h<24?Math.round(h)+"h":Math.round(h/24)+"d";
    return h<6?{cls:"ts-fresh",label:l}:h<30?{cls:"ts-ok",label:l}:h<72?{cls:"ts-stale",label:l}:{cls:"ts-old",label:l};
  }
  function tsHHMM(ts){
    if(!ts) return "—";
    const d=new Date(ts);
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }

  /* signal display mapping */
  function sigLabel(s){return s==="BUY"?"Flux ↑":s==="AVOID"?"Flux ↓":s==="WATCH"?"Neutre":"N/A";}
  function sigCls(s){return s==="BUY"?"sig-buy":s==="AVOID"?"sig-avoid":s==="WATCH"?"sig-watch":"sig-na";}

  /* sentiment badge color */
  function sentColor(s){
    if(!s) return "var(--muted)";
    const sl=s.toLowerCase();
    if(sl.includes("euphor"))       return "var(--green)";
    if(sl.includes("extreme fear")) return "var(--red)";
    if(sl.includes("bearish")||sl.includes("caution")) return "var(--gold)";
    return "var(--muted)";
  }

  /* ── sort state ─────────────────────────────────────────── */
  const SORT_LABELS={
    secteur:"Category", ticker:"Ticker", close:"Price",
    chg_pct:"Today", ret_1m:"1M", ret_3m:"3M", ret_1y:"1Y",
    score:"Score", mfi:"MFI", rvol:"RVOL", above_dma200:"DMA200"
  };
  let sortCol="score", sortDir=-1; /* default: score descending */

  function sortedPort(){
    return PORT.slice().sort(function(a,b){
      var va=a[sortCol], vb=b[sortCol];
      /* string columns */
      if(typeof va==="string"||typeof vb==="string")
        return sortDir*(va||"").localeCompare(vb||"");
      /* nulls always to the bottom, regardless of direction */
      if(va==null&&vb==null) return 0;
      if(va==null) return 1;
      if(vb==null) return -1;
      return sortDir*(va<vb?-1:va>vb?1:0);
    });
  }

  /* ── expansion panel ────────────────────────────────────── */
  var expandTr=null, expandPanelTr=null, expandChart=null;

  function closeExpand(){
    if(expandPanelTr){expandPanelTr.remove();expandPanelTr=null;}
    if(expandChart){expandChart.destroy();expandChart=null;}
    expandTr=null;
  }

  function toggleExpand(tr,p){
    if(expandTr===tr){closeExpand();return;}
    closeExpand();
    expandTr=tr;

    var panelTr=document.createElement("tr");
    panelTr.className="pt-expand-row";
    var panelTd=panelTr.appendChild(document.createElement("td"));
    panelTd.colSpan=13; panelTd.className="pt-expand-td";
    var inner=panelTd.appendChild(document.createElement("div"));
    inner.className="pt-expand-inner";

    /* big sparkline */
    var sparkWrap=inner.appendChild(document.createElement("div"));
    sparkWrap.className="pt-expand-spark";
    var bigCv=sparkWrap.appendChild(document.createElement("canvas"));
    bigCv.width=200; bigCv.height=50;

    /* info column */
    var info=inner.appendChild(document.createElement("div"));
    info.className="pt-expand-info";

    var sc=p.score;
    var dmaStr=p.above_dma200===1?"↑":p.above_dma200===0?"↓":"—";
    var mfiStr=p.mfi!=null?Math.round(p.mfi):"—";
    var rvolStr=p.rvol!=null?p.rvol.toFixed(2):"—";
    info.appendChild(mk("div","pt-expand-score",
      "Score: "+(sc!=null?(sc>=0?"+":"")+sc.toFixed(2):"—")+
      " · DMA200: "+dmaStr+" · MFI: "+mfiStr+" · RVOL: "+rvolStr));
    info.appendChild(mk("div","pt-expand-rets",
      "1M: "+pct(p.ret_1m)+" · 3M: "+pct(p.ret_3m)+" · 1Y: "+pct(p.ret_1y)));

    var sentEl=info.appendChild(document.createElement("div"));
    var sentBadge=sentEl.appendChild(mk("span",null,p.sentiment_label||"—"));
    sentBadge.style.cssText="font-weight:700;color:"+sentColor(p.sentiment_label);

    var sigEl=info.appendChild(document.createElement("div"));
    sigEl.appendChild(mk("span","sig "+sigCls(p.signal),sigLabel(p.signal)));

    tr.after(panelTr); expandPanelTr=panelTr;

    /* render big sparkline */
    var raw=[];
    try{if(p.sparkline) raw=JSON.parse(p.sparkline);}catch(e){}
    if(raw.length){
      var col=(p.chg_pct||0)>=0?"rgb(44,122,62)":"rgb(160,48,32)";
      expandChart=miniChart(bigCv,raw,col,true);
    }
  }

  /* ── anomalies feed ─────────────────────────────────────── */
  function renderAnomalies(){
    var el=document.getElementById("pt-anomalies");
    var alerts=[];
    PORT.forEach(function(p){
      var pri=Math.abs(p.score||0)*(p.rvol||1);
      var hhmm=tsHHMM(p.ts_update);
      if((p.rvol||0)>1.5)
        alerts.push({ticker:p.ticker,msg:"Abnormal volume · RVOL: "+p.rvol.toFixed(2)+"×",cls:"al-gold",hhmm:hhmm,pri:pri});
      if(p.above_dma200===0&&(p.score||0)<-0.1)
        alerts.push({ticker:p.ticker,msg:"Negative momentum below DMA200",cls:"al-red",hhmm:hhmm,pri:pri});
      if(p.above_dma200===1&&(p.score||0)>0.4)
        alerts.push({ticker:p.ticker,msg:"Strong signal above DMA200",cls:"al-green",hhmm:hhmm,pri:pri});
      if(p.sentiment_label==="Extreme Fear"&&p.signal==="BUY")
        alerts.push({ticker:p.ticker,msg:"Divergence: Flux ↑ despite Extreme Fear",cls:"al-gold",hhmm:hhmm,pri:pri*2});
    });
    clear(el);
    if(!alerts.length) return;
    alerts.sort(function(a,b){return b.pri-a.pri;});
    var hdr=el.appendChild(document.createElement("div"));
    hdr.className="pt-anom-hdr";
    hdr.appendChild(document.createTextNode("◈ Anomalies "));
    hdr.appendChild(mk("span",null,"["+alerts.length+"]")).style.color="var(--gold)";
    alerts.slice(0,5).forEach(function(a){
      var row=el.appendChild(document.createElement("div"));
      row.className="pt-alert "+a.cls;
      var tick=row.appendChild(mk("span","pt-alert-ticker",a.ticker));
      tick.style.color=a.cls==="al-green"?"var(--green)":a.cls==="al-red"?"var(--red)":"var(--gold)";
      row.appendChild(mk("span","pt-alert-msg","— "+a.msg));
      row.appendChild(mk("span","pt-alert-time",a.hhmm));
    });
  }

  /* ── portfolio pulse bandeau ────────────────────────────── */
  function renderPulse(){
    var el=document.getElementById("pt-pulse");
    var valid=PORT.filter(function(p){return p.score!=null;});
    var avg=valid.length?valid.reduce(function(s,p){return s+p.score;},0)/valid.length:null;
    var above=PORT.filter(function(p){return p.above_dma200===1;}).length;
    var total=PORT.length;
    var up=PORT.filter(function(p){return p.signal==="BUY";}).length;
    var neut=PORT.filter(function(p){return p.signal==="WATCH";}).length;
    var dn=PORT.filter(function(p){return p.signal==="AVOID";}).length;
    var avgColor=avg==null?"var(--muted)":avg>0?"var(--green)":"var(--red)";
    var avgArrow=avg==null?"":avg>0?"▲ ":"▼ ";
    var dmaRatio=total>0?above/total:0;
    var dmaColor=dmaRatio>0.6?"var(--green)":dmaRatio<0.4?"var(--red)":"var(--gold)";
    clear(el);

    /* col 1 — avg score */
    var c1=el.appendChild(document.createElement("div")); c1.className="pt-pulse-col";
    c1.appendChild(mk("div","pt-pulse-lbl","Avg Score"));
    var v1=c1.appendChild(mk("div","pt-pulse-val",avgArrow+(avg!=null?(avg>=0?"+":"")+avg.toFixed(2):"—")));
    v1.style.color=avgColor;

    /* col 2 — above dma200 */
    var c2=el.appendChild(document.createElement("div")); c2.className="pt-pulse-col";
    c2.appendChild(mk("div","pt-pulse-lbl","Above DMA200"));
    var v2=c2.appendChild(mk("div","pt-pulse-val",above+" / "+total));
    v2.style.color=dmaColor;

    /* col 3 — momentum counts */
    var c3=el.appendChild(document.createElement("div")); c3.className="pt-pulse-col";
    c3.appendChild(mk("div","pt-pulse-lbl","Momentum"));
    var v3=c3.appendChild(document.createElement("div")); v3.className="pt-pulse-val";
    var su=v3.appendChild(mk("span",null,up+" ↑")); su.style.color="var(--green)";
    v3.appendChild(mk("span",null," · ")).style.color="var(--faint)";
    var sn=v3.appendChild(mk("span",null,neut+" →")); sn.style.color="var(--gold)";
    v3.appendChild(mk("span",null," · ")).style.color="var(--faint)";
    var sd=v3.appendChild(mk("span",null,dn+" ↓")); sd.style.color="var(--red)";

    /* col 4 — last fetch age (most recent ts_update) */
    var latestTs=null;
    PORT.forEach(function(p){
      if(p.ts_update&&(!latestTs||new Date(p.ts_update)>new Date(latestTs))) latestTs=p.ts_update;
    });
    var si=staleInfo(latestTs);
    var ageColor=si.cls==="ts-fresh"?"#2C7A3E":si.cls==="ts-ok"?"#B06A18":si.cls==="ts-stale"?"#A03020":"#7A0A18";
    var c4=el.appendChild(document.createElement("div")); c4.className="pt-pulse-col";
    c4.appendChild(mk("div","pt-pulse-lbl","Last Fetch"));
    var v4=c4.appendChild(mk("div","pt-pulse-val",si.label));
    v4.style.color=ageColor;
    if(si.cls==="ts-old") v4.style.fontWeight="900";
  }

  /* ── main table render ──────────────────────────────────── */
  function renderTable(){
    /* destroy old sparkline instances before clearing DOM */
    Object.values(ptSparks).forEach(function(c){ try{ c.destroy(); }catch(e){} });
    Object.keys(ptSparks).forEach(function(k){ delete ptSparks[k]; });
    closeExpand();

    /* update sort indicators in header — arrows via CSS data-dir, no text pollution */
    document.querySelectorAll("#pt-head [data-sort]").forEach(function(th){
      var col=th.dataset.sort;
      var base=SORT_LABELS[col]||col;
      var savedRet=th.querySelector(".pt-ret-toggle");
      var savedSig=th.querySelector(".pt-sig-toggle");
      th.textContent=base; /* clean label only */
      if(savedRet) th.appendChild(savedRet);
      if(savedSig) th.appendChild(savedSig);
      th.classList.toggle("pt-sort-active",col===sortCol);
      if(col===sortCol) th.setAttribute("data-dir",sortDir===-1?"desc":"asc");
      else th.removeAttribute("data-dir");
    });

    var sorted=sortedPort();
    clear(tb);

    if(!sorted.length){
      var etr=tb.appendChild(document.createElement("tr"));
      var etd=etr.appendChild(document.createElement("td"));
      etd.colSpan=13;
      etd.style.cssText="padding:20px;color:var(--muted);text-align:center";
      etd.textContent="No watchlist data";
      return;
    }

    sorted.forEach(function(p){
      var tr=tb.appendChild(mk("tr"));
      tr.addEventListener("click",function(){toggleExpand(tr,p);});

      /* col 1 — category */
      tr.appendChild(mk("td",null,p.secteur||"—")).style.color="var(--muted)";

      /* col 2 — ticker + name */
      var td1=tr.appendChild(mk("td"));
      td1.appendChild(mk("strong",null,p.ticker)).style.color="var(--h)";
      var sub=td1.appendChild(mk("span",null," "+(p.nom||"")));
      sub.style.cssText="font-size:10px;color:var(--muted)";

      /* col 3 — mini sparkline canvas */
      var td2=tr.appendChild(mk("td"));
      var cv=td2.appendChild(document.createElement("canvas"));
      cv.id="psp_"+p.ticker.replace(/\W/g,"_");
      cv.width=56; cv.height=22; cv.className="idx-spark";

      /* col 4 — price (converted to current display currency) */
      var priceTd = tr.appendChild(mk("td", null, window.fxSymbol() + window.fxFmt(p.close, p.native_devise||'USD')));
      priceTd.style.fontVariantNumeric = "tabular-nums";

      /* col 5 — today % */
      var chgTd=tr.appendChild(mk("td",null,pct(p.chg_pct)));
      chgTd.style.fontWeight="600";
      chgTd.className=(p.chg_pct||0)>=0?"p-up":"p-dn";

      /* col 6-8 — 1M / 3M / 1Y (collapsible) */
      [p.ret_1m,p.ret_3m,p.ret_1y].forEach(function(v){
        var td=tr.appendChild(mk("td",null,pct(v)));
        td.className="pt-ret"+(v==null?"":(v>=0?" p-up":" p-dn"));
      });

      /* col 9 — score */
      var sc=p.score;
      var scTd=tr.appendChild(mk("td",null,sc!=null?(sc>=0?"+":"")+sc.toFixed(2):"—"));
      scTd.style.cssText="font-weight:600;color:"+(sc==null?"var(--muted)":sc>=0.1?"var(--green)":sc<=-0.1?"var(--red)":"var(--muted)");

      /* col 10 — momentum (renamed signal) */
      tr.appendChild(mk("td")).appendChild(mk("span","sig "+sigCls(p.signal),sigLabel(p.signal)));

      /* col 11 — MFI (collapsible) */
      var mfiTd=tr.appendChild(mk("td","pt-sig"));
      if(p.mfi!=null){
        var ms=mk("span",null,Math.round(p.mfi).toString());
        ms.style.cssText="font-weight:600;color:"+(p.mfi>60?"var(--green)":p.mfi<40?"var(--red)":"var(--gold)");
        mfiTd.appendChild(ms);
      } else {mfiTd.textContent="—";mfiTd.style.color="var(--muted)";}

      /* col 12 — RVOL (collapsible) */
      var rvolTd=tr.appendChild(mk("td","pt-sig"));
      if(p.rvol!=null){
        var rs=mk("span",null,p.rvol.toFixed(2));
        rs.style.cssText=p.rvol>1.2?"font-weight:700;color:var(--gold)":"color:var(--muted)";
        rvolTd.appendChild(rs);
      } else {rvolTd.textContent="—";rvolTd.style.color="var(--muted)";}

      /* col 13 — DMA200 arrow + distance (collapsible) */
      var dmaTd=tr.appendChild(mk("td","pt-sig"));
      if(p.above_dma200!=null){
        var upDma=p.above_dma200===1;
        var arr=mk("span",null,upDma?"↑":"↓");
        arr.style.cssText="font-weight:700;color:"+(upDma?"var(--green)":"var(--red)");
        dmaTd.appendChild(arr);
        if(p.close!=null&&p.dma_200!=null&&p.dma_200>0){
          var dist=((p.close-p.dma_200)/p.dma_200*100).toFixed(1)+"%";
          var ds=mk("span",null," "+dist);
          ds.style.cssText="font-size:9px;color:var(--muted)";
          dmaTd.appendChild(ds);
        }
      } else {dmaTd.textContent="—";dmaTd.style.color="var(--muted)";}
    });

    /* render mini sparklines after DOM is ready */
    sorted.forEach(function(p){
      var cv=document.getElementById("psp_"+p.ticker.replace(/\W/g,"_"));
      if(!cv) return;
      var raw=[];
      try{if(p.sparkline) raw=JSON.parse(p.sparkline);}catch(e){}
      if(!raw.length) return;
      var ch=miniChart(cv,raw,(p.chg_pct||0)>=0?"rgb(44,122,62)":"rgb(160,48,32)",false);
      if(ch) ptSparks[cv.id]=ch;
    });
  }

  /* ── header sort click handlers ─────────────────────────── */
  document.querySelectorAll("#pt-head [data-sort]").forEach(function(th){
    th.addEventListener("click",function(){
      var col=th.dataset.sort;
      if(sortCol===col) sortDir*=-1; else {sortCol=col;sortDir=-1;}
      renderTable();
    });
  });

  /* ── returns collapse toggle ────────────────────────────── */
  var retCollapsed=true; /* start collapsed */
  var ptTable=document.getElementById("pt-table");
  var retBtn=document.getElementById("pt-ret-btn");
  if(retBtn){
    retBtn.addEventListener("click",function(e){
      e.stopPropagation(); /* don't trigger Today sort */
      retCollapsed=!retCollapsed;
      ptTable.classList.toggle("pt-ret-collapsed",retCollapsed);
      retBtn.textContent=retCollapsed?"▸":"▾";
    });
  }

  /* ── momentum/detail collapse toggle ───────────────────── */
  var sigCollapsed=true; /* start collapsed */
  var sigBtn=document.getElementById("pt-sig-btn");
  if(sigBtn){
    sigBtn.addEventListener("click",function(e){
      e.stopPropagation(); /* don't trigger sort */
      sigCollapsed=!sigCollapsed;
      ptTable.classList.toggle("pt-sig-collapsed",sigCollapsed);
      sigBtn.textContent=sigCollapsed?"▸":"▾";
    });
  }

  /* ── expose pour le switcher de devise ─────────────────── */
  window._sainheRenderPortfolio = function(){
    renderTable();
    /* restore collapsed state after re-render */
    if(retCollapsed) ptTable.classList.add("pt-ret-collapsed");
    if(sigCollapsed) ptTable.classList.add("pt-sig-collapsed");
  };

  /* ── init ───────────────────────────────────────────────── */
  renderAnomalies();
  renderPulse();
  renderTable();
  /* apply collapsed state after table is rendered */
  ptTable.classList.add("pt-ret-collapsed");
  ptTable.classList.add("pt-sig-collapsed");
})();
</script>
