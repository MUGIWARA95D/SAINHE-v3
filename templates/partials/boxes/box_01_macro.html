<!-- ═══ BOX_01 — MACRO HEALTH ═══════════════════════════════ -->
<!-- DATA: box_macro = {ts, vix:{valeur,regime}, yield_curve:{valeur,inverted,us10y,us3m}, erp:{valeur,regime,sp500_pe}, dxy:{valeur,chg_pct}, sp500:{close,chg_pct,ret_1y}} -->
<section class="card" id="box-macro">
  <div class="card-h">
    <span class="card-t">{{ t.box_macro_title }}</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts">{{ t.updated }} {{ ts_macro }}</span>
      <span class="badge badge-gold">{{ t.box_macro_badge }}</span>
    </div>
  </div>
  <div class="macro-grid" id="mgrid"></div>
</section>
<script>
(function(){
  const I18N = window.SAINHE_I18N || {};
  const LOC  = window.SAINHE_LOCALE || 'en';
  const M    = {{ box_macro | tojson }};
  const grid = document.getElementById("mgrid");
  function mk(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!=null)el.textContent=txt;return el;}
  function fmt(n,d){return n!=null?n.toLocaleString(LOC,{minimumFractionDigits:d||2,maximumFractionDigits:d||2}):"—";}

  function addCard(label, value, valueColor, sub1, sub2, sigClass, sigText){
    const mc = grid.appendChild(mk("div","mc"));
    mc.appendChild(mk("div","mc-label",label));
    const val = mc.appendChild(mk("div","mc-val",value));
    if(valueColor) val.style.color = valueColor;
    if(sub1) mc.appendChild(mk("div","mc-sub",sub1));
    if(sub2) mc.appendChild(mk("div","mc-sub",sub2));
    if(sigText){
      const sig = mc.appendChild(mk("span","mc-sig",sigText));
      sig.className = "mc-sig law-tag " + sigClass;
    }
  }

  // ── ERP ─────────────────────────────────────────────────
  const erp  = M.erp || {};
  const erpV = erp.valeur;
  const erpC = erpV==null?"var(--muted)":erpV>=0.02?"var(--green)":erpV>=0.01?"var(--orange)":"var(--red)";
  const erpS = erpV==null?"N/A":erpV>=0.02?(I18N.erp_attractive||"Attractive"):erpV>=0.01?(I18N.erp_neutral||"Neutral"):(I18N.erp_expensive||"Expensive");
  const erpSC= erpV==null?"":erpV>=0.02?"law-g":erpV>=0.01?"law-y":"law-r";
  const ey   = erp.sp500_pe ? (100/erp.sp500_pe).toFixed(2)+"%" : "—";
  const y10v = (M.yield_curve||{}).us10y;
  addCard(
    I18N.erp_title||"Equity Risk Premium (ERP)",
    erpV!=null ? (erpV*100).toFixed(2)+"%" : "—",
    erpC,
    (I18N.erp_earnings_yield||"Earnings Yield")+": "+ey+" (P/E "+(erp.sp500_pe!=null?erp.sp500_pe.toFixed(1):"—")+") − 10Y: "+fmt(y10v)+"%",
    I18N.erp_sub2||"ERP > 2% = attractive · < 0% = bonds beat equities",
    erpSC, erpS
  );

  // ── Yield Curve ─────────────────────────────────────────
  // 4-regime probabilistic signal — not a binary recession trigger
  const yc  = M.yield_curve || {};
  const ycV = yc.valeur;
  const YC  = {
    steep            : { label: I18N.yc_steep  ||"Steep (Normal)",    cls:"law-g", color:"var(--green)",
                         note: I18N.yc_steep_note  ||"Positive slope — expansionary environment" },
    flat             : { label: I18N.yc_flat   ||"Flat — No Signal",  cls:"law-y", color:"var(--yellow)",
                         note: I18N.yc_flat_note   ||"Ambiguous signal — monitor, no action warranted" },
    partial_inversion: { label: I18N.yc_partial||"Partial Inversion", cls:"law-y", color:"var(--orange)",
                         note: I18N.yc_partial_note||"Caution · Historical false positives exist (1998, 2019)" },
    full_inversion   : { label: I18N.yc_full   ||"Full Inversion",    cls:"law-r", color:"var(--red)",
                         note: I18N.yc_full_note   ||"Recession probable, not certain · Lead time 6–24m" },
  };
  const ycCfg = YC[yc.regime] || { label:"N/A", cls:"", color:"var(--muted)", note:"" };
  addCard(
    I18N.yc_title||"Yield Curve (10Y − 3M)",
    ycV!=null ? (ycV>=0?"+":"")+ycV.toFixed(2)+"%" : "—",
    ycCfg.color,
    "US 10Y: "+fmt(yc.us10y)+"% · US 3M: "+fmt(yc.us3m)+"%",
    ycCfg.note,
    ycCfg.cls, ycCfg.label
  );

  // ── VIX ──────────────────────────────────────────────────
  const vix  = M.vix || {};
  const vixV = vix.valeur;
  const vixC = vix.regime==="complacency"?"var(--orange)":vix.regime==="panic"?"var(--red)":vix.regime==="fear"?"var(--orange)":"var(--green)";
  const vixL = {
    complacency: I18N.vix_complacency||"Complacency",
    normal:      I18N.vix_normal     ||"Normal",
    fear:        I18N.vix_fear       ||"Elevated Fear",
    panic:       I18N.vix_panic      ||"Panic"
  }[vix.regime]||(I18N.signal_na||"N/A");
  const vixSC= vix.regime==="panic"?"law-r":vix.regime==="fear"?"law-y":vix.regime==="complacency"?"law-y":"law-g";
  addCard(
    I18N.vix_title||"VIX — Fear Index",
    vixV!=null ? fmt(vixV) : "—",
    vixC,
    I18N.vix_sub||"< 15 = Complacency · 15–20 = Normal · 20–30 = Fear · > 30 = Panic",
    null,
    vixSC, vixL
  );

  // ── DXY ──────────────────────────────────────────────────
  const dxy  = M.dxy || {};
  const dxyV = dxy.valeur;
  const dxyC = (dxy.chg_pct||0)>0 ? "var(--red)" : "var(--green)";
  const dxyS = (dxy.chg_pct||0)>0 ? (I18N.dxy_bearish||"Bearish for equities") : (I18N.dxy_supportive||"Supportive for equities");
  const dxySC= (dxy.chg_pct||0)>0 ? "law-r" : "law-g";
  const dxyCh= dxy.chg_pct!=null ? ((dxy.chg_pct>=0?"+":"")+dxy.chg_pct.toFixed(2)+"%") : "—";
  const retM = dxy.ret_1m!=null?(dxy.ret_1m>=0?"+":"")+dxy.ret_1m.toFixed(2)+"%":"—";
  addCard(
    I18N.dxy_title||"DXY — US Dollar Index",
    dxyV!=null ? fmt(dxyV) : "—",
    dxyC,
    (I18N.col_today||"Today")+": "+dxyCh+" · "+(I18N.col_1m||"1M")+": "+retM,
    I18N.dxy_sub2||"Strong USD = pressure on commodities & EM equities",
    dxySC, dxyS
  );
})();
</script>
