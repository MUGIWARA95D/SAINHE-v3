<!-- ═══ BOX_01 — MACRO HEALTH ═══════════════════════════════ -->
<style>
/* ── Region Cards (replaces old table) ───────────────────── */
.region-cards{display:flex;flex-wrap:wrap;gap:10px;padding:6px 16px 14px}
.region-card{
  flex:1 1 200px;min-width:175px;
  background:var(--card-alt);border-radius:7px;
  border-left:3px solid var(--border-lt);      /* standard grey — same as .liq-card */
  padding:14px 18px 12px;
}
.rc-header{
  font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--muted);padding-bottom:11px;margin-bottom:8px;  /* muted, not gold */
  border-bottom:1px solid var(--border-lt)
}
.rc-row{
  display:flex;justify-content:space-between;align-items:center;
  min-height:52px;
  padding:8px 0;border-bottom:1px solid var(--border-lt);gap:10px
}
.rc-row:last-child{border-bottom:none;padding-bottom:0}
.rc-label{
  font-size:13px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.4px;line-height:1.3;flex-shrink:0;word-break:break-word
}
.rc-right{text-align:right;min-width:0;overflow:hidden}   /* allow shrink, no overflow */
.rc-val{
  font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;
  line-height:1.2;display:block;white-space:nowrap         /* value stays on one line */
}
.rc-val.sig-g{color:var(--green)}
.rc-val.sig-r{color:var(--red)}
.rc-val.sig-y{color:var(--orange)}
.rc-val.rc-na{color:var(--muted);opacity:.35;font-size:16px;font-weight:400}
.rc-src{
  font-size:12px;color:var(--muted);opacity:.7;display:block;margin-top:2px;
  overflow-wrap:anywhere;word-break:break-word;white-space:normal  /* src wraps, never overflows */
}
.rc-note{
  font-size:12px;color:var(--muted);opacity:.7;padding:6px 16px 4px;
  font-style:italic;line-height:1.6
}

/* ── Section dividers ─────────────────────────────────────── */
.liq-divider-wrap{display:flex;align-items:center;gap:8px;padding:6px 16px 0}
.liq-divider-line{flex:1;height:1px;background:var(--border-lt)}

/* ── Signal cards (ERP, YC, VIX, DXY) ───────────────────── */
.macro-grid{display:flex;flex-wrap:wrap;gap:9px;padding:10px 16px 12px}
.mc{
  display:flex;flex-direction:column;gap:4px;
  padding:12px 16px 11px;border-radius:7px;
  flex:1 1 200px;min-width:160px;
  border-left:3px solid var(--border-lt);
  background:var(--card-alt);transition:background .2s;
  overflow:hidden;
}
.mc.sig-g{background:var(--green-bg);border-left-color:var(--green-border)}
.mc.sig-r{background:var(--red-bg);border-left-color:var(--red-border)}
.mc.sig-y{background:var(--orange-bg);border-left-color:var(--orange-border)}
.mc-label{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);line-height:1.4;word-break:break-word}
.mc-val{font-size:clamp(20px,3.5vw,28px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;word-break:break-word;overflow-wrap:break-word}
.mc-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-top:2px;word-break:break-word}
.mc-sig{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;
  padding:3px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px}

/* ── Global indicators strip ─────────────────────────────── */
#liq-strip{padding:12px 16px 8px}
.liq-section{margin-bottom:16px}
.liq-section-title{
  font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;
  color:var(--muted);border-bottom:1px solid var(--border-lt);padding-bottom:6px;margin-bottom:10px
}
.liq-cards{display:flex;flex-wrap:wrap;gap:9px}
.liq-card{
  display:flex;flex-direction:column;gap:4px;
  padding:12px 16px 10px;border-radius:7px;
  flex:1 1 145px;min-width:115px;
  border-left:3px solid var(--border-lt);
  background:var(--card-alt);transition:background .2s;
  overflow:hidden;
}
.liq-card.na{opacity:.45;border-left-color:transparent}
.liq-card.sig-g{background:var(--green-bg);border-left-color:var(--green-border)}
.liq-card.sig-r{background:var(--red-bg);border-left-color:var(--red-border)}
.liq-card.sig-y{background:var(--orange-bg);border-left-color:var(--orange-border)}
.liq-card-label{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);line-height:1.4;word-break:break-word}
.liq-card-val{font-size:clamp(16px,2.8vw,20px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;word-break:break-word;overflow-wrap:break-word}
.liq-card-val.sig-g{color:var(--green)}
.liq-card-val.sig-r{color:var(--red)}
.liq-card-val.sig-y{color:var(--orange)}
.liq-card-val.na{color:var(--muted)}
.liq-card-sub{font-size:13px;color:var(--muted);line-height:1.5;word-break:break-word}
.liq-card-inf{font-size:12px;color:var(--muted);line-height:1.5;margin-top:3px;font-style:italic;opacity:.85;word-break:break-word}
.liq-footer{font-size:12px;color:var(--muted);text-align:right;padding:2px 16px 10px;opacity:.7}
.liq-divider-label{
  font-size:13px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--muted);white-space:nowrap
}

@media(max-width:700px){
  .mc,.liq-card{flex:1 1 calc(50% - 9px)}
  .region-card{flex:1 1 calc(50% - 10px)}
}
@media(max-width:480px){
  .mc,.liq-card,.region-card{flex:1 1 100%}
}
</style>

<section class="card" id="box-macro">
  <div class="card-h">
    <span class="card-t" data-i18n="box_macro_title">{{ t.box_macro_title }}</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts"><span data-i18n="updated">{{ t.updated }}</span> {{ ts_macro }}</span>
      <span class="badge badge-gold" data-i18n="box_macro_badge">{{ t.box_macro_badge }}</span>
    </div>
  </div>

  <!-- ── 1. Regional overview — 4 cards ── -->
  <div id="region-cards-wrap"></div>

  <!-- ── 2. Global Indicators ── -->
  <div class="liq-divider-wrap" id="div-global" style="display:none">
    <div class="liq-divider-line"></div>
    <span class="liq-divider-label">Global Indicators</span>
    <div class="liq-divider-line"></div>
  </div>
  <div id="liq-strip"></div>

  <!-- ── 3. US Market Signals ── -->
  <div class="liq-divider-wrap" id="div-signals" style="display:none">
    <div class="liq-divider-line"></div>
    <span class="liq-divider-label">US Market Signals</span>
    <div class="liq-divider-line"></div>
  </div>
  <div class="macro-grid" id="mgrid"></div>
</section>

<script>
(function(){
  const M    = {{ box_macro | tojson }};
  const grid = document.getElementById("mgrid");

  window._sainheRenderMacro = function(){
  const I18N = window.SAINHE_I18N || {};
  const LOC  = window.SAINHE_LOCALE || 'en';
  grid.textContent = "";

  function mk(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!=null)el.textContent=txt;return el;}
  function fmt(n,d){return n!=null?n.toLocaleString(LOC,{minimumFractionDigits:d||2,maximumFractionDigits:d||2}):"—";}

  const L   = M.liq  || {};
  const yc  = M.yield_curve || {};
  const erp = M.erp  || {};

  // ── Date helper ────────────────────────────────────────────────────────────
  function asOf(d){
    if(!d) return null;
    try{
      const dt  = new Date(d.length===7 ? d+"-01" : d+"T00:00:00");
      const age = (Date.now()-dt.getTime())/864e5;
      return age>45
        ? dt.toLocaleDateString("en-US",{month:"short",year:"numeric"})
        : dt.toLocaleDateString("en-US",{month:"short",day:"numeric"});
    }catch(e){return d;}
  }

  // ── Format helpers ─────────────────────────────────────────────────────────
  function fmtYld(v){ return v!=null ? v.toFixed(2)+"%" : null; }
  function fmtSpr(v){ return v!=null ? (v>=0?"+":"")+v.toFixed(2)+"%" : null; }
  function fmtPE(v) { return v!=null ? "×"+v.toFixed(1) : null; }
  function fmtM2(v) { return v!=null ? (v>=0?"+":"")+v.toFixed(1)+"%" : null; }
  function fmtOAS(v){ return v!=null ? Math.round(v)+"bp" : null; }
  function fmtT(v)  { return v!=null ? "$"+v.toFixed(2)+"T" : "—"; }
  function fmtB(v)  { return v!=null ? "$"+Math.round(v).toLocaleString()+"B" : "—"; }
  function fmtPct(v,dec){ dec=dec||1; return v!=null?(v>=0?"+":"")+v.toFixed(dec)+"%":"—"; }
  function fmtCu(v) { return v!=null ? "$"+v.toFixed(4)+"/lb" : null; }
  function fmtCuAu(v){ return v!=null ? v.toFixed(4) : null; }
  function fmtJpy(v){ return v!=null ? "¥"+v.toFixed(2) : null; }

  // ── Signal helpers ─────────────────────────────────────────────────────────
  // Curve spread — same 4-regime logic used across the site
  function sprSig(v){
    if(v==null) return "";
    if(v>=1.0)  return "sig-g";  // steep — expansionary
    if(v>=0.0)  return "sig-y";  // flat — neutral
    if(v>=-0.5) return "sig-y";  // partial inversion — caution
    return "sig-r";              // full inversion — stress
  }
  // P/E — long-run avg ~17 (Shiller); >28 = elevated (1.6× avg); >20 = above avg
  function peSig(v){ return v==null?"":(v>28?"sig-r":v>20?"sig-y":"sig-g"); }
  // M2/M3 YoY — historical avg ~5-6%; contraction = deflation risk
  function m2Sig(v){ return v==null?"":(v>=3&&v<=10?"sig-g":v<0?"sig-r":"sig-y"); }
  // HY OAS — ICE BofA; <350bp tight, 350-500bp normal, >500bp stress
  function hySig(v){ return v==null?"":(v>500?"sig-r":v>350?"sig-y":"sig-g"); }
  function wkSig(v){ return v==null?"":(v>0?"sig-g":"sig-r"); }
  function trendSig(t){ return t==="EXPANSION"?"sig-g":t==="CONTRACTION"?"sig-r":t==="MIXED"?"sig-y":""; }
  function capeSig(v){ return v==null?"":(v>34?"sig-r":v>24?"sig-y":"sig-g"); }
  // TIPS 10Y real rate: >2.5% restrictive (red), 0.5-2.5% elevated (orange), <0% repression (green)
  function tipsSig(v){ return v==null?"":(v>2.5?"sig-r":v>0.5?"sig-y":v>=0?"":"sig-g"); }
  // Cu/Au ratio: >0.35 expansion (green), 0.25-0.35 neutral, 0.18-0.25 risk-off (orange), <0.18 stress (red)
  function cuAuSig(v){ return v==null?"":(v>0.35?"sig-g":v>0.25?"":v>0.18?"sig-y":"sig-r"); }
  // JPY/USD: >155 extreme carry (red), >145 BOJ risk (orange), <115 strong yen (green)
  function jpySig(v) { return v==null?"":(v>155?"sig-r":v>145?"sig-y":v>115?"":"sig-g"); }

  // ═══════════════════════════════════════════════════════════════════════════
  // ── 1. REGIONAL CARDS ─────────────────────────────────────────────────────
  // ═══════════════════════════════════════════════════════════════════════════
  const rcWrap = document.getElementById("region-cards-wrap");
  if(rcWrap){
    rcWrap.textContent = "";

    // Row builder: { label, val, cls, src } → null val = "—" greyed
    // Always renders src span (even empty) so all rows share the same height
    function mkRcRow(label, val, cls, src){
      const row = document.createElement("div");
      row.className = "rc-row";
      row.appendChild(mk("span","rc-label",label));
      const right = row.appendChild(mk("div","rc-right"));
      right.appendChild(mk("span","rc-val"+(val?(" "+cls):" rc-na"), val||"—"));
      const srcEl = right.appendChild(mk("span","rc-src"));
      srcEl.textContent = (src && val) ? src : " "; // nbsp locks row height when no data
      return row;
    }

    // Card builder: name + array of rows
    function mkRegionCard(name, rows){
      const card = document.createElement("div");
      card.className = "region-card";
      card.appendChild(mk("div","rc-header",name));
      rows.forEach(r => card.appendChild(mkRcRow(r.label, r.val, r.cls||"", r.src||"")));
      return card;
    }

    const wrap = rcWrap.appendChild(mk("div","region-cards"));

    // ── USA ────────────────────────────────────────────────────────────────
    wrap.appendChild(mkRegionCard("USA", [
      { label:"10Y Yield", val: fmtYld(yc.us10y),    cls:"",                  src:"US Treasury" },
      { label:"Curve",     val: fmtSpr(yc.valeur),   cls:sprSig(yc.valeur),   src:"10Y−3M · NY Fed" },
      { label:"P/E",       val: fmtPE(erp.sp500_pe), cls:peSig(erp.sp500_pe), src:"S&P 500 trailing" },
      { label:"M2 YoY",    val: fmtM2(L.us_m2_yoy),  cls:m2Sig(L.us_m2_yoy),  src:"FRED M2SL"+(L.us_m2_date?" · "+asOf(L.us_m2_date):"") },
      { label:"HY Spread", val: fmtOAS(L.hy_oas_us), cls:hySig(L.hy_oas_us),  src:"ICE BofA US"+(L.hy_oas_us_date?" · "+asOf(L.hy_oas_us_date):"") },
    ]));

    // ── EUROPE ─────────────────────────────────────────────────────────────
    wrap.appendChild(mkRegionCard("Europe", [
      { label:"10Y Yield", val: fmtYld(L.bund_10y),    cls:"",                    src:"Bund · stooq"+(L.bund_date?" · "+asOf(L.bund_date):"") },
      { label:"Curve",     val: fmtSpr(L.bund_spread), cls:sprSig(L.bund_spread), src:"10Y−2Y · stooq" },
      { label:"P/E",       val: fmtPE(L.pe_eu),        cls:peSig(L.pe_eu),        src:"VGK ETF" },
      { label:"M3 YoY",    val: fmtM2(L.eu_m3_yoy),    cls:m2Sig(L.eu_m3_yoy),   src:"ECB SDW"+(L.eu_m3_date?" · "+asOf(L.eu_m3_date):"") },
      { label:"HY Spread", val: fmtOAS(L.hy_oas_eu),   cls:hySig(L.hy_oas_eu),   src:"ICE BofA EU"+(L.hy_oas_eu_date?" · "+asOf(L.hy_oas_eu_date):"") },
    ]));

    // ── JAPAN ─────────────────────────────────────────────────────────────────
    wrap.appendChild(mkRegionCard("Japan", [
      { label:"JGB 10Y", val: fmtYld(L.jgb_10y),    cls:"",                    src:"MoF Japan"+(L.jgb_10y_date?" · "+asOf(L.jgb_10y_date):"") },
      { label:"Curve",   val: fmtSpr(L.jgb_spread),  cls:sprSig(L.jgb_spread), src:"JGB 10Y−2Y · MoF" },
      { label:"P/E",     val: fmtPE(L.pe_jp),        cls:peSig(L.pe_jp),        src:"EWJ ETF" },
      { label:"M2 YoY",  val: null,                  cls:"",                    src:null },
      { label:"JPY/USD", val: fmtJpy(L.jpy_usd),     cls:jpySig(L.jpy_usd),    src:"yfinance JPY=X" },
    ]));

    // ── CHINA ─────────────────────────────────────────────────────────────────
    wrap.appendChild(mkRegionCard("China", [
      { label:"CGB 10Y",   val: fmtYld(L.cgb_10y),     cls:"",                    src:"ChinaBond CCDC"+(L.cgb_date?" · "+asOf(L.cgb_date):"") },
      { label:"Curve",     val: fmtSpr(L.cgb_spread),   cls:sprSig(L.cgb_spread), src:"CGB 10Y−2Y · CCDC" },
      { label:"M2 YoY",    val: fmtM2(L.china_m2_yoy),  cls:m2Sig(L.china_m2_yoy), src:"FRED"+(L.china_m2_date?" · "+asOf(L.china_m2_date):"") },
      { label:"CNH/USD",   val: L.cnh_usd!=null?L.cnh_usd.toFixed(4):null, cls:(L.cnh_usd&&L.cnh_usd>7.3)?"sig-y":"", src:"yfinance CNH=X" },
      { label:"HY Spread", val: null,                    cls:"",                    src:null },
    ]));

    // ── EM ──────────────────────────────────────────────────────────────────
    wrap.appendChild(mkRegionCard("EM", [
      { label:"10Y Yield", val: null,                  cls:"",                  src:null },
      { label:"Curve",     val: null,                  cls:"",                  src:null },
      { label:"P/E",       val: fmtPE(L.pe_em),        cls:peSig(L.pe_em),      src:"EEM ETF" },
      { label:"M2 YoY",    val: null,                  cls:"",                  src:null },
      { label:"HY Spread", val: fmtOAS(L.hy_oas_em),  cls:hySig(L.hy_oas_em),  src:"ICE BofA EM"+(L.hy_oas_em_date?" · "+asOf(L.hy_oas_em_date):"") },
    ]));

    // ── Methodology footnote ────────────────────────────────────────────────
    const note = rcWrap.appendChild(mk("p","rc-note",
      "Curve spread: US uses 10Y−3M (NY Fed Estrella-Mishkin recession model); EU, Japan, China use 10Y−2Y (market convention). "+
      "Japan yields: MoF Japan daily CSV (primary), FRED monthly (fallback). "+
      "China yields: ChinaBond CCDC official source — may be unavailable outside China. "+
      "P/E values are ETF trailing P/E (VGK, EWJ, EEM) — not official index P/E."
    ));
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // ── 2. GLOBAL INDICATORS ──────────────────────────────────────────────────
  // ═══════════════════════════════════════════════════════════════════════════
  {
  const ls  = document.getElementById("liq-strip");
  const dgl = document.getElementById("div-global");

  if(ls && L && L.date){
    if(dgl) dgl.style.display = "flex";
    ls.textContent = "";

    function asOf2(d){
      if(!d) return "";
      try{
        const dt = new Date(d.length===7 ? d+"-01" : d+"T00:00:00");
        return "as of "+(Date.now()-dt.getTime()>45*864e5
          ? dt.toLocaleDateString("en-US",{month:"short",year:"numeric"})
          : dt.toLocaleDateString("en-US",{month:"short",day:"numeric"}));
      }catch(e){return d;}
    }

    function mkCard(label,value,sig,sub,inf){
      const isNA=(value==="—");
      const card=document.createElement("div");
      card.className="liq-card"+(sig&&!isNA?" "+sig:"")+(isNA?" na":"");
      const lbl=card.appendChild(mk("div","liq-card-label",label));
      const val=card.appendChild(mk("div","liq-card-val"+(isNA?" na":(sig?" "+sig:""))));
      val.textContent=value;
      if(sub){const s=card.appendChild(mk("div","liq-card-sub"));s.textContent=sub;}
      if(inf){const i=card.appendChild(mk("div","liq-card-inf"));i.textContent=inf;}
      return card;
    }

    function mkSection(title,cards){
      const sec=ls.appendChild(mk("div","liq-section"));
      sec.appendChild(mk("div","liq-section-title",title));
      const row=sec.appendChild(mk("div","liq-cards"));
      cards.forEach(c=>row.appendChild(c));
    }

    const fedWkTxt=L.fed_walcl_wk_pct!=null?fmtPct(L.fed_walcl_wk_pct,2)+" w/w":null;
    const ecbWkTxt=L.ecb_assets_wk_pct!=null?fmtPct(L.ecb_assets_wk_pct,2)+" w/w":null;

    // ── Central Banks — Fed + ECB balance sheets + plumbing ────────────────
    mkSection("Central Banks — FRED / ECB SDW", [
      mkCard("Fed Balance Sheet",
        fmtT(L.fed_walcl_t), wkSig(L.fed_walcl_wk_pct),
        [fedWkTxt, L.fed_walcl_date?asOf2(L.fed_walcl_date):null].filter(Boolean).join(" · ")||null,
        L.fed_bs_text||null),

      mkCard("ECB Balance Sheet",
        fmtT(L.ecb_assets_t), wkSig(L.ecb_assets_wk_pct),
        [ecbWkTxt, L.ecb_assets_date?asOf2(L.ecb_assets_date):null].filter(Boolean).join(" · ")||null,
        L.ecb_bs_text||null),

      mkCard("CB Trend",
        L.global_cb_trend||"—", trendSig(L.global_cb_trend),
        "Fed + ECB direction combined"),

      mkCard("Reverse Repo (RRP)",
        fmtB(L.rrp_b), null,
        L.rrp_date?asOf2(L.rrp_date):null,
        "Overnight RRP usage — excess liquidity gauge"),

      mkCard("Treasury Acct (TGA)",
        fmtB(L.tga_b), null,
        L.tga_date?asOf2(L.tga_date):null,
        "Gov cash balance — drawdown adds liquidity to system"),
    ]);

    // ── Real Rates & Inflation — FRED ──────────────────────────────────────
    if(L.us_tips_10y!=null || L.us_breakeven_10y!=null){
      mkSection("Real Rates & Inflation — FRED", [
        mkCard("TIPS 10Y Real Yield",
          L.us_tips_10y!=null?L.us_tips_10y.toFixed(2)+"%":"—",
          tipsSig(L.us_tips_10y),
          L.us_tips_date?asOf2(L.us_tips_date):null,
          L.us_tips_text||null),

        mkCard("10Y Inflation Breakeven",
          L.us_breakeven_10y!=null?L.us_breakeven_10y.toFixed(2)+"%":"—",
          null,
          L.us_breakeven_date?asOf2(L.us_breakeven_date):null,
          "Market-implied 10Y avg annual CPI. Breakeven = nominal 10Y − TIPS 10Y."),
      ]);
    }

    // ── Real Economy — yfinance ─────────────────────────────────────────────
    if(L.copper_price!=null || L.jpy_usd!=null){
      mkSection("Real Economy — yfinance", [
        mkCard("Copper Price",
          L.copper_price!=null?("$"+L.copper_price.toFixed(4)+"/lb"):"—", null,
          "HG=F · front month futures",
          null),

        mkCard("Copper / Gold Ratio",
          L.copper_gold_ratio!=null?L.copper_gold_ratio.toFixed(4):"—",
          cuAuSig(L.copper_gold_ratio), null,
          L.copper_text||null),

        mkCard("JPY / USD",
          L.jpy_usd!=null?("¥"+L.jpy_usd.toFixed(2)):"—",
          jpySig(L.jpy_usd), null,
          L.jpy_text||null),
      ]);
    }

    // ── Credit Spreads — FRED / ICE BofA ───────────────────────────────────
    if(L.hy_oas_us!=null || L.hy_oas_eu!=null || L.hy_oas_em!=null){
      mkSection("Credit Spreads — FRED / ICE BofA", [
        mkCard("US HY OAS",
          L.hy_oas_us!=null?Math.round(L.hy_oas_us)+"bp":"—",
          hySig(L.hy_oas_us),
          L.hy_oas_us_date?asOf2(L.hy_oas_us_date):null,
          L.hy_oas_us_text||null),

        mkCard("EU HY OAS",
          L.hy_oas_eu!=null?Math.round(L.hy_oas_eu)+"bp":"—",
          hySig(L.hy_oas_eu),
          L.hy_oas_eu_date?asOf2(L.hy_oas_eu_date):null,
          L.hy_oas_eu_text||null),

        mkCard("EM HY OAS",
          L.hy_oas_em!=null?Math.round(L.hy_oas_em)+"bp":"—",
          hySig(L.hy_oas_em),
          L.hy_oas_em_date?asOf2(L.hy_oas_em_date):null,
          L.hy_oas_em_text||null),
      ]);
    }

    // ── Valuation — multpl.com / yfinance ──────────────────────────────────
    mkSection("Valuation — multpl.com / yfinance", [
      mkCard("Shiller CAPE — US",
        L.cape_us!=null?L.cape_us.toFixed(1):"—", capeSig(L.cape_us),
        L.cape_date?asOf2(L.cape_date):null,
        L.cape_text||null),

      mkCard("Gold / S&P 500 Ratio",
        L.gold_stocks!=null?L.gold_stocks.toFixed(3)+" oz/pt":"—", null, null,
        L.gold_text||null),

      mkCard("Yuan / USD (CNH)",
        L.cnh_usd!=null?L.cnh_usd.toFixed(4):"—",
        (L.cnh_usd&&L.cnh_usd>7.3)?"sig-y":"", null,
        L.cnh_text||null),
    ]);

    const ft=ls.appendChild(mk("div","liq-footer"));
    ft.textContent="Sources: FRED API, ECB SDW, MoF Japan, ChinaBond CCDC, multpl.com, yfinance · as of "+L.date;
  }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // ── 3. US SIGNAL CARDS (ERP, Yield Curve, VIX, DXY) ──────────────────────
  // ═══════════════════════════════════════════════════════════════════════════
  const divSig = document.getElementById("div-signals");
  if(divSig) divSig.style.display = "flex";

  function addCard(label,value,valueColor,sub1,sub2,sigClass,sigText,tip,row){
    const mc=grid.appendChild(mk("div","mc"));
    const sigMap={"law-g":"sig-g","law-r":"sig-r","law-y":"sig-y"};
    if(sigMap[sigClass]) mc.classList.add(sigMap[sigClass]);
    const lbl=mc.appendChild(mk("div","mc-label",label));
    if(tip&&window._ci){lbl.appendChild(window._ci(tip,'macro',row));}
    const val=mc.appendChild(mk("div","mc-val",value));
    if(valueColor)val.style.color=valueColor;
    if(sub1)mc.appendChild(mk("div","mc-sub",sub1));
    if(sub2)mc.appendChild(mk("div","mc-sub",sub2));
    if(sigText){const sig=mc.appendChild(mk("span","mc-sig",sigText));sig.className="mc-sig law-tag "+sigClass;}
  }

  // ── ERP ──────────────────────────────────────────────────────────────────
  const erpV=erp.valeur;
  const erpC=erpV==null?"var(--muted)":erpV>=0.02?"var(--green)":erpV>=0.01?"var(--orange)":"var(--red)";
  const erpS=erpV==null?"N/A":erpV>=0.02?(I18N.erp_attractive||"Attractive"):erpV>=0.01?(I18N.erp_neutral||"Neutral"):(I18N.erp_expensive||"Expensive");
  const erpSC=erpV==null?"":erpV>=0.02?"law-g":erpV>=0.01?"law-y":"law-r";
  const ey=erp.sp500_pe?(100/erp.sp500_pe).toFixed(2)+"%":"—";
  addCard(I18N.erp_title||"Equity Risk Premium",erpV!=null?(erpV*100).toFixed(2)+"%":"—",erpC,
    (I18N.erp_earnings_yield||"Earnings Yield")+": "+ey+" · P/E "+(erp.sp500_pe!=null?erp.sp500_pe.toFixed(1):"—")+" · 10Y "+fmt(yc.us10y)+"%",
    erp.text||null, erpSC,erpS,
    "Damodaran CAPM: earnings yield minus risk-free rate.","erp");

  // ── Yield Curve ───────────────────────────────────────────────────────────
  const ycV=yc.valeur;
  const YC={
    steep:{label:I18N.yc_steep||"Steep — Expansion",cls:"law-g",color:"var(--green)"},
    flat:{label:I18N.yc_flat||"Flat — No Signal",cls:"law-y",color:"var(--orange)"},
    partial_inversion:{label:I18N.yc_partial||"Partial Inversion",cls:"law-y",color:"var(--orange)"},
    full_inversion:{label:I18N.yc_full||"Full Inversion",cls:"law-r",color:"var(--red)"},
  };
  const ycCfg=YC[yc.regime]||{label:"N/A",cls:"",color:"var(--muted)"};
  addCard(I18N.yc_title||"Yield Curve (10Y − 3M)",ycV!=null?(ycV>=0?"+":"")+ycV.toFixed(2)+"%":"—",ycCfg.color,
    "US 10Y: "+fmt(yc.us10y)+"% · US 3M: "+fmt(yc.us3m)+"%",yc.text||null,
    ycCfg.cls,ycCfg.label,"NY Fed model: 10Y minus 3M Treasury.","yc");

  // ── VIX ──────────────────────────────────────────────────────────────────
  const vix=M.vix||{};const vixV=vix.valeur;
  const vixC=vix.regime==="panic"?"var(--red)":vix.regime==="fear"?"var(--orange)":vix.regime==="complacency"?"var(--orange)":"var(--green)";
  const vixL={complacency:I18N.vix_complacency||"Complacency",normal:I18N.vix_normal||"Normal",fear:I18N.vix_fear||"Elevated Fear",panic:I18N.vix_panic||"Panic"}[vix.regime]||(I18N.signal_na||"N/A");
  const vixSC=vix.regime==="panic"?"law-r":vix.regime==="fear"?"law-y":vix.regime==="complacency"?"law-y":"law-g";
  addCard(I18N.vix_title||"VIX — Market Fear Index",vixV!=null?fmt(vixV):"—",vixC,
    vix.text||null,null, vixSC,vixL,
    "CBOE VIX White Paper: implied 30-day S&P 500 volatility.","vix");

  // ── DXY ──────────────────────────────────────────────────────────────────
  const dxy=M.dxy||{};const dxyV=dxy.valeur;
  const dxyChg=dxy.chg_pct||0;
  const dxyC=dxyChg>0?"var(--red)":"var(--green)";
  const dxyS=dxyChg>0?(I18N.dxy_bearish||"Bearish for risk assets"):(I18N.dxy_supportive||"Supportive for risk assets");
  const dxySC=dxyChg>0?"law-r":"law-g";
  const dxyCh=dxy.chg_pct!=null?((dxy.chg_pct>=0?"+":"")+(dxy.chg_pct*100).toFixed(2)+"%"):"—";
  const retM=dxy.ret_1m!=null?(dxy.ret_1m>=0?"+":"")+(dxy.ret_1m*100).toFixed(2)+"%":"—";
  addCard(I18N.dxy_title||"DXY — US Dollar Index",dxyV!=null?fmt(dxyV):"—",dxyC,
    (I18N.col_today||"Today")+": "+dxyCh+" · "+(I18N.col_1m||"1 month")+": "+retM,
    dxy.text||null, dxySC,dxyS,
    "ICE US Dollar Index vs basket of 6 major currencies.","dxy");

  // ── TIPS Real Rate ────────────────────────────────────────────────────────
  const tipsV=L.us_tips_10y;
  if(tipsV!=null){
    const tipsC=tipsV>2.5?"var(--red)":tipsV>0.5?"var(--orange)":tipsV>=0?"var(--muted)":"var(--green)";
    const tipsLabel=tipsV>2.5?"Restrictive":tipsV>0.5?"Elevated":tipsV>=0?"Neutral":"Repression";
    const tipsSC=tipsV>2.5?"law-r":tipsV>0.5?"law-y":tipsV>=0?"":"law-g";
    const bkStr=L.us_breakeven_10y!=null?" · Bkeven "+L.us_breakeven_10y.toFixed(2)+"%":"";
    addCard("TIPS 10Y — Real Rate",tipsV.toFixed(2)+"%",tipsC,
      "10Y real yield (inflation-adjusted)"+bkStr,
      L.us_tips_text||null, tipsSC,tipsLabel,
      "FRED DFII10: nominal 10Y minus inflation breakeven. Positive = rates above inflation.","tips");
  }

  }; /* end _sainheRenderMacro */
  window._sainheRenderMacro();
})();
</script>
