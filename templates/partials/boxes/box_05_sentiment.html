<!-- ═══ BOX_05 — SENTIMENT ANALYSIS ════════════════════════ -->
<!-- DATA: box_sentiment = {global_avg, global_label, secteurs:[{secteur,sentiment_score,sentiment_label,couleur,mfi,obv_dir,above_dma200,rvol,chg_pct}]} -->
<section class="card" id="box-sentiment">
  <div class="card-h">
    <span class="card-t" data-i18n="box_sentiment_title">{{ t.box_sentiment_title }}</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts"><span data-i18n="updated">{{ t.updated }}</span> {{ ts_sentiment }}</span>
      <span class="badge badge-gold" data-i18n="box_sentiment_badge">{{ t.box_sentiment_badge }}</span>
    </div>
  </div>
  <div class="sector-grid" id="scgrid"></div>
</section>
<script>
(function(){
  const ANA  = {{ box_sentiment.secteurs | tojson }};
  const grid = document.getElementById("scgrid");

  function mk(tag, cls, txt){ const el=document.createElement(tag); if(cls)el.className=cls; if(txt!=null)el.textContent=txt; return el; }
  function tag(cls, txt){ const el=mk("span","law-tag "+cls,txt); return el; }

  function renderSentiment(){
  const I18N = window.SAINHE_I18N || {};
  grid.textContent = "";
  ANA.forEach(a => {
    const secName = (I18N.sectors && I18N.sectors[a.secteur]) || a.secteur;
    const sc   = a.sentiment_score != null ? a.sentiment_score : 0;
    const pct  = Math.round((sc + 1) / 2 * 100);
    const col  = a.couleur || "var(--muted)";
    const chg  = a.chg_pct != null ? (a.chg_pct>=0?"+":"") + (a.chg_pct*100).toFixed(2) + "%" : "—";
    const obvC = a.obv_dir==="up" ? "law-g" : a.obv_dir==="down" ? "law-r" : "law-y";
    const obvL = a.obv_dir==="up" ? (I18N.sent_accumulation||"ACCUMULATION") : a.obv_dir==="down" ? (I18N.sent_distribution||"DISTRIBUTION") : (I18N.sent_neutral||"NEUTRAL");
    const mfiC = a.mfi!=null ? (a.mfi>70?"law-g":a.mfi<30?"law-r":"law-y") : "law-y";
    const mfiL = a.mfi!=null ? (a.mfi>70?(I18N.sent_overbought||"OVERBOUGHT"):a.mfi<30?(I18N.sent_oversold||"OVERSOLD"):(I18N.sent_neutral||"NEUTRAL")) : (I18N.signal_na||"N/A");
    const dmaC = a.above_dma200 ? "law-g" : "law-r";
    const dmaL = a.above_dma200 ? (I18N.sent_above_dma||"ABOVE DMA200") : (I18N.sent_below_dma||"BELOW DMA200");

    const card = mk("div","sc");

    // Header
    const hdr = card.appendChild(mk("div","sc-hdr"));
    hdr.appendChild(mk("span","sc-name",secName));

    // Score + methodology tooltip
    const infoWrap = hdr.appendChild(mk("span","sc-info"));
    const sc_el = infoWrap.appendChild(mk("span","sc-score",(sc>=0?"+":"")+sc.toFixed(2)));
    sc_el.style.color = col;
    infoWrap.appendChild(mk("span","sc-info-btn","i"));
    const tip = infoWrap.appendChild(mk("span","sc-tip"));
    tip.appendChild(mk("div","sc-tip-title", I18N.sent_methodology||"Methodology"));
    [
      [I18N.sent_obv_direction||"OBV direction", I18N.sent_obv_window||"20d window"],
      [I18N.sent_mfi||"MFI",                     I18N.sent_mfi_window||"14d window"],
      [I18N.sent_dma||"DMA",                     I18N.sent_dma_period||"200-day"],
      [I18N.sent_rvol_baseline||"RVOL baseline",  I18N.sent_rvol_window||"20d avg"]
    ].forEach(function(pair){
      const row = tip.appendChild(mk("div","sc-tip-row"));
      row.appendChild(mk("span",null,pair[0]));
      row.appendChild(mk("span",null,pair[1]));
    });
    tip.appendChild(mk("div","sc-tip-div"));
    const formula = tip.appendChild(mk("div","sc-tip-formula"));
    formula.appendChild(mk("b",null,I18N.col_score||"Score"));
    formula.appendChild(document.createTextNode(I18N.sent_formula||" = MFI×40% + OBV×30% + DMA200×30%"));

    // Gauge
    const gauge = card.appendChild(mk("div","gauge"));
    const fill  = gauge.appendChild(mk("div","gauge-fill"));
    fill.style.cssText = `width:${pct}%;background:${col}`;
    const dot = gauge.appendChild(mk("div","gauge-dot"));
    dot.style.cssText = `left:calc(${pct}% - 5px);background:${col}`;

    // Label
    const lbl = card.appendChild(mk("div",null,a.sentiment_label||"N/A"));
    lbl.style.cssText = `font-size:10px;color:${col};font-weight:600;margin-bottom:6px`;

    // Laws
    const laws = card.appendChild(mk("div","laws"));
    function addLaw(tagCls, tagTxt, labelTxt){
      const row = laws.appendChild(mk("div","law"));
      row.appendChild(tag(tagCls, tagTxt));
      row.appendChild(document.createTextNode(" "+labelTxt));
    }
    addLaw(obvC, obvL, I18N.sent_obv_direction_label||"OBV Direction");
    addLaw(mfiC, (I18N.sent_mfi||"MFI")+" "+(a.mfi!=null?Math.round(a.mfi):"—"), mfiL);
    addLaw(dmaC, dmaL, I18N.sent_vs_dma||"vs DMA200");

    // Footer
    card.appendChild(mk("div","sc-foot",(I18N.col_today||"Today")+": "+chg+" · "+(I18N.col_rvol||"RVOL")+": "+(a.rvol!=null?a.rvol.toFixed(2):"—")));

    grid.appendChild(card);
  });

  if (!ANA.length){
    const empty = grid.appendChild(mk("div"));
    empty.style.cssText = "padding:30px;color:var(--muted);text-align:center;grid-column:1/-1";
    empty.textContent = I18N.no_data_sentiment||"No sentiment data";
  }
  } /* end renderSentiment */

  window._sainheRenderSentiment = renderSentiment;
  renderSentiment();
})();
</script>
