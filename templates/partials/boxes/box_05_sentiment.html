<!-- ═══ BOX_05 — SECTOR MAP ══════════════════════════════════════════ -->
<!-- Region tabs on top, 16 sector rows (fixed order for cross-region    -->
<!-- comparison), timeframe tabs on bottom. Click expands the row in a   -->
<!-- '3×3' inline panel — neighboring rows are dimmed behind.            -->
<style>
/* ── Hero strip ─────────────────────────────────────────────── */
#sm-hero{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:14px 22px;border-bottom:1px solid var(--border-lt);flex-wrap:wrap;
}
.sm-hero-block{display:flex;align-items:center;gap:10px;font-family:var(--sans)}
.sm-hero-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:700}
.sm-hero-value{font-size:16px;font-weight:700;color:var(--h);font-variant-numeric:tabular-nums}
.sm-hero-sub{font-size:11.5px;color:var(--muted)}
.sm-hero-chip{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:4px 10px;border-radius:999px;text-transform:uppercase;
}
.sm-hero-chip.healthy {background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sm-hero-chip.narrow  {background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.sm-hero-chip.riskoff {background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.sm-hero-chip.riskon  {background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sm-hero-chip.neutral {background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.sm-hero-chip.na      {background:var(--card-alt);color:var(--muted);border:1px solid var(--border-lt)}

/* ── Column headers ─────────────────────────────────────────── */
.sm-list-hdr{
  display:grid;
  grid-template-columns:minmax(160px,2fr) 88px minmax(140px,1.4fr) 110px;
  gap:14px;align-items:center;padding:9px 22px;
  font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);font-weight:700;border-bottom:1px solid var(--border-lt);
  background:var(--card-alt);
}

/* ── List wrap + rows ──────────────────────────────────────── */
#sm-list-wrap{position:relative;overflow:visible}
#sm-list{display:flex;flex-direction:column}

.sm-row{
  display:grid;
  grid-template-columns:minmax(160px,2fr) 88px minmax(140px,1.4fr) 110px;
  gap:14px;align-items:center;padding:14px 22px;
  border-bottom:1px solid var(--border-lt);cursor:pointer;
  position:relative;
  /* Default subtle background — overridden by --row-bg + border per row */
  background:var(--card);
  border-left:4px solid transparent;
  transition:filter .25s ease, opacity .25s ease, background .15s, padding .15s;
}
.sm-row.alpha-pos{background:var(--row-bg, var(--green-bg)); border-left-color:var(--green-border)}
.sm-row.alpha-neg{background:var(--row-bg, var(--red-bg));   border-left-color:var(--red-border)}
.sm-row.alpha-nu {background:var(--card-alt);                 border-left-color:var(--border-lt)}
.sm-row:hover:not(.expanded):not(.null){filter:brightness(1.02)}
.sm-row.null{
  opacity:.45;cursor:default;
  background:repeating-linear-gradient(45deg, transparent, transparent 8px, var(--card-alt) 8px, var(--card-alt) 14px)!important;
  border-left-color:var(--border-lt)!important;
}

/* "3×3 zoom" effect: neighbors fade & blur behind, expanded row pops */
#sm-list.has-expanded .sm-row:not(.expanded){
  filter:blur(1.4px) saturate(.7);opacity:.45;pointer-events:none;
}
.sm-row.expanded{
  z-index:5;position:relative;
  padding-top:18px;padding-bottom:20px;
  box-shadow:0 8px 28px rgba(60,40,15,.10), 0 2px 6px rgba(60,40,15,.06);
  border-color:var(--gold-border)!important;
}

/* ── Cells (recto compact) ─────────────────────────────────── */
.sm-c-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.sm-c-sector{font-family:var(--serif);font-size:14px;color:var(--h);font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-c-ticker{font-size:10px;color:var(--muted);letter-spacing:.4px;font-variant-numeric:tabular-nums}

.sm-c-score{
  font-family:var(--sans);font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;
  text-align:center;padding:5px 8px;border-radius:5px;background:rgba(255,255,255,.55);
}
[data-theme="dark"] .sm-c-score{background:rgba(0,0,0,.25)}

.sm-c-alpha{display:flex;flex-direction:column;gap:4px}
.sm-c-alpha-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sm-c-alpha-bar{height:3px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;position:relative}
[data-theme="dark"] .sm-c-alpha-bar{background:rgba(255,255,255,.10)}
.sm-c-alpha-fill{position:absolute;top:0;bottom:0;background:var(--alpha-fill, var(--gold));transition:all .25s}

.sm-c-sigs{display:flex;justify-content:center;align-items:center;gap:6px}
.sm-sig{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:5px;font-size:11px;font-weight:700;font-family:var(--sans);
  line-height:1;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);
}
[data-theme="dark"] .sm-sig{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.08)}
.sm-sig .lab{display:none}   /* tiny label hidden on recto, shown on verso via .sm-detail */
.sm-sig.up   {color:var(--green)}
.sm-sig.dn   {color:var(--red)}
.sm-sig.warn {color:var(--orange)}
.sm-sig.nu   {color:var(--muted)}

/* ── Expanded "verso" panel (the 12 raw fields) ──────────── */
.sm-detail{
  grid-column:1 / -1;
  padding:18px 0 4px;margin-top:12px;
  border-top:1px dashed var(--border);
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;
  animation:smReveal .3s cubic-bezier(.2,.6,.2,1);
}
@keyframes smReveal{
  from{opacity:0;transform:translateY(-6px)}
  to  {opacity:1;transform:translateY(0)}
}
.sm-detail-col{display:flex;flex-direction:column;gap:10px}
.sm-detail-tit{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.sm-detail-block{
  background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);border-radius:6px;
  padding:9px 11px;display:flex;flex-direction:column;gap:3px;
}
[data-theme="dark"] .sm-detail-block{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.08)}
.sm-detail-block.up{border-left:3px solid var(--green-border)}
.sm-detail-block.dn{border-left:3px solid var(--red-border)}
.sm-detail-block.warn{border-left:3px solid var(--orange-border)}
.sm-detail-tag{font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.sm-detail-val{font-size:14px;font-weight:700;color:var(--h);font-variant-numeric:tabular-nums;line-height:1.2}
.sm-detail-sub{font-size:10.5px;color:var(--muted);line-height:1.45}

.sm-detail-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-detail-cell{
  background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);border-radius:5px;
  padding:6px 4px;text-align:center;
}
[data-theme="dark"] .sm-detail-cell{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.08)}
.sm-detail-cell.active{border-color:var(--gold);background:var(--gold-bg)}
.sm-detail-cell .tf  {font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sm-detail-cell .vv  {font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}

.sm-detail-meta{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:10.5px;color:var(--muted)}
.sm-detail-meta b{color:var(--p);font-weight:600;font-variant-numeric:tabular-nums}

.sm-detail-bias{
  font-size:11.5px;color:var(--p);line-height:1.55;font-style:italic;
  padding:9px 12px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:5px;
}

.sm-detail-close{
  position:absolute;top:10px;right:14px;
  background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;
  padding:4px 8px;border-radius:4px;font-weight:700;
}
.sm-detail-close:hover{color:var(--h);background:rgba(0,0,0,.05)}

/* ── Responsive ─────────────────────────────────────────── */
@media(max-width:700px){
  #sm-hero{padding:12px 14px;gap:8px}
  .sm-hero-value{font-size:14px}
  /* On mobile: drop the score column to free width for alpha + signals */
  .sm-list-hdr, .sm-row{
    grid-template-columns:minmax(110px,1.6fr) minmax(80px,1fr) 80px;
    gap:8px;padding:11px 14px;
  }
  .sm-list-hdr .sm-h-score, .sm-row .sm-c-score{display:none}
  .sm-c-sector{font-size:12.5px}
  .sm-c-alpha-val{font-size:14px}
  .sm-sig{width:22px;height:22px;font-size:10.5px}
  .sm-detail{grid-template-columns:1fr;gap:10px;padding-top:14px}
}
</style>

<section class="card" id="box-sentiment">
  <div class="card-h">
    <span class="card-t">Sector Map — Rotation & Breadth</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts"><span>Updated</span> {{ ts_sentiment }}</span>
      <span class="badge badge-gold">DMA · MFI · OBV · Breadth · Regime</span>
    </div>
  </div>

  <!-- Hero strip: breadth + regime -->
  <div id="sm-hero">
    <div class="sm-hero-block">
      <span class="sm-hero-label">Breadth</span>
      <span class="sm-hero-value" id="sm-breadth-val">—</span>
      <span class="sm-hero-chip na" id="sm-breadth-chip">—</span>
    </div>
    <div class="sm-hero-block">
      <span class="sm-hero-label">Regime</span>
      <span class="sm-hero-chip na" id="sm-regime-chip">—</span>
      <span class="sm-hero-sub" id="sm-regime-sub">—</span>
    </div>
  </div>

  <!-- Region tabs (top) -->
  <div class="tabs" id="sm-ztabs">
    <button class="tab active" data-z="MONDE">World</button>
    <button class="tab" data-z="USA">USA</button>
    <button class="tab" data-z="EU">Europe</button>
    <button class="tab" data-z="ASIE">Asia</button>
  </div>

  <!-- Column headers -->
  <div class="sm-list-hdr">
    <span>Sector</span>
    <span class="sm-h-score" style="text-align:center">Score</span>
    <span id="sm-h-perf">Alpha 3M</span>
    <span style="text-align:center">DMA · MFI · OBV</span>
  </div>

  <!-- Sector rows (rendered by JS) -->
  <div id="sm-list-wrap"><div id="sm-list"></div></div>

  <!-- Timeframe tabs (bottom) -->
  <div class="ptabs" id="sm-ptabs">
    <button class="ptab" data-tf="chg_pct">Today</button>
    <button class="ptab" data-tf="1m">1M</button>
    <button class="ptab active" data-tf="3m">3M</button>
    <button class="ptab" data-tf="6m">6M</button>
    <button class="ptab" data-tf="1y">1Y</button>
  </div>
</section>

<script>
(function(){
  const DATA = {{ box_sentiment | tojson }};
  const list = document.getElementById("sm-list");
  if(!list) return;

  let REGION = "MONDE";
  let TF = "3m";
  try {
    const sZ = localStorage.getItem("sm_region"); if(sZ && /^(MONDE|USA|EU|ASIE)$/.test(sZ)) REGION = sZ;
    const sT = localStorage.getItem("sm_tf");     if(sT && /^(chg_pct|1m|3m|6m|1y)$/.test(sT)) TF = sT;
  } catch(e){}

  let expandedKey = null;

  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function fmtPct(v, d){ if(v==null||!isFinite(v)) return "—"; const p = v*100; return (p>=0?"+":"") + p.toFixed(d==null?1:d) + "%"; }
  function fmtScore(v){ if(v==null||!isFinite(v)) return "—"; return (v>=0?"+":"") + v.toFixed(2); }
  function fmtNum(v, d){ if(v==null||!isFinite(v)) return "—"; return Number(v).toFixed(d==null?2:d); }

  function metricKeyFor(region, tf){
    if(tf === "chg_pct") return "chg_pct";
    return region === "MONDE" ? ("ret_" + tf) : ("alpha_" + tf);
  }
  function metricHeader(){
    if(TF === "chg_pct") return "Today";
    const tf = TF.toUpperCase();
    return (REGION === "MONDE" ? "Return " : "Alpha ") + tf;
  }

  // Magnitude cap for color saturation (5% = full saturation)
  const ALPHA_CAP = 0.05;
  function colorClass(v){
    if(v == null || !isFinite(v)) return "alpha-nu";
    if(Math.abs(v) < 0.001) return "alpha-nu";
    return v >= 0 ? "alpha-pos" : "alpha-neg";
  }
  function rowBgFor(v){
    // Subtle HSL background; opacity ramps with |v|
    if(v == null || !isFinite(v)) return null;
    const t = Math.min(1, Math.abs(v) / ALPHA_CAP);
    const hue = v >= 0 ? 135 : 10;
    const sat = Math.round(45 + 25 * t);
    const light = Math.round(94 - 9 * t);
    return `hsl(${hue}, ${sat}%, ${light}%)`;
  }
  function rowBgForDark(v){
    if(v == null || !isFinite(v)) return null;
    const t = Math.min(1, Math.abs(v) / ALPHA_CAP);
    const hue = v >= 0 ? 135 : 10;
    return `hsla(${hue}, 55%, 38%, ${0.12 + 0.18*t})`;
  }
  function alphaTextColor(v){
    if(v == null || !isFinite(v)) return "var(--muted)";
    if(Math.abs(v) < 0.001) return "var(--p)";
    return v >= 0 ? "var(--green)" : "var(--red)";
  }
  function alphaBarPct(v){
    if(v == null || !isFinite(v)) return 0;
    return Math.min(100, Math.abs(v) / ALPHA_CAP * 50);
  }

  // ── Hero ──────────────────────────────────────────────────────────
  function renderHero(){
    const b = DATA.breadth || {};
    const r = DATA.regime || {};
    const bVal = document.getElementById("sm-breadth-val");
    const bChip = document.getElementById("sm-breadth-chip");
    bVal.textContent = b.count_total ? `${b.count_above}/${b.count_total} above DMA200 · ${b.pct}%` : "n/a";
    bChip.textContent = b.label || "—";
    bChip.className = "sm-hero-chip " + (
      b.label === "Healthy"   ? "healthy" :
      b.label === "Narrowing" ? "narrow"  :
      b.label === "Risk-off"  ? "riskoff" : "na");

    const rChip = document.getElementById("sm-regime-chip");
    const rSub  = document.getElementById("sm-regime-sub");
    rChip.textContent = r.label || "—";
    rChip.className = "sm-hero-chip " + (
      r.label === "RISK-ON"  ? "riskon"  :
      r.label === "RISK-OFF" ? "riskoff" :
      r.label === "NEUTRAL"  ? "neutral" : "na");
    const parts = [];
    if(r.vix    != null) parts.push(`VIX ${r.vix}`);
    if(r.curve  != null) parts.push(`Curve ${r.curve >= 0 ? "+" : ""}${r.curve}%`);
    if(r.hy_oas != null) parts.push(`HY ${r.hy_oas}bps`);
    rSub.textContent = parts.join(" · ");
  }

  // ── Signals trio (recto compact) ─────────────────────────────────
  function buildSigsTrio(cell){
    const wrap = el("div", "sm-c-sigs");
    function s(ch, klass, title){
      const sp = el("div", "sm-sig " + klass, ch);
      sp.title = title; return sp;
    }
    // DMA
    if(cell.dma_signal === "above")      wrap.appendChild(s("D", "up",   "DMA200 above — long-term uptrend"));
    else if(cell.dma_signal === "below") wrap.appendChild(s("D", "dn",   "DMA200 below — long-term downtrend"));
    else                                  wrap.appendChild(s("D", "nu",   "DMA200 n/a"));
    // MFI
    if(cell.mfi_signal === "overbought")     wrap.appendChild(s("M", "warn", "MFI overbought >70"));
    else if(cell.mfi_signal === "oversold")  wrap.appendChild(s("M", "up",   "MFI oversold <30 — contrarian opportunity"));
    else if(cell.mfi_signal === "neutral")   wrap.appendChild(s("M", "nu",   "MFI neutral 30-70"));
    else                                      wrap.appendChild(s("M", "nu",   "MFI n/a"));
    // OBV
    if(cell.obv_signal === "accumulation")     wrap.appendChild(s("O", "up",   "OBV accumulation — money in"));
    else if(cell.obv_signal === "distribution") wrap.appendChild(s("O", "dn",   "OBV distribution — money out"));
    else if(cell.obv_signal === "neutral")     wrap.appendChild(s("O", "nu",   "OBV neutral"));
    else                                        wrap.appendChild(s("O", "nu",   "OBV n/a"));
    return wrap;
  }

  // ── Detail panel (verso, the "12 raw points") ────────────────────
  function buildDetail(cell, region, sector){
    const det = el("div", "sm-detail");

    // CLOSE button
    const closeBtn = el("button", "sm-detail-close", "×");
    closeBtn.title = "Close (Esc)";
    closeBtn.addEventListener("click", (ev) => { ev.stopPropagation(); collapseAll(); });
    det.appendChild(closeBtn);

    // COL 1 — Alphas 4-TF + Meta
    const col1 = el("div", "sm-detail-col");
    col1.appendChild(el("div", "sm-detail-tit", region === "MONDE" ? "Return at each timeframe" : "Alpha vs MONDE benchmark"));
    const grid4 = el("div", "sm-detail-grid4");
    [["1m","1M"],["3m","3M"],["6m","6M"],["1y","1Y"]].forEach(([k, lbl]) => {
      const c = el("div", "sm-detail-cell" + (TF === k ? " active" : ""));
      c.appendChild(el("div", "tf", lbl));
      const v = region === "MONDE" ? cell["ret_" + k] : cell["alpha_" + k];
      const vEl = el("div", "vv", v == null ? "—" : fmtPct(v));
      vEl.style.color = alphaTextColor(v);
      c.appendChild(vEl);
      grid4.appendChild(c);
    });
    col1.appendChild(grid4);

    // Meta line
    const meta = el("div", "sm-detail-meta");
    if(cell.close   != null){ const m = el("span"); m.innerHTML = `Close <b>${fmtNum(cell.close)}</b>`; meta.appendChild(m); }
    if(cell.chg_pct != null){ const m = el("span"); m.innerHTML = `Today <b>${fmtPct(cell.chg_pct)}</b>`; meta.appendChild(m); }
    if(cell.dma_200 != null){ const m = el("span"); m.innerHTML = `DMA200 <b>${fmtNum(cell.dma_200)}</b>`; meta.appendChild(m); }
    if(cell.dma_50  != null){ const m = el("span"); m.innerHTML = `DMA50 <b>${fmtNum(cell.dma_50)}</b>`; meta.appendChild(m); }
    if(cell.score   != null){ const m = el("span"); m.innerHTML = `Score <b>${fmtScore(cell.score)}</b>`; meta.appendChild(m); }
    if(cell.label){            const m = el("span"); m.innerHTML = `Label <b>${cell.label}</b>`; meta.appendChild(m); }
    col1.appendChild(meta);
    det.appendChild(col1);

    // COL 2 — 3 signals detailed
    const col2 = el("div", "sm-detail-col");
    col2.appendChild(el("div", "sm-detail-tit", "Triangulation — DMA · MFI · OBV"));
    function block(tag, val, sub, kind){
      const b = el("div", "sm-detail-block " + (kind || ""));
      b.appendChild(el("div", "sm-detail-tag", tag));
      b.appendChild(el("div", "sm-detail-val", val));
      if(sub) b.appendChild(el("div", "sm-detail-sub", sub));
      return b;
    }
    const dmaKind = cell.dma_signal === "above" ? "up" : cell.dma_signal === "below" ? "dn" : "";
    col2.appendChild(block("DMA200 — long-term trend",
      cell.dma_signal === "above" ? "ABOVE DMA200" : cell.dma_signal === "below" ? "BELOW DMA200" : "N/A",
      cell.close != null && cell.dma_200 != null ? `close ${fmtNum(cell.close)} vs DMA200 ${fmtNum(cell.dma_200)}` : "200-day moving average position",
      dmaKind));

    const mfiKind = cell.mfi_signal === "overbought" ? "warn" : cell.mfi_signal === "oversold" ? "up" : "";
    col2.appendChild(block("MFI 14d — short-term flow intensity",
      cell.mfi_value != null ? "MFI " + Math.round(cell.mfi_value) : "MFI —",
      cell.mfi_signal === "overbought" ? "Overbought >70 — pause, don't add" :
      cell.mfi_signal === "oversold"   ? "Oversold <30 — contrarian opportunity" :
      cell.mfi_signal === "neutral"    ? "Neutral 30-70 — no extreme" : "n/a",
      mfiKind));

    const obvKind = cell.obv_signal === "accumulation" ? "up" : cell.obv_signal === "distribution" ? "dn" : "";
    col2.appendChild(block("OBV 20d — smart money flow",
      cell.obv_signal === "accumulation" ? "ACCUMULATION" :
      cell.obv_signal === "distribution" ? "DISTRIBUTION" :
      cell.obv_signal === "neutral"      ? "NEUTRAL" : "N/A",
      "On-balance volume direction (Granville 1963)",
      obvKind));
    det.appendChild(col2);

    // COL 3 — Bias guard + regime
    const col3 = el("div", "sm-detail-col");
    col3.appendChild(el("div", "sm-detail-tit", "Read & act"));
    const bias = buildBias(cell);
    if(bias){
      col3.appendChild(el("div", "sm-detail-bias", bias));
    }
    // Regime mini-context
    if(DATA.regime){
      const rb = el("div", "sm-detail-block");
      rb.appendChild(el("div", "sm-detail-tag", "Ambient regime"));
      rb.appendChild(el("div", "sm-detail-val", DATA.regime.label || "—"));
      const sub = [];
      if(DATA.regime.vix    != null) sub.push(`VIX ${DATA.regime.vix}`);
      if(DATA.regime.curve  != null) sub.push(`Curve ${DATA.regime.curve >= 0 ? "+" : ""}${DATA.regime.curve}%`);
      if(DATA.regime.hy_oas != null) sub.push(`HY OAS ${DATA.regime.hy_oas}bps`);
      if(sub.length) rb.appendChild(el("div", "sm-detail-sub", sub.join(" · ")));
      col3.appendChild(rb);
    }
    if(cell.ticker){
      const tb = el("div", "sm-detail-block");
      tb.appendChild(el("div", "sm-detail-tag", "Ticker"));
      tb.appendChild(el("div", "sm-detail-val", cell.ticker));
      tb.appendChild(el("div", "sm-detail-sub", region));
      col3.appendChild(tb);
    }
    det.appendChild(col3);

    return det;
  }

  function buildBias(c){
    if(c.dma_signal === "above" && c.score != null && c.score >= 0.4) return "Trend confirmed + accumulation. Hold; scale in on pullbacks. Watch for euphoria above +0.6.";
    if(c.dma_signal === "below" && c.score != null && c.score <= -0.4) return "Trend down + distribution. Avoid adding. Wait for stabilization above DMA200 before re-entry.";
    if(c.dma_signal === "above" && c.mfi_signal === "overbought") return "Trend healthy but short-term overbought (MFI >70). Don't chase — wait for a normal pullback.";
    if(c.dma_signal === "below" && c.mfi_signal === "oversold")   return "Trend weak but capitulation flagged (MFI <30). Contrarian — small position only.";
    if(c.dma_signal === "above" && c.obv_signal === "distribution") return "Long-term uptrend but smart money rotating out. Tight stops, watch for follow-through.";
    if(c.dma_signal === "above") return "Long-term uptrend intact. Sentiment mixed short-term — patience.";
    if(c.dma_signal === "below") return "Long-term downtrend. Default stance: avoid until trend repairs.";
    return null;
  }

  // ── Row build ────────────────────────────────────────────────────
  function buildRow(sector){
    const cell = DATA.grid?.[REGION]?.[sector] || {coverage: false};
    const row = el("div", "sm-row");
    const key = REGION + "|" + sector;
    row.dataset.key = key;

    if(!cell.coverage){
      row.classList.add("null");
      const nameWrap = el("div", "sm-c-name");
      nameWrap.appendChild(el("div", "sm-c-sector", sector));
      nameWrap.appendChild(el("div", "sm-c-ticker", "no ETF in region"));
      row.appendChild(nameWrap);
      row.appendChild(el("div"));   // score placeholder
      row.appendChild(el("div"));   // alpha placeholder
      row.appendChild(el("div"));   // sigs placeholder
      return row;
    }

    const v = cell[metricKeyFor(REGION, TF)];
    row.classList.add(colorClass(v));
    // Apply continuous background via custom property
    const isDark = (document.documentElement.dataset.theme === "dark");
    const bg = isDark ? rowBgForDark(v) : rowBgFor(v);
    if(bg) row.style.setProperty("--row-bg", bg);

    // Cell 1 — name + ticker
    const nameWrap = el("div", "sm-c-name");
    nameWrap.appendChild(el("div", "sm-c-sector", sector));
    nameWrap.appendChild(el("div", "sm-c-ticker", cell.ticker || ""));
    row.appendChild(nameWrap);

    // Cell 2 — score badge
    const sc = el("div", "sm-c-score");
    sc.textContent = cell.score != null ? fmtScore(cell.score) : "—";
    sc.style.color = alphaTextColor(cell.score);
    row.appendChild(sc);

    // Cell 3 — alpha value + bar
    const alphaWrap = el("div", "sm-c-alpha");
    const valEl = el("div", "sm-c-alpha-val", v == null ? "—" : fmtPct(v));
    valEl.style.color = alphaTextColor(v);
    alphaWrap.appendChild(valEl);
    if(v != null){
      const bar = el("div", "sm-c-alpha-bar");
      const fill = el("div", "sm-c-alpha-fill");
      fill.style.width = alphaBarPct(v) + "%";
      if(v >= 0){ fill.style.left = "50%"; fill.style.background = "var(--green)"; }
      else      { fill.style.right = "50%"; fill.style.background = "var(--red)"; }
      bar.appendChild(fill);
      alphaWrap.appendChild(bar);
    }
    row.appendChild(alphaWrap);

    // Cell 4 — signals trio
    row.appendChild(buildSigsTrio(cell));

    // Click → toggle expand
    row.addEventListener("click", (ev) => {
      if(ev.target.closest(".sm-detail-close")) return;
      toggleExpand(row, sector, cell);
    });
    return row;
  }

  function collapseAll(){
    document.querySelectorAll(".sm-detail").forEach(d => d.remove());
    document.querySelectorAll(".sm-row.expanded").forEach(r => r.classList.remove("expanded"));
    list.classList.remove("has-expanded");
    expandedKey = null;
  }

  function toggleExpand(row, sector, cell){
    const key = REGION + "|" + sector;
    if(expandedKey === key){ collapseAll(); return; }
    collapseAll();
    row.classList.add("expanded");
    row.appendChild(buildDetail(cell, REGION, sector));
    list.classList.add("has-expanded");
    expandedKey = key;
  }

  // ── List render ──────────────────────────────────────────────────
  function renderList(){
    expandedKey = null;
    list.classList.remove("has-expanded");
    list.textContent = "";
    DATA.sectors.forEach(sector => list.appendChild(buildRow(sector)));
    const hdr = document.getElementById("sm-h-perf");
    if(hdr) hdr.textContent = metricHeader();
  }

  // ── Tab wiring ───────────────────────────────────────────────────
  document.querySelectorAll("#sm-ztabs .tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.z === REGION);
    btn.addEventListener("click", () => {
      REGION = btn.dataset.z;
      try { localStorage.setItem("sm_region", REGION); } catch(e){}
      document.querySelectorAll("#sm-ztabs .tab").forEach(b => b.classList.toggle("active", b.dataset.z === REGION));
      renderList();
    });
  });
  document.querySelectorAll("#sm-ptabs .ptab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tf === TF);
    btn.addEventListener("click", () => {
      TF = btn.dataset.tf;
      try { localStorage.setItem("sm_tf", TF); } catch(e){}
      document.querySelectorAll("#sm-ptabs .ptab").forEach(b => b.classList.toggle("active", b.dataset.tf === TF));
      renderList();
    });
  });

  // ESC to close expanded row
  document.addEventListener("keydown", (e) => { if(e.key === "Escape" && expandedKey) collapseAll(); });

  // Boot
  renderHero();
  renderList();
  window._sainheRenderSentiment = function(){ renderHero(); renderList(); };
})();
</script>
