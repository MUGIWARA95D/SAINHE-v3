<!-- ═══ BOX_05 — SECTOR MAP ══════════════════════════════════════════ -->
<!-- 4×4 grid of SQUARE cells (16 sectors) for the active region.       -->
<!-- Click a cell → it grows to 3×3 in place, neighbors dim behind.     -->
<!-- Region tabs at top, timeframe tabs at bottom. Stays inside the box. -->
<style>
/* ── Hero strip ─────────────────────────────────────────────── */
#sm-hero{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:14px 22px;border-bottom:1px solid var(--border-lt);flex-wrap:wrap;
}
.sm-hero-block{display:flex;align-items:center;gap:10px;font-family:var(--sans)}
.sm-hero-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:700}
.sm-hero-value{font-size:16px;font-weight:700;color:var(--h);font-variant-numeric:tabular-nums}
.sm-hero-sub{font-size:11.5px;color:var(--muted)}
.sm-hero-chip{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:4px 10px;border-radius:999px;text-transform:uppercase;
}
.sm-hero-chip.healthy {background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sm-hero-chip.narrow  {background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.sm-hero-chip.riskoff {background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.sm-hero-chip.riskon  {background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sm-hero-chip.neutral {background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.sm-hero-chip.na      {background:var(--card-alt);color:var(--muted);border:1px solid var(--border-lt)}

/* ── 4×4 grid of square cells ───────────────────────────────── */
#sm-grid-wrap{
  position:relative;
  padding:16px 22px;
  overflow:visible;
}
#sm-grid{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4, minmax(0, 1fr));
  grid-template-rows:repeat(4, 1fr);
  gap:10px;
  /* Constrain max width so cells don't grow into huge squares on wide screens */
  max-width:760px;
  margin:0 auto;
  /* Reserve height so absolute-zoomed cells have a stable frame */
  aspect-ratio:1;
}

.sm-cell{
  aspect-ratio:1;
  background:var(--card-alt);
  border:1px solid var(--border-lt);
  border-radius:8px;
  padding:9px 10px;
  cursor:pointer;
  position:relative;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:filter .28s ease, opacity .28s ease, transform .35s cubic-bezier(.2,.6,.2,1),
             box-shadow .25s, border-color .25s, top .35s, left .35s, width .35s, height .35s;
  overflow:hidden;
}
.sm-cell.alpha-pos{background:var(--cell-bg, var(--green-bg)); border-color:var(--green-border)}
.sm-cell.alpha-neg{background:var(--cell-bg, var(--red-bg));   border-color:var(--red-border)}
.sm-cell.alpha-nu {background:var(--card-alt);                 border-color:var(--border-lt)}
.sm-cell:hover:not(.zoomed):not(.null){border-color:var(--gold);box-shadow:var(--shadow)}
.sm-cell.null{
  cursor:default;opacity:.45;
  background:repeating-linear-gradient(45deg, transparent, transparent 6px, rgba(0,0,0,.06) 6px, rgba(0,0,0,.06) 11px)!important;
}

/* ── Cell recto: name + score / ALPHA-big / 3 sigs (D↑ M● O→) ── */
.sm-c-top   {display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-width:0}
.sm-c-name  {font-family:var(--serif);font-size:12px;font-weight:600;color:var(--h);line-height:1.15;min-width:0;
             overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sm-c-score-small {font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
             white-space:nowrap;color:var(--muted);padding:2px 5px;border-radius:3px;background:rgba(0,0,0,.04)}
[data-theme="dark"] .sm-c-score-small{background:rgba(255,255,255,.06)}
.sm-c-mid   {flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.sm-c-alpha-big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.sm-c-tf-lbl{font-size:8.5px;color:var(--muted);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.sm-c-bot   {display:flex;justify-content:center;align-items:center;gap:4px}
.sm-sig{
  display:inline-flex;align-items:center;justify-content:center;gap:1px;
  min-width:26px;height:20px;padding:0 5px;border-radius:4px;
  font-size:10.5px;font-weight:700;font-family:var(--sans);line-height:1;
  background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06);
}
[data-theme="dark"] .sm-sig{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.08)}
.sm-sig.up   {color:var(--green)}
.sm-sig.dn   {color:var(--red)}
.sm-sig.warn {color:var(--orange)}
.sm-sig.nu   {color:var(--muted)}
.sm-sig .lt {font-weight:800;letter-spacing:.5px}
.sm-sig .ar {font-size:11.5px;line-height:1}

/* ── Zoom (1×1 → 3×3 in place) ──────────────────────────────── */
#sm-grid.has-zoomed .sm-cell:not(.zoomed){
  filter:blur(2px) saturate(.65);opacity:.4;pointer-events:none;
}
.sm-cell.zoomed{
  position:absolute;
  z-index:10;
  box-shadow:0 12px 36px rgba(60,40,15,.16), 0 3px 10px rgba(60,40,15,.10);
  border-color:var(--gold)!important;
  padding:14px 16px;
  cursor:default;
}
.sm-cell.zoomed .sm-c-recto{display:none}

/* ── Detail panel (verso, shown only when .zoomed) ─────────── */
.sm-c-verso{display:none;flex-direction:column;gap:10px;height:100%;overflow:hidden}
.sm-cell.zoomed .sm-c-verso{display:flex}

.sm-v-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sm-v-title{display:flex;flex-direction:column;gap:2px;min-width:0}
.sm-v-name{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--h);line-height:1.15;letter-spacing:-.005em}
.sm-v-tick{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.4px}
.sm-v-close{
  background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;
  padding:4px 8px;border-radius:4px;font-weight:700;
}
.sm-v-close:hover{color:var(--h);background:rgba(0,0,0,.06)}

.sm-v-alphas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sm-v-cell{
  background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.07);border-radius:5px;
  padding:6px 4px;text-align:center;
}
[data-theme="dark"] .sm-v-cell{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.08)}
.sm-v-cell.active{border-color:var(--gold);background:var(--gold-bg)}
.sm-v-cell .tf {font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sm-v-cell .vv {font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}

.sm-v-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10.5px;color:var(--muted)}
.sm-v-meta b{color:var(--p);font-weight:600;font-variant-numeric:tabular-nums}

.sm-v-sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sm-v-sig{
  background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.07);border-radius:5px;
  padding:8px 9px;display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--border-lt);
}
[data-theme="dark"] .sm-v-sig{background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.08)}
.sm-v-sig.up   {border-left-color:var(--green-border)}
.sm-v-sig.dn   {border-left-color:var(--red-border)}
.sm-v-sig.warn {border-left-color:var(--orange-border)}
.sm-v-sig .tag{font-size:9px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.sm-v-sig .val{font-size:12px;font-weight:700;color:var(--h)}
.sm-v-sig .sub{font-size:9.5px;color:var(--muted);line-height:1.4}

.sm-v-bias{
  font-size:11px;color:var(--p);line-height:1.5;font-style:italic;
  padding:7px 10px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:5px;
}

/* ── Responsive ─────────────────────────────────────────── */
@media(max-width:700px){
  #sm-hero{padding:12px 14px;gap:8px}
  .sm-hero-value{font-size:14px}
  #sm-grid-wrap{padding:12px 14px}
  #sm-grid{gap:6px;max-width:none}
  .sm-cell{padding:6px 7px;border-radius:6px}
  .sm-c-name{font-size:10.5px;-webkit-line-clamp:2}
  .sm-c-score-small{font-size:9px;padding:1px 3px}
  .sm-c-alpha-big{font-size:18px}
  .sm-c-tf-lbl{font-size:7px}
  .sm-sig{min-width:22px;height:17px;font-size:9px;padding:0 3px;gap:0}
  .sm-sig .ar{font-size:9.5px}
  .sm-c-bot{gap:3px}
  .sm-cell.zoomed{padding:10px 12px}
  .sm-v-name{font-size:14px}
  .sm-v-cell .vv{font-size:11px}
  .sm-v-sig{padding:5px 6px}
  .sm-v-sig .val{font-size:10.5px}
  .sm-v-sig .sub{font-size:9px}
}
</style>

<section class="card" id="box-sentiment">
  <div class="card-h">
    <span class="card-t">Rotation — Volume Flow &amp; Breadth</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts"><span>Updated</span> {{ ts_sentiment }}</span>
      <span class="badge badge-gold">DMA · MFI · OBV · Breadth · Regime</span>
    </div>
  </div>

  <!-- Hero strip -->
  <div id="sm-hero">
    <div class="sm-hero-block">
      <span class="sm-hero-label">Breadth</span>
      <span class="sm-hero-value" id="sm-breadth-val">—</span>
      <span class="sm-hero-chip na" id="sm-breadth-chip">—</span>
    </div>
    <div class="sm-hero-block">
      <span class="sm-hero-label">Regime</span>
      <span class="sm-hero-chip na" id="sm-regime-chip">—</span>
      <span class="sm-hero-sub" id="sm-regime-sub">—</span>
    </div>
  </div>

  <!-- Region tabs (top) -->
  <div class="tabs" id="sm-ztabs">
    <button class="tab active" data-z="MONDE">World</button>
    <button class="tab" data-z="USA">USA</button>
    <button class="tab" data-z="EU">Europe</button>
    <button class="tab" data-z="ASIE">Asia</button>
  </div>

  <!-- 4×4 grid -->
  <div id="sm-grid-wrap"><div id="sm-grid"></div></div>

  <!-- Timeframe tabs (bottom) -->
  <div class="ptabs" id="sm-ptabs">
    <button class="ptab" data-tf="chg_pct">Today</button>
    <button class="ptab" data-tf="1m">1M</button>
    <button class="ptab active" data-tf="3m">3M</button>
    <button class="ptab" data-tf="6m">6M</button>
    <button class="ptab" data-tf="1y">1Y</button>
  </div>
</section>

<script>
(function(){
  const DATA = {{ box_sentiment | tojson }};
  const grid = document.getElementById("sm-grid");
  if(!grid) return;

  let REGION = "MONDE";
  let TF = "3m";
  try {
    const sZ = localStorage.getItem("sm_region"); if(sZ && /^(MONDE|USA|EU|ASIE)$/.test(sZ)) REGION = sZ;
    const sT = localStorage.getItem("sm_tf");     if(sT && /^(chg_pct|1m|3m|6m|1y)$/.test(sT)) TF = sT;
  } catch(e){}

  let zoomedKey = null;
  const ALPHA_CAP = 0.05;

  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function fmtPct(v, d){ if(v==null||!isFinite(v)) return "—"; const p = v*100; return (p>=0?"+":"") + p.toFixed(d==null?1:d) + "%"; }
  function fmtScore(v){ if(v==null||!isFinite(v)) return "—"; return (v>=0?"+":"") + v.toFixed(2); }
  function fmtNum(v, d){ if(v==null||!isFinite(v)) return "—"; return Number(v).toFixed(d==null?2:d); }

  function metricKeyFor(region, tf){
    if(tf === "chg_pct") return "chg_pct";
    return region === "MONDE" ? ("ret_" + tf) : ("alpha_" + tf);
  }

  function colorClass(v){
    if(v == null || !isFinite(v)) return "alpha-nu";
    if(Math.abs(v) < 0.001) return "alpha-nu";
    return v >= 0 ? "alpha-pos" : "alpha-neg";
  }
  function cellBg(v, dark){
    if(v == null || !isFinite(v)) return null;
    const t = Math.min(1, Math.abs(v) / ALPHA_CAP);
    const hue = v >= 0 ? 135 : 10;
    if(dark) return `hsla(${hue}, 55%, 38%, ${0.16 + 0.22*t})`;
    return `hsl(${hue}, ${Math.round(45 + 25*t)}%, ${Math.round(93 - 11*t)}%)`;
  }
  function alphaTextColor(v){
    if(v == null || !isFinite(v)) return "var(--muted)";
    if(Math.abs(v) < 0.001) return "var(--p)";
    return v >= 0 ? "var(--green)" : "var(--red)";
  }
  function sectorShortName(s){
    // Make a tight label that fits in ~16 chars: keep the first significant word
    if(!s) return "";
    return s.length > 18 ? s.replace(" & ", "&").slice(0, 18) : s;
  }

  // ── Hero ──────────────────────────────────────────────────────────
  function renderHero(){
    const b = DATA.breadth || {};
    const r = DATA.regime || {};
    const bVal = document.getElementById("sm-breadth-val");
    const bChip = document.getElementById("sm-breadth-chip");
    bVal.textContent = b.count_total ? `${b.count_above}/${b.count_total} above DMA200 · ${b.pct}%` : "n/a";
    bChip.textContent = b.label || "—";
    bChip.className = "sm-hero-chip " + (
      b.label === "Healthy"   ? "healthy" :
      b.label === "Narrowing" ? "narrow"  :
      b.label === "Risk-off"  ? "riskoff" : "na");

    const rChip = document.getElementById("sm-regime-chip");
    const rSub  = document.getElementById("sm-regime-sub");
    rChip.textContent = r.label || "—";
    rChip.className = "sm-hero-chip " + (
      r.label === "RISK-ON"  ? "riskon"  :
      r.label === "RISK-OFF" ? "riskoff" :
      r.label === "NEUTRAL"  ? "neutral" : "na");
    const parts = [];
    if(r.vix    != null) parts.push(`VIX ${r.vix}`);
    if(r.curve  != null) parts.push(`Curve ${r.curve >= 0 ? "+" : ""}${r.curve}%`);
    if(r.hy_oas != null) parts.push(`HY ${r.hy_oas}bps`);
    rSub.textContent = parts.join(" · ");
  }

  // ── Sigs trio (recto compact, letter + arrow) ────────────────────
  // Each sigs is "X↑" (rising), "X↓" (falling), "X→" (neutral/sideways),
  // "X●" (extreme / warning), color-coded by intent.
  function buildSigsTrio(cell){
    const wrap = el("div", "sm-c-bot");
    function s(letter, arrow, klass, title){
      const sp = el("div", "sm-sig " + klass);
      const lt = el("span", "lt", letter);
      const ar = el("span", "ar", arrow);
      sp.appendChild(lt); sp.appendChild(ar);
      sp.title = title; return sp;
    }
    // DMA: above → ↑ green; below → ↓ red
    if(cell.dma_signal === "above")           wrap.appendChild(s("D", "↑", "up", "DMA200: ABOVE — long-term uptrend"));
    else if(cell.dma_signal === "below")      wrap.appendChild(s("D", "↓", "dn", "DMA200: BELOW — long-term downtrend"));
    else                                       wrap.appendChild(s("D", "→", "nu", "DMA200 n/a"));
    // MFI: overbought → ● orange (warning); oversold → ↑ green (contrarian buy); neutral → → grey
    if(cell.mfi_signal === "overbought")      wrap.appendChild(s("M", "●", "warn", "MFI >70 — overbought, don't add"));
    else if(cell.mfi_signal === "oversold")   wrap.appendChild(s("M", "↑", "up",   "MFI <30 — oversold, contrarian buy"));
    else if(cell.mfi_signal === "neutral")    wrap.appendChild(s("M", "→", "nu",   "MFI 30-70 — neutral"));
    else                                       wrap.appendChild(s("M", "→", "nu",   "MFI n/a"));
    // OBV: accumulation → ↑ green; distribution → ↓ red; neutral → → grey
    if(cell.obv_signal === "accumulation")    wrap.appendChild(s("O", "↑", "up", "OBV: ACCUMULATION — smart money in"));
    else if(cell.obv_signal === "distribution") wrap.appendChild(s("O", "↓", "dn", "OBV: DISTRIBUTION — smart money out"));
    else if(cell.obv_signal === "neutral")    wrap.appendChild(s("O", "→", "nu", "OBV: NEUTRAL"));
    else                                       wrap.appendChild(s("O", "→", "nu", "OBV n/a"));
    return wrap;
  }

  // ── Verso (3×3 zoom content) ────────────────────────────────────
  function buildVerso(cell, region, sector){
    const v = el("div", "sm-c-verso");

    // Head
    const head = el("div", "sm-v-head");
    const title = el("div", "sm-v-title");
    title.appendChild(el("div", "sm-v-name", sector));
    title.appendChild(el("div", "sm-v-tick", `${cell.ticker || "—"} · ${region}`));
    head.appendChild(title);
    const close = el("button", "sm-v-close", "×");
    close.title = "Close (Esc)";
    close.addEventListener("click", (ev) => { ev.stopPropagation(); zoomOut(); });
    head.appendChild(close);
    v.appendChild(head);

    // Alphas at 4 TFs
    const alphas = el("div", "sm-v-alphas");
    [["1m","1M"],["3m","3M"],["6m","6M"],["1y","1Y"]].forEach(([k, lbl]) => {
      const c = el("div", "sm-v-cell" + (TF === k ? " active" : ""));
      c.appendChild(el("div", "tf", lbl));
      const val = region === "MONDE" ? cell["ret_" + k] : cell["alpha_" + k];
      const vEl = el("div", "vv", val == null ? "—" : fmtPct(val));
      vEl.style.color = alphaTextColor(val);
      c.appendChild(vEl);
      alphas.appendChild(c);
    });
    v.appendChild(alphas);

    // Meta line
    const meta = el("div", "sm-v-meta");
    if(cell.close   != null){ const m = el("span"); m.innerHTML = `Close <b>${fmtNum(cell.close)}</b>`; meta.appendChild(m); }
    if(cell.chg_pct != null){ const m = el("span"); m.innerHTML = `Today <b>${fmtPct(cell.chg_pct)}</b>`; meta.appendChild(m); }
    if(cell.dma_200 != null){ const m = el("span"); m.innerHTML = `DMA200 <b>${fmtNum(cell.dma_200)}</b>`; meta.appendChild(m); }
    if(cell.score   != null){ const m = el("span"); m.innerHTML = `Score <b>${fmtScore(cell.score)}</b>`; meta.appendChild(m); }
    if(cell.label){            const m = el("span"); m.innerHTML = `Label <b>${cell.label}</b>`; meta.appendChild(m); }
    v.appendChild(meta);

    // 3 signals detailed
    const sigs = el("div", "sm-v-sigs");
    function sb(tag, val, sub, kind){
      const b = el("div", "sm-v-sig " + (kind || ""));
      b.appendChild(el("div", "tag", tag));
      b.appendChild(el("div", "val", val));
      if(sub) b.appendChild(el("div", "sub", sub));
      return b;
    }
    const dmaKind = cell.dma_signal === "above" ? "up" : cell.dma_signal === "below" ? "dn" : "";
    sigs.appendChild(sb("DMA200",
      cell.dma_signal === "above" ? "ABOVE" : cell.dma_signal === "below" ? "BELOW" : "N/A",
      "200-day trend",
      dmaKind));
    const mfiKind = cell.mfi_signal === "overbought" ? "warn" : cell.mfi_signal === "oversold" ? "up" : "";
    sigs.appendChild(sb("MFI 14d",
      cell.mfi_value != null ? "MFI " + Math.round(cell.mfi_value) : "N/A",
      cell.mfi_signal === "overbought" ? ">70 — overbought" :
      cell.mfi_signal === "oversold"   ? "<30 — oversold"   :
      cell.mfi_signal === "neutral"    ? "30-70 — neutral"  : "—",
      mfiKind));
    const obvKind = cell.obv_signal === "accumulation" ? "up" : cell.obv_signal === "distribution" ? "dn" : "";
    sigs.appendChild(sb("OBV 20d",
      cell.obv_signal === "accumulation" ? "ACCUM." :
      cell.obv_signal === "distribution" ? "DISTRIB." :
      cell.obv_signal === "neutral"      ? "NEUTRAL" : "N/A",
      "smart-money flow",
      obvKind));
    v.appendChild(sigs);

    // Bias guard
    const bias = buildBias(cell);
    if(bias) v.appendChild(el("div", "sm-v-bias", bias));

    // Regime narrative — conditional: "in current regime, historical leaders are..."
    const rNarr = regimeNarrative(DATA.regime && DATA.regime.label);
    if(rNarr){
      const rb = el("div", "sm-v-regime-narr");
      rb.textContent = rNarr;
      rb.style.cssText = "font-size:10.5px;color:var(--muted);font-style:italic;line-height:1.5;"
        + "padding:7px 10px;background:var(--card-alt);border-radius:5px;border:1px solid var(--border-lt)";
      v.appendChild(rb);
    }

    return v;
  }

  function buildBias(c){
    const above   = c.dma_signal === "above";
    const below   = c.dma_signal === "below";
    const accum   = c.obv_signal === "accumulation";
    const distrib = c.obv_signal === "distribution";
    const overb   = c.mfi_signal === "overbought";
    const overs   = c.mfi_signal === "oversold";
    const s = c.score;

    // Extreme zones (priority: score-driven)
    if(s != null && s >= 0.7)  return "Euphoria zone (score >+0.7). Historical 1Y forward returns negative on average (Damodaran). Trim, don't add — book some profit.";
    if(s != null && s <= -0.7) return "Capitulation zone (score <−0.7). Historical 1Y forward returns +8% to +12% on average. Contrarian buy — scale in, small size.";

    // Confluence / divergence cases
    if(above && accum && overb)  return "Trend + smart-money in + overbought. Strong but stretched. Don't chase, wait for pullback to add.";
    if(above && accum)            return "Trend confirmed + accumulation. Hold; scale in on pullbacks. Watch for euphoria above +0.6.";
    if(above && distrib)          return "Uptrend but smart money rotating OUT. Divergence — tight stops, watch for follow-through.";
    if(above && overb)            return "Healthy trend, short-term overbought (MFI >70). Don't chase — wait for the natural pullback.";
    if(above && overs)            return "Uptrend with short-term oversold. Strong tactical setup — add into the dip.";
    if(above)                     return "Long-term uptrend intact. Patience on mixed short-term signals.";

    if(below && distrib && overs) return "Downtrend + smart money out + oversold. Bottom-fishing tempting but trend rules — avoid.";
    if(below && distrib)          return "Downtrend confirmed + distribution. Avoid adding. Wait for break and hold above DMA200.";
    if(below && accum)            return "Downtrend but smart money quietly accumulating. Watch for trend reversal — early signal.";
    if(below && overs)            return "Downtrend but capitulation flagged (MFI <30). Contrarian — small position only, wait for confirmation.";
    if(below)                     return "Long-term downtrend. Default stance: avoid until trend repairs above DMA200.";

    return "Mixed signals — no clear edge. Default: stay aligned with longer-term trend or wait.";
  }

  // Historical regime → top performer sectors (Damodaran 1990-2024 dataset, US)
  const REGIME_TOPS = {
    "RISK-ON":  ["Tech & Semis", "EV & Clean Energy", "Finance & Transac.", "Luxury"],
    "NEUTRAL":  ["Industrials", "Healthcare & Pharma", "Consumer Staples"],
    "RISK-OFF": ["Consumer Staples", "Healthcare & Pharma", "Strategic Materials"]
  };
  function regimeNarrative(regimeLabel){
    if(!regimeLabel || !REGIME_TOPS[regimeLabel]) return null;
    const top = REGIME_TOPS[regimeLabel];
    const tag = regimeLabel === "RISK-ON" ? "In risk-on regimes (1990-2024, Damodaran), historical winners:"
              : regimeLabel === "RISK-OFF" ? "In risk-off regimes (1990-2024, Damodaran), defensive leaders:"
              : "In neutral regimes (1990-2024, Damodaran), broad balance:";
    return tag + " " + top.join(", ") + ".";
  }

  // ── Cell build (recto) ──────────────────────────────────────────
  function buildCell(sector, idx){
    const cell = DATA.grid?.[REGION]?.[sector] || {coverage: false};
    const c = el("div", "sm-cell");
    const key = REGION + "|" + sector;
    c.dataset.key = key;
    c.dataset.idx = idx;
    c.dataset.row = Math.floor(idx / 4);
    c.dataset.col = idx % 4;

    if(!cell.coverage){
      c.classList.add("null");
      const recto = el("div", "sm-c-recto");
      const top = el("div", "sm-c-top");
      top.appendChild(el("div", "sm-c-name", sectorShortName(sector)));
      recto.appendChild(top);
      recto.appendChild(el("div", "sm-c-mid"));
      const bot = el("div", "sm-c-bot");
      bot.style.color = "var(--muted)";
      bot.style.fontSize = "10px";
      bot.textContent = "no ETF";
      recto.appendChild(bot);
      c.appendChild(recto);
      return c;
    }

    const v = cell[metricKeyFor(REGION, TF)];
    c.classList.add(colorClass(v));
    const isDark = (document.documentElement.dataset.theme === "dark");
    const bg = cellBg(v, isDark);
    if(bg) c.style.setProperty("--cell-bg", bg);

    // RECTO — name + score pill (top), big alpha at active TF (middle), 3 sigs (bottom)
    const recto = el("div", "sm-c-recto");
    recto.style.display = "flex";
    recto.style.flexDirection = "column";
    recto.style.justifyContent = "space-between";
    recto.style.height = "100%";

    const top = el("div", "sm-c-top");
    top.appendChild(el("div", "sm-c-name", sectorShortName(sector)));
    // Score in small pill (top-right) — tells you the composite
    const scPill = el("div", "sm-c-score-small", cell.score != null ? fmtScore(cell.score) : "—");
    scPill.style.color = alphaTextColor(cell.score);
    scPill.title = "Composite score (DMA + MFI + OBV), -1 to +1";
    top.appendChild(scPill);
    recto.appendChild(top);

    // Big alpha at active TF + TF label
    const mid = el("div", "sm-c-mid");
    const alphaBig = el("div", "sm-c-alpha-big", v == null ? "—" : fmtPct(v));
    alphaBig.style.color = alphaTextColor(v);
    mid.appendChild(alphaBig);
    const tfLbl = el("div", "sm-c-tf-lbl",
      TF === "chg_pct" ? "TODAY" :
      ((REGION === "MONDE" ? "RET " : "ALPHA ") + TF.toUpperCase())
    );
    mid.appendChild(tfLbl);
    recto.appendChild(mid);

    recto.appendChild(buildSigsTrio(cell));
    c.appendChild(recto);

    // VERSO (built on demand)
    c.addEventListener("click", (ev) => {
      // If this cell is already zoomed, ANY click on it closes the zoom.
      // (The × button has its own handler with stopPropagation already.)
      if(c.classList.contains("zoomed")){ zoomOut(); return; }
      zoomIn(c, sector, cell);
    });

    return c;
  }

  // ── Zoom in/out ─────────────────────────────────────────────────
  function zoomIn(cell, sector, cellData){
    if(zoomedKey){ zoomOut(); }
    const row = +cell.dataset.row, col = +cell.dataset.col;
    const gr = grid.getBoundingClientRect();
    const w  = gr.width, h = gr.height;
    // single-cell width/height (gap 10px desktop, 6px mobile)
    const gap = parseFloat(getComputedStyle(grid).gap) || 8;
    const cellW = (w - 3*gap) / 4;
    const cellH = (h - 3*gap) / 4;
    // 3×3 zoom = 3 cells + 2 gaps
    const zW = 3*cellW + 2*gap;
    const zH = 3*cellH + 2*gap;
    // Center the zoom around the clicked cell, but clamp inside the grid
    let zLeft = col*(cellW + gap) - (cellW + gap);
    let zTop  = row*(cellH + gap) - (cellH + gap);
    if(zLeft < 0) zLeft = 0;
    if(zTop  < 0) zTop  = 0;
    if(zLeft + zW > w) zLeft = w - zW;
    if(zTop  + zH > h) zTop  = h - zH;

    // Add the verso content
    const verso = buildVerso(cellData, REGION, sector);
    cell.appendChild(verso);

    // Apply zoomed positioning
    cell.style.position = "absolute";
    cell.style.top   = zTop  + "px";
    cell.style.left  = zLeft + "px";
    cell.style.width = zW + "px";
    cell.style.height = zH + "px";
    cell.classList.add("zoomed");
    grid.classList.add("has-zoomed");
    zoomedKey = cell.dataset.key;
  }
  function zoomOut(){
    const z = grid.querySelector(".sm-cell.zoomed");
    if(z){
      const verso = z.querySelector(".sm-c-verso");
      if(verso) verso.remove();
      z.classList.remove("zoomed");
      z.style.position = "";
      z.style.top = z.style.left = z.style.width = z.style.height = "";
    }
    grid.classList.remove("has-zoomed");
    zoomedKey = null;
  }

  // ── Render full grid ────────────────────────────────────────────
  function renderGrid(){
    zoomedKey = null;
    grid.classList.remove("has-zoomed");
    grid.textContent = "";
    DATA.sectors.forEach((sector, idx) => grid.appendChild(buildCell(sector, idx)));
  }

  // ── Tabs wiring ─────────────────────────────────────────────────
  document.querySelectorAll("#sm-ztabs .tab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.z === REGION);
    btn.addEventListener("click", () => {
      REGION = btn.dataset.z;
      try { localStorage.setItem("sm_region", REGION); } catch(e){}
      document.querySelectorAll("#sm-ztabs .tab").forEach(b => b.classList.toggle("active", b.dataset.z === REGION));
      renderGrid();
    });
  });
  document.querySelectorAll("#sm-ptabs .ptab").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tf === TF);
    btn.addEventListener("click", () => {
      TF = btn.dataset.tf;
      try { localStorage.setItem("sm_tf", TF); } catch(e){}
      document.querySelectorAll("#sm-ptabs .ptab").forEach(b => b.classList.toggle("active", b.dataset.tf === TF));
      renderGrid();
    });
  });

  document.addEventListener("keydown", (e) => { if(e.key === "Escape" && zoomedKey) zoomOut(); });
  // Click outside zoomed cell closes zoom
  grid.addEventListener("click", (e) => {
    if(!zoomedKey) return;
    if(!e.target.closest(".sm-cell.zoomed")) zoomOut();
  });
  // Reposition on resize when something is zoomed
  window.addEventListener("resize", () => { if(zoomedKey){ const z = grid.querySelector(".sm-cell.zoomed"); if(z){ const k = z.dataset.key; const sector = k.split("|")[1]; const cellData = DATA.grid?.[REGION]?.[sector]; zoomOut(); if(cellData) zoomIn(z, sector, cellData); } } });

  renderHero();
  renderGrid();
  window._sainheRenderSentiment = function(){ renderHero(); renderGrid(); };
})();
</script>
