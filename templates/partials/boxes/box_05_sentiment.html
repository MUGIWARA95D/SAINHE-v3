<!-- ═══ BOX_05 — SECTOR MAP ══════════════════════════════════════════ -->
<!-- Inspired by box_04 layout: region tabs → list → timeframe tabs.    -->
<!-- Click on a row expands it inline ('3×3 zoom') with the 12 details. -->
<style>
/* ── Hero strip ─────────────────────────────────────────────── */
#sm-hero{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:14px 22px;border-bottom:1px solid var(--border-lt);flex-wrap:wrap;
}
.sm-hero-block{display:flex;align-items:center;gap:10px;font-family:var(--sans)}
.sm-hero-label{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:700}
.sm-hero-value{font-size:16px;font-weight:700;color:var(--h);font-variant-numeric:tabular-nums}
.sm-hero-sub{font-size:11.5px;color:var(--muted)}
.sm-hero-chip{
  display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.6px;
  padding:4px 10px;border-radius:999px;text-transform:uppercase;
}
.sm-hero-chip.healthy {background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sm-hero-chip.narrow  {background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-border)}
.sm-hero-chip.riskoff {background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.sm-hero-chip.riskon  {background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.sm-hero-chip.neutral {background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.sm-hero-chip.na      {background:var(--card-alt);color:var(--muted);border:1px solid var(--border-lt)}

/* ── List columns ───────────────────────────────────────────── */
#sm-list-wrap{position:relative}
.sm-list-hdr{
  display:grid;
  grid-template-columns:minmax(150px,1.8fr) 70px 78px minmax(110px,1.2fr) 90px 110px;
  gap:14px;align-items:center;padding:10px 22px;
  font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);font-weight:700;border-bottom:1px solid var(--border-lt);
  background:var(--card-alt);
}
.sm-row{
  display:grid;
  grid-template-columns:minmax(150px,1.8fr) 70px 78px minmax(110px,1.2fr) 90px 110px;
  gap:14px;align-items:center;padding:12px 22px;
  border-bottom:1px solid var(--border-lt);cursor:pointer;
  transition:background .15s, border-color .15s;
  position:relative;
}
.sm-row:hover{background:var(--hover)}
.sm-row.null{opacity:.4;cursor:default;background:repeating-linear-gradient(45deg, transparent, transparent 8px, var(--card-alt) 8px, var(--card-alt) 14px)}
.sm-row.null:hover{background:repeating-linear-gradient(45deg, transparent, transparent 8px, var(--card-alt) 8px, var(--card-alt) 14px)}
.sm-row.expanded{background:var(--card-alt)!important;border-left:3px solid var(--gold);padding-left:19px}

/* Cell 1: sector + ticker */
.sm-c-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.sm-c-sector{font-family:var(--serif);font-size:13.5px;color:var(--h);font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-c-ticker{font-size:10px;color:var(--muted);letter-spacing:.4px;font-variant-numeric:tabular-nums}

/* Cell 2: sparkline */
.sm-c-spark{display:flex;align-items:center;justify-content:center}
.sm-c-spark canvas{display:block}

/* Cell 3: score badge */
.sm-c-score{
  font-family:var(--sans);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;
  text-align:center;padding:5px 8px;border-radius:5px;background:var(--card-alt);
}

/* Cell 4: alpha bar (color-coded) */
.sm-c-alpha{display:flex;flex-direction:column;gap:3px}
.sm-c-alpha-val{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.sm-c-alpha-bar{height:4px;background:var(--card-alt);border-radius:2px;overflow:hidden;position:relative}
.sm-c-alpha-fill{position:absolute;top:0;bottom:0;background:var(--alpha-fill-color, var(--gold));transition:all .25s}

/* Cell 5: 3 micro signals */
.sm-c-sigs{display:flex;justify-content:center;gap:5px}
.sm-c-sigs span{display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:4px;font-size:11px;font-weight:700;font-family:var(--sans);line-height:1}
.sm-sig-up   {background:var(--green-bg);color:var(--green)}
.sm-sig-dn   {background:var(--red-bg);  color:var(--red)}
.sm-sig-warn {background:var(--orange-bg);color:var(--orange)}
.sm-sig-nu   {background:var(--card-alt);color:var(--muted);border:1px solid var(--border-lt)}

/* Cell 6: label badge */
.sm-c-label{
  font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 8px;border-radius:4px;text-align:center;white-space:nowrap;
}
.sm-c-label.lbl-bullish {background:var(--green-bg);color:var(--green)}
.sm-c-label.lbl-warn    {background:var(--orange-bg);color:var(--orange)}
.sm-c-label.lbl-bearish {background:var(--red-bg);color:var(--red)}
.sm-c-label.lbl-neutral {background:var(--card-alt);color:var(--muted)}

/* ── Expanded row: detail panel ─────────────────────────────── */
.sm-detail{
  grid-column:1 / -1;
  padding:18px 4px 6px;
  display:grid;grid-template-columns:1.4fr 1fr;gap:18px;
  border-top:1px dashed var(--border);margin-top:8px;
  animation:smReveal .3s cubic-bezier(.2,.6,.2,1);
}
@keyframes smReveal{
  from{opacity:0;transform:translateY(-6px)}
  to  {opacity:1;transform:translateY(0)}
}
.sm-detail-sec{display:flex;flex-direction:column;gap:8px}
.sm-detail-sec-title{font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.sm-detail-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sm-detail-cell{background:var(--card);border:1px solid var(--border-lt);border-radius:6px;padding:8px 6px;text-align:center}
.sm-detail-cell.active{border-color:var(--gold);background:var(--gold-bg)}
.sm-detail-tf  {font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sm-detail-val {font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.sm-detail-sig {background:var(--card);border:1px solid var(--border-lt);border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;border-left:3px solid var(--border-lt)}
.sm-detail-sig.up   {border-left-color:var(--green-border);background:var(--green-bg)}
.sm-detail-sig.down {border-left-color:var(--red-border);  background:var(--red-bg)}
.sm-detail-sig.warn {border-left-color:var(--orange-border);background:var(--orange-bg)}
.sm-detail-sig-tag {font-size:9.5px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.sm-detail-sig-val {font-size:13px;font-weight:700;color:var(--h)}
.sm-detail-sig-sub {font-size:10px;color:var(--muted)}
.sm-detail-bias{
  font-size:11.5px;color:var(--p);line-height:1.55;font-style:italic;
  padding:10px 14px;background:var(--gold-bg);border-left:3px solid var(--gold);border-radius:6px;
}
.sm-detail-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:10.5px;color:var(--muted)}
.sm-detail-meta b{color:var(--p);font-weight:600}

/* ── Responsive: mobile compresses the row ─────────────────── */
@media(max-width:700px){
  .sm-list-hdr, .sm-row{
    grid-template-columns:minmax(110px,1.5fr) 78px 80px;
    gap:8px;padding:10px 14px;
  }
  /* hide spark, score badge, and label badge on mobile — keep name + alpha + sigs */
  .sm-list-hdr .sm-h-spark, .sm-list-hdr .sm-h-score, .sm-list-hdr .sm-h-label,
  .sm-row .sm-c-spark, .sm-row .sm-c-score, .sm-row .sm-c-label{display:none}
  .sm-c-sector{font-size:12.5px}
  .sm-detail{grid-template-columns:1fr}
  #sm-hero{padding:12px 14px;gap:8px}
  .sm-hero-value{font-size:14px}
}
</style>

<section class="card" id="box-sentiment">
  <div class="card-h">
    <span class="card-t">Sector Map — Rotation & Breadth</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts"><span>Updated</span> {{ ts_sentiment }}</span>
      <span class="badge badge-gold">DMA · MFI · OBV · Breadth · Regime</span>
    </div>
  </div>

  <!-- Hero strip: breadth + regime -->
  <div id="sm-hero">
    <div class="sm-hero-block">
      <span class="sm-hero-label">Breadth</span>
      <span class="sm-hero-value" id="sm-breadth-val">—</span>
      <span class="sm-hero-chip na" id="sm-breadth-chip">—</span>
    </div>
    <div class="sm-hero-block">
      <span class="sm-hero-label">Regime</span>
      <span class="sm-hero-chip na" id="sm-regime-chip">—</span>
      <span class="sm-hero-sub" id="sm-regime-sub">—</span>
    </div>
  </div>

  <!-- Region tabs (top, full width like box_04) -->
  <div class="tabs" id="sm-ztabs">
    <button class="tab active" data-z="MONDE">World</button>
    <button class="tab" data-z="USA">USA</button>
    <button class="tab" data-z="EU">Europe</button>
    <button class="tab" data-z="ASIE">Asia</button>
  </div>

  <!-- Column headers -->
  <div class="sm-list-hdr">
    <span>Sector</span>
    <span class="sm-h-spark" style="text-align:center">7d</span>
    <span class="sm-h-score" style="text-align:center">Score</span>
    <span id="sm-h-perf">Alpha 3M</span>
    <span style="text-align:center">DMA · MFI · OBV</span>
    <span class="sm-h-label" style="text-align:center">Label</span>
  </div>

  <!-- Sector rows (rendered by JS) -->
  <div id="sm-list-wrap"><div id="sm-list"></div></div>

  <!-- Timeframe tabs (bottom, full width) -->
  <div class="ptabs" id="sm-ptabs">
    <button class="ptab" data-tf="chg_pct">Today</button>
    <button class="ptab" data-tf="1m">1M</button>
    <button class="ptab active" data-tf="3m">3M</button>
    <button class="ptab" data-tf="6m">6M</button>
    <button class="ptab" data-tf="1y">1Y</button>
  </div>
</section>

<script>
(function(){
  const DATA = {{ box_sentiment | tojson }};
  const list = document.getElementById("sm-list");
  if(!list) return;

  // Active state
  let REGION = "MONDE";
  let TF = "3m";
  try {
    const sZ = localStorage.getItem("sm_region"); if(sZ && /^(MONDE|USA|EU|ASIE)$/.test(sZ)) REGION = sZ;
    const sT = localStorage.getItem("sm_tf");     if(sT && /^(chg_pct|1m|3m|6m|1y)$/.test(sT)) TF = sT;
  } catch(e){}

  let expandedKey = null;

  // ── Helpers ──────────────────────────────────────────────────────────
  function el(tag, cls, txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function fmtPct(v, d){ if(v==null||!isFinite(v)) return "—"; const p = v*100; return (p>=0?"+":"") + p.toFixed(d==null?1:d) + "%"; }
  function fmtScore(v){ if(v==null||!isFinite(v)) return "—"; return (v>=0?"+":"") + v.toFixed(2); }
  function fmtNum(v, d){ if(v==null||!isFinite(v)) return "—"; return Number(v).toFixed(d==null?2:d); }

  // The metric used for cell color & alpha column depends on the region:
  //   MONDE  = absolute return (the benchmark itself — alphas vs itself = 0)
  //   USA/EU/ASIE = relative alpha vs MONDE benchmark
  function metricKeyFor(region, tf){
    if(tf === "chg_pct") return "chg_pct";
    return region === "MONDE" ? ("ret_" + tf) : ("alpha_" + tf);
  }
  function metricLabel(){
    if(TF === "chg_pct") return "Today";
    const tf = TF.toUpperCase();
    return (REGION === "MONDE" ? "Return " : "Alpha ") + tf;
  }

  // ── Coloring scale ───────────────────────────────────────────────────
  function colorFor(v){
    if(v == null || !isFinite(v)) return { text: "var(--muted)", fill: "var(--card-alt)" };
    const cap = 0.05;
    const t = Math.max(-1, Math.min(1, v / cap));
    if(t >= 0)  return { text: t > 0.05 ? "var(--green)" : "var(--p)", fill: `hsl(135, ${Math.round(40 + 30*t)}%, ${Math.round(85 - 15*t)}%)` };
    const u = -t;
    return { text: u > 0.05 ? "var(--red)" : "var(--p)", fill: `hsl(10, ${Math.round(45 + 35*u)}%, ${Math.round(85 - 15*u)}%)` };
  }
  function alphaBarPct(v){
    if(v == null || !isFinite(v)) return 0;
    return Math.min(100, Math.abs(v) / 0.05 * 50);  // 50% bar at ±500bps
  }
  function alphaBarSide(v){ return v >= 0 ? "right" : "left"; }

  // ── Hero strip render ────────────────────────────────────────────────
  function renderHero(){
    const b = DATA.breadth || {};
    const r = DATA.regime || {};
    const bVal = document.getElementById("sm-breadth-val");
    const bChip = document.getElementById("sm-breadth-chip");
    if(b.count_total){
      bVal.textContent = `${b.count_above}/${b.count_total} above DMA200 · ${b.pct}%`;
    } else {
      bVal.textContent = "n/a";
    }
    bChip.textContent = b.label || "—";
    bChip.className = "sm-hero-chip " + (
      b.label === "Healthy"   ? "healthy" :
      b.label === "Narrowing" ? "narrow"  :
      b.label === "Risk-off"  ? "riskoff" : "na");

    const rChip = document.getElementById("sm-regime-chip");
    const rSub  = document.getElementById("sm-regime-sub");
    rChip.textContent = r.label || "—";
    rChip.className = "sm-hero-chip " + (
      r.label === "RISK-ON"  ? "riskon"  :
      r.label === "RISK-OFF" ? "riskoff" :
      r.label === "NEUTRAL"  ? "neutral" : "na");
    const parts = [];
    if(r.vix    != null) parts.push(`VIX ${r.vix}`);
    if(r.curve  != null) parts.push(`Curve ${r.curve >= 0 ? "+" : ""}${r.curve}%`);
    if(r.hy_oas != null) parts.push(`HY ${r.hy_oas}bps`);
    rSub.textContent = parts.join(" · ");
  }

  // ── Build the icons trio (DMA / MFI / OBV) ───────────────────────────
  function buildSigsTrio(cell){
    const wrap = el("div", "sm-c-sigs");
    function pill(ch, klass, title){
      const s = el("span", klass, ch); s.title = title; return s;
    }
    // DMA200
    if(cell.dma_signal === "above")      wrap.appendChild(pill("▲", "sm-sig-up",   "Above DMA200 — long-term uptrend"));
    else if(cell.dma_signal === "below") wrap.appendChild(pill("▼", "sm-sig-dn",   "Below DMA200 — long-term downtrend"));
    else                                  wrap.appendChild(pill("·", "sm-sig-nu",   "DMA200 n/a"));
    // MFI
    if(cell.mfi_signal === "overbought")     wrap.appendChild(pill("●", "sm-sig-warn", "MFI overbought (>70)"));
    else if(cell.mfi_signal === "oversold")  wrap.appendChild(pill("●", "sm-sig-up",   "MFI oversold (<30) — contrarian opportunity"));
    else if(cell.mfi_signal === "neutral")   wrap.appendChild(pill("○", "sm-sig-nu",   "MFI neutral"));
    else                                      wrap.appendChild(pill("·", "sm-sig-nu",   "MFI n/a"));
    // OBV
    if(cell.obv_signal === "accumulation")     wrap.appendChild(pill("↑", "sm-sig-up",   "OBV accumulation — money flowing in"));
    else if(cell.obv_signal === "distribution") wrap.appendChild(pill("↓", "sm-sig-dn",   "OBV distribution — money flowing out"));
    else if(cell.obv_signal === "neutral")     wrap.appendChild(pill("→", "sm-sig-nu",   "OBV neutral"));
    else                                        wrap.appendChild(pill("·", "sm-sig-nu",   "OBV n/a"));
    return wrap;
  }

  function labelClass(label){
    if(!label) return "lbl-neutral";
    if(label === "Accumulation")  return "lbl-bullish";
    if(label === "Euphoric")      return "lbl-warn";
    if(label === "Caution")       return "lbl-warn";
    if(label === "Bearish")       return "lbl-bearish";
    if(label === "Extreme Fear")  return "lbl-bearish";
    return "lbl-neutral";
  }

  // ── Sparkline 7d ─────────────────────────────────────────────────────
  function drawSparkline(canvas, jsonStr){
    if(!canvas || !jsonStr) return;
    let pts;
    try { pts = JSON.parse(jsonStr); } catch(e){ return; }
    if(!Array.isArray(pts) || pts.length < 2) return;
    const cv = canvas, ctx = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const min = Math.min(...pts), max = Math.max(...pts);
    const rng = max - min || 1;
    const last = pts[pts.length-1], first = pts[0];
    const trend = last >= first;
    const color = trend ? getComputedStyle(document.documentElement).getPropertyValue("--green").trim() || "#2C7A3E"
                        : getComputedStyle(document.documentElement).getPropertyValue("--red").trim()   || "#A03020";
    ctx.clearRect(0,0,W,H);
    ctx.beginPath();
    pts.forEach((p,i) => {
      const x = (i/(pts.length-1)) * (W-2) + 1;
      const y = H - ((p-min)/rng) * (H-2) - 1;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.lineJoin = "round"; ctx.stroke();
  }

  // ── Detail panel (expanded row content — the "12 points") ────────────
  function buildDetail(cell, region, sector){
    const det = el("div", "sm-detail");

    // LEFT column: alpha 4-TF + meta
    const left = el("div", "sm-detail-sec");
    const t1 = el("div", "sm-detail-sec-title", region === "MONDE" ? "Return at each timeframe" : "Alpha vs MONDE benchmark");
    left.appendChild(t1);
    const grid4 = el("div", "sm-detail-grid4");
    [["1m","1M"],["3m","3M"],["6m","6M"],["1y","1Y"]].forEach(([k,lbl]) => {
      const c = el("div", "sm-detail-cell" + (TF === k ? " active" : ""));
      c.appendChild(el("div", "sm-detail-tf", lbl));
      const v = region === "MONDE" ? cell["ret_" + k] : cell["alpha_" + k];
      const vEl = el("div", "sm-detail-val", v == null ? "—" : fmtPct(v));
      const col = colorFor(v);
      vEl.style.color = col.text;
      c.appendChild(vEl);
      grid4.appendChild(c);
    });
    left.appendChild(grid4);

    // Meta line
    const meta = el("div", "sm-detail-meta");
    meta.style.marginTop = "6px";
    if(cell.close != null){
      const m1 = el("span"); m1.innerHTML = `Close <b>${fmtNum(cell.close)}</b>`; meta.appendChild(m1);
    }
    if(cell.chg_pct != null){
      const m2 = el("span"); m2.innerHTML = `Today <b>${fmtPct(cell.chg_pct)}</b>`; meta.appendChild(m2);
    }
    if(cell.dma_200 != null){
      const m3 = el("span"); m3.innerHTML = `DMA200 <b>${fmtNum(cell.dma_200)}</b>`; meta.appendChild(m3);
    }
    if(DATA.regime && DATA.regime.label){
      const m4 = el("span"); m4.innerHTML = `Regime <b>${DATA.regime.label}</b>`; meta.appendChild(m4);
    }
    left.appendChild(meta);
    det.appendChild(left);

    // RIGHT column: 3 signals + bias guard
    const right = el("div", "sm-detail-sec");
    right.appendChild(el("div", "sm-detail-sec-title", "Triangulation — DMA · MFI · OBV"));
    function sigBox(tag, valTxt, subTxt, kind){
      const b = el("div", "sm-detail-sig " + (kind || ""));
      b.appendChild(el("div", "sm-detail-sig-tag", tag));
      b.appendChild(el("div", "sm-detail-sig-val", valTxt));
      if(subTxt) b.appendChild(el("div", "sm-detail-sig-sub", subTxt));
      return b;
    }
    const dmaKind = cell.dma_signal === "above" ? "up" : cell.dma_signal === "below" ? "down" : "";
    right.appendChild(sigBox("DMA200",
      cell.dma_signal === "above" ? "ABOVE" : cell.dma_signal === "below" ? "BELOW" : "N/A",
      cell.close != null && cell.dma_200 != null ? `${fmtNum(cell.close)} vs ${fmtNum(cell.dma_200)}` : "long-term trend (200 days)",
      dmaKind));
    const mfiKind = cell.mfi_signal === "overbought" ? "warn" : cell.mfi_signal === "oversold" ? "up" : "";
    right.appendChild(sigBox("MFI 14d",
      cell.mfi_value != null ? "MFI " + Math.round(cell.mfi_value) : "MFI —",
      cell.mfi_signal === "overbought" ? "Overbought >70 — pause before adding" :
      cell.mfi_signal === "oversold"   ? "Oversold <30 — contrarian opportunity" :
      cell.mfi_signal === "neutral"    ? "Neutral 30-70" : "n/a",
      mfiKind));
    const obvKind = cell.obv_signal === "accumulation" ? "up" : cell.obv_signal === "distribution" ? "down" : "";
    right.appendChild(sigBox("OBV (20d)",
      cell.obv_signal === "accumulation" ? "ACCUMULATION" :
      cell.obv_signal === "distribution" ? "DISTRIBUTION" :
      cell.obv_signal === "neutral"      ? "NEUTRAL" : "N/A",
      "smart money flow direction",
      obvKind));

    // Bias-guard message
    const bias = buildBias(cell);
    if(bias){
      right.appendChild(el("div", "sm-detail-bias", bias));
    }
    det.appendChild(right);

    return det;
  }

  // Bias guard rules — short, regime-aware sentences
  function buildBias(c){
    if(c.dma_signal === "above" && c.score != null && c.score >= 0.4) return "Trend confirmed + accumulation. Hold; scale in on pullbacks. Watch for euphoria above +0.6.";
    if(c.dma_signal === "below" && c.score != null && c.score <= -0.4) return "Trend down + distribution. Avoid adding. Wait for stabilization above DMA200 before re-entry.";
    if(c.dma_signal === "above" && c.mfi_signal === "overbought") return "Trend healthy but short-term overbought (MFI >70). Don't chase — wait for a normal pullback.";
    if(c.dma_signal === "below" && c.mfi_signal === "oversold")   return "Trend weak but capitulation flagged (MFI <30). Contrarian — small position only.";
    if(c.dma_signal === "above" && c.obv_signal === "distribution") return "Long-term uptrend but smart money rotating out. Tight stops, watch for follow-through.";
    if(c.dma_signal === "above") return "Long-term uptrend intact. Sentiment mixed short-term — patience.";
    if(c.dma_signal === "below") return "Long-term downtrend. Default stance: avoid until trend repairs.";
    return null;
  }

  // ── Row build ────────────────────────────────────────────────────────
  function buildRow(sector){
    const cell = DATA.grid?.[REGION]?.[sector] || {coverage: false};
    const row = el("div", "sm-row" + (cell.coverage ? "" : " null"));
    const key = REGION + "|" + sector;
    row.dataset.key = key;

    // Cell 1 — name + ticker
    const nameWrap = el("div", "sm-c-name");
    nameWrap.appendChild(el("div", "sm-c-sector", sector));
    if(cell.coverage && cell.ticker){
      const t = el("div", "sm-c-ticker", cell.ticker);
      nameWrap.appendChild(t);
    } else if(!cell.coverage){
      nameWrap.appendChild(el("div", "sm-c-ticker", "no ETF in region"));
    }
    row.appendChild(nameWrap);

    // Cell 2 — sparkline
    const sparkWrap = el("div", "sm-c-spark");
    if(cell.coverage && cell.sparkline){
      const cv = document.createElement("canvas");
      cv.width = 58; cv.height = 22;
      sparkWrap.appendChild(cv);
      requestAnimationFrame(() => drawSparkline(cv, cell.sparkline));
    }
    row.appendChild(sparkWrap);

    // Cell 3 — score badge
    const scWrap = el("div", "sm-c-score");
    if(cell.coverage && cell.score != null){
      scWrap.textContent = fmtScore(cell.score);
      const col = colorFor(cell.score);
      scWrap.style.color = col.text;
    } else {
      scWrap.textContent = "—";
      scWrap.style.color = "var(--muted)";
    }
    row.appendChild(scWrap);

    // Cell 4 — alpha (or return for MONDE) with mini bar
    const alphaWrap = el("div", "sm-c-alpha");
    const key4 = metricKeyFor(REGION, TF);
    const v = cell.coverage ? cell[key4] : null;
    const valEl = el("div", "sm-c-alpha-val", v == null ? "—" : fmtPct(v));
    const col = colorFor(v);
    valEl.style.color = col.text;
    alphaWrap.appendChild(valEl);
    if(cell.coverage && v != null){
      const bar = el("div", "sm-c-alpha-bar");
      const fill = el("div", "sm-c-alpha-fill");
      const w = alphaBarPct(v);
      fill.style.width = w + "%";
      if(v >= 0){
        fill.style.left  = "50%";
        fill.style.background = "var(--green)";
      } else {
        fill.style.right = "50%";
        fill.style.background = "var(--red)";
      }
      bar.appendChild(fill);
      alphaWrap.appendChild(bar);
    }
    row.appendChild(alphaWrap);

    // Cell 5 — 3 micro signals
    if(cell.coverage){
      row.appendChild(buildSigsTrio(cell));
    } else {
      row.appendChild(el("div"));
    }

    // Cell 6 — label badge
    const lbl = el("div", "sm-c-label " + labelClass(cell.label));
    lbl.textContent = cell.coverage && cell.label ? cell.label : "—";
    row.appendChild(lbl);

    // Click → toggle expand
    if(cell.coverage){
      row.addEventListener("click", () => toggleExpand(row, sector, cell));
    }
    return row;
  }

  function toggleExpand(row, sector, cell){
    const key = REGION + "|" + sector;
    // close existing detail
    document.querySelectorAll(".sm-detail").forEach(d => d.remove());
    document.querySelectorAll(".sm-row.expanded").forEach(r => r.classList.remove("expanded"));
    if(expandedKey === key){ expandedKey = null; return; }
    row.classList.add("expanded");
    row.appendChild(buildDetail(cell, REGION, sector));
    expandedKey = key;
  }

  // ── Render list ──────────────────────────────────────────────────────
  function renderList(){
    list.textContent = "";
    expandedKey = null;
    DATA.sectors.forEach(sector => list.appendChild(buildRow(sector)));
    // Update header label
    const hdr = document.getElementById("sm-h-perf");
    if(hdr) hdr.textContent = metricLabel();
  }

  // ── Tab wiring ───────────────────────────────────────────────────────
  document.querySelectorAll("#sm-ztabs .tab").forEach(btn => {
    if(btn.dataset.z === REGION) btn.classList.add("active");
    else btn.classList.remove("active");
    btn.addEventListener("click", () => {
      REGION = btn.dataset.z;
      try { localStorage.setItem("sm_region", REGION); } catch(e){}
      document.querySelectorAll("#sm-ztabs .tab").forEach(b => b.classList.toggle("active", b.dataset.z === REGION));
      renderList();
    });
  });
  document.querySelectorAll("#sm-ptabs .ptab").forEach(btn => {
    if(btn.dataset.tf === TF) btn.classList.add("active");
    else btn.classList.remove("active");
    btn.addEventListener("click", () => {
      TF = btn.dataset.tf;
      try { localStorage.setItem("sm_tf", TF); } catch(e){}
      document.querySelectorAll("#sm-ptabs .ptab").forEach(b => b.classList.toggle("active", b.dataset.tf === TF));
      renderList();
    });
  });

  // ── Boot ─────────────────────────────────────────────────────────────
  renderHero();
  renderList();
  window._sainheRenderSentiment = function(){ renderHero(); renderList(); };
})();
</script>
