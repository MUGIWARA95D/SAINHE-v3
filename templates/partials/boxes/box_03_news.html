<!-- ═══ BOX_03 — NEWS ═══════════════════════════════════════ -->
<!-- DATA: box_news = {par_region: {GLOBAL:[{source_id,titre,lien,resume,ts_pub}], USA:[...], EU:[...], ASIE:[...]}} -->
<section class="card" id="box-news">
  <div class="card-h">
    <span class="card-t">{{ t.box_news_title }}</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts">{{ t.updated }} {{ ts_news }}</span>
      <span class="badge badge-red">&#9679; LIVE</span>
    </div>
  </div>

  <!-- Region tabs -->
  <div class="tabs" id="news-tabs">
    <button class="tab active" data-r="GLOBAL" id="news-tab-global"></button>
    <button class="tab" data-r="USA" id="news-tab-usa"></button>
    <button class="tab" data-r="EU" id="news-tab-eu"></button>
    <button class="tab" data-r="ASIE" id="news-tab-asie"></button>
  </div>

  <div id="news-scroll"></div>
</section>
<script>
(function(){
  const I18N = window.SAINHE_I18N || {};

  /* set tab labels */
  var tabMap = {
    "news-tab-global": I18N.tab_world  ||"World",
    "news-tab-usa":    I18N.tab_usa    ||"USA",
    "news-tab-eu":     I18N.tab_europe ||"Europe",
    "news-tab-asie":   I18N.tab_asia   ||"Asia"
  };
  Object.keys(tabMap).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.textContent = tabMap[id];
  });

  function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  const DATA = {{ box_news.par_region | tojson }};

  var SRC = {1:"Bloomberg",2:"AP News",3:"MarketWatch",4:"SCMP",5:"Nikkei Asia",6:"FT"};

  function mkEl(tag, cls, text){
    var el = document.createElement(tag);
    if(cls) el.className = cls;
    if(text != null) el.textContent = text;
    return el;
  }

  function render(zone){
    var articles = DATA[zone] || [];
    var wrap = document.getElementById("news-scroll");
    wrap.textContent = "";
    if(!articles.length){
      var empty = mkEl("div", null, I18N.news_empty||"No articles for this region");
      empty.style.cssText = "padding:20px;color:var(--muted);text-align:center";
      wrap.appendChild(empty);
      return;
    }
    articles.forEach(function(n){
      var ts   = (n.ts_pub||"").slice(0,16).replace("T"," ");
      var item = mkEl("div","news-item");

      var anchor = mkEl("div","news-anchor", SRC[n.source_id]||zone);
      var meta   = mkEl("div","news-meta");
      var time   = mkEl("span","news-time", ts);
      meta.appendChild(time);

      var hl;
      if(n.lien){
        hl = document.createElement("a");
        hl.className = "news-hl";
        hl.href = n.lien;
        hl.target = "_blank";
        hl.rel = "noopener noreferrer";
        hl.textContent = n.titre||"";
      } else {
        hl = mkEl("div","news-hl", n.titre||"");
      }

      item.appendChild(anchor);
      item.appendChild(meta);
      item.appendChild(hl);

      if(n.resume){
        var body = mkEl("div","news-body", n.resume);
        item.appendChild(body);
        if(n.lien){
          var more = document.createElement("a");
          more.className = "news-readmore";
          more.href = n.lien;
          more.target = "_blank";
          more.rel = "noopener noreferrer";
          more.textContent = I18N.news_read_more||"Read full article ↗";
          item.appendChild(more);
        }
      }
      wrap.appendChild(item);
    });
  }

  document.querySelectorAll("#news-tabs .tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      document.querySelectorAll("#news-tabs .tab").forEach(function(b){ b.classList.remove("active"); });
      this.classList.add("active");
      render(this.dataset.r);
    });
  });

  render("GLOBAL");
})();
</script>
