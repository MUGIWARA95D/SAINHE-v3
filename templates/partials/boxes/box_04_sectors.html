<!-- ═══ BOX_04 — SECTOR ROTATION ════════════════════════════ -->
<!-- DATA: box_sectors = {secteurs:[{nom, regions:{MONDE:{chg_pct,ret_1m..ret_1y,score,above_dma200,spark_today..spark_1y},...}}]} -->
<section class="card" id="box-sectors">
  <div class="card-h">
    <span class="card-t">Sector Performance</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts">Updated {{ ts_sectors }}</span>
      <span class="badge badge-gold">R-PERF VS GLOBAL &middot; RVOL</span>
    </div>
  </div>

  <!-- Zone tabs — full width -->
  <div class="tabs" id="ztabs">
    <button class="tab active" data-z="monde">World</button>
    <button class="tab" data-z="usa">USA</button>
    <button class="tab" data-z="europe">Europe</button>
    <button class="tab" data-z="asia">Asia</button>
  </div>

  <!-- Column headers -->
  <div class="sec-hdr">
    <span class="sec-hdr-name">Sector</span>
    <span class="sec-hdr-spark">Chart</span>
    <span class="sec-hdr-score">Score</span>
    <span class="sec-hdr-perf" id="hdr-perf">Today</span>
  </div>

  <div id="sec-scroll"><div id="sec-list"></div></div>

  <!-- Period tabs — full width -->
  <div class="ptabs" id="ptabs">
    <button class="ptab active" data-p="chg_pct" data-sp="spark_today" data-lbl="Today">Today</button>
    <button class="ptab" data-p="ret_1m"  data-sp="spark_1m"    data-lbl="1M">1M</button>
    <button class="ptab" data-p="ret_3m"  data-sp="spark_3m"    data-lbl="3M">3M</button>
    <button class="ptab" data-p="ret_6m"  data-sp="spark_6m"    data-lbl="6M">6M</button>
    <button class="ptab" data-p="ret_1y"  data-sp="spark_1y"    data-lbl="1Y">1Y</button>
  </div>
</section>
<script>
(function(){
  const SECS  = {{ box_sectors.secteurs | tojson }};
  const Z_MAP = {usa:"USA", europe:"EU", asia:"ASIE", monde:"MONDE"};
  let cZ = "monde", cP = "chg_pct", cSP = "spark_today";
  const sparkCharts = {};

  function destroySparks(){
    Object.values(sparkCharts).forEach(c => { try{ c.destroy(); }catch(e){} });
    Object.keys(sparkCharts).forEach(k => delete sparkCharts[k]);
  }

  function renderSectors(){
    destroySparks();
    const el   = document.getElementById("sec-list");
    const zone = Z_MAP[cZ];
    el.textContent = "";

    // Fixed order — no sort, all 16 sectors always shown
    SECS.forEach((s, i) => {
      const r      = s.regions ? s.regions[zone] : null;
      const missing = !r;

      const row = document.createElement("div");
      row.className = "sec-row" + (missing ? " sec-missing" : (r.above_dma200 ? " golden-alpha" : ""));

      if (missing) {
        // Sector exists in config but no ETF for this zone
        const nm = document.createElement("span");
        nm.className = "sec-name"; nm.textContent = s.nom;
        const dash1 = document.createElement("span");
        dash1.className = "sec-spark"; dash1.style.cssText = "color:var(--faint);text-align:center;font-size:11px;display:flex;align-items:center;justify-content:center"; dash1.textContent = "—";
        const dash2 = document.createElement("span");
        dash2.className = "sec-score sec-score-neu"; dash2.textContent = "—";
        const dash3 = document.createElement("span");
        dash3.className = "sec-perf p-flat"; dash3.textContent = "—";
        row.appendChild(nm); row.appendChild(dash1); row.appendChild(dash2); row.appendChild(dash3);
      } else {
        const perf = r[cP];
        const cls  = perf == null ? "p-flat" : perf > 0.3 ? "p-up" : perf < -0.3 ? "p-dn" : "p-flat";
        const sg   = (perf != null && perf >= 0) ? "+" : "";
        const sc   = r.score != null ? r.score.toFixed(2) : "—";
        const hot  = r.score != null && r.score > 0.3 ? " rvol-hot" : "";

        const nm = document.createElement("span");
        nm.className = "sec-name"; nm.title = s.nom; nm.textContent = s.nom;

        const spTd = document.createElement("div");
        spTd.className = "sec-spark";
        const cv = document.createElement("canvas");
        cv.id = "ss" + i; cv.width = 92; cv.height = 28; cv.className = "idx-spark";
        spTd.appendChild(cv);

        const scEl = document.createElement("span");
        const scColorCls = r.score == null ? "sec-score-neu"
                         : r.score >  0.1  ? "sec-score-pos"
                         : r.score < -0.1  ? "sec-score-neg"
                         :                   "sec-score-neu";
        scEl.className = "sec-score " + scColorCls;
        scEl.textContent = r.score != null ? (r.score >= 0 ? "+" : "") + r.score.toFixed(2) : "—";

        const pEl = document.createElement("span");
        pEl.className = "sec-perf " + cls;
        pEl.textContent = perf != null ? sg + Math.abs(perf).toFixed(2) + "%" : "—";

        row.appendChild(nm); row.appendChild(spTd); row.appendChild(scEl); row.appendChild(pEl);
      }

      el.appendChild(row);
    });

    // Draw sparklines after DOM is built
    SECS.forEach((s, i) => {
      const r = s.regions ? s.regions[zone] : null;
      if (!r) return;
      const cv  = document.getElementById("ss" + i);
      if (!cv) return;
      const raw = r[cSP] ? JSON.parse(r[cSP]) : [];
      if (!raw.length) return;
      const perf = r[cP];
      const col  = perf == null ? "rgb(138,126,110)" : perf > 0.3 ? "rgb(44,122,62)" : perf < -0.3 ? "rgb(160,48,32)" : "rgb(138,126,110)";
      const c    = miniChart(cv, raw, col, true);
      if (c) sparkCharts["ss" + i] = c;
    });
  }

  // Zone tab clicks
  document.getElementById("ztabs").addEventListener("click", function(e){
    const b = e.target.closest(".tab"); if (!b) return;
    document.querySelectorAll("#ztabs .tab").forEach(t => t.classList.remove("active"));
    b.classList.add("active"); cZ = b.dataset.z; renderSectors();
  });

  // Period tab clicks
  document.getElementById("ptabs").addEventListener("click", function(e){
    const b = e.target.closest(".ptab"); if (!b) return;
    document.querySelectorAll("#ptabs .ptab").forEach(t => t.classList.remove("active"));
    b.classList.add("active");
    cP  = b.dataset.p;
    cSP = b.dataset.sp;
    document.getElementById("hdr-perf").textContent = b.dataset.lbl;
    renderSectors();
  });

  renderSectors();
})();
</script>
