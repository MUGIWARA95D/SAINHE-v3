<!-- ═══ BOX_02 — INDICES ════════════════════════════════════ -->
<!-- DATA: box_indices = {par_region: {USA:[{ticker,nom,close,chg_pct,sparkline,above_dma200,...}],...}, total:int} -->
<section class="card" id="box-indices">
  <div class="card-h">
    <span class="card-t">Global Indices</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="box-ts"><span>Updated</span> {{ ts_indices }}</span>
      <span class="badge badge-gold">{{ box_indices.total }} <span>Indices · Smart Money Bias</span></span>
    </div>
  </div>
  <div style="overflow-x:auto"><table><thead><tr>
    <th style="min-width:130px" id="th-index"></th>
    <th style="min-width:56px" id="th-7d"></th>
    <th id="th-price"></th>
    <th id="th-day"></th>
    <th id="th-rvol"></th>
    <th id="th-sm"></th>
  </tr></thead><tbody id="idx-tb"></tbody></table></div>
  <div class="sent-hub" id="shub"></div>
</section>
<script>
(function(){

  var esc       = window.SAINHE_FMT.esc;
  var fmt       = window.SAINHE_FMT.fmt;
  var staleInfo = window.SAINHE_FMT.staleInfo;

  const REGIONS = {{ box_indices.par_region | tojson }};
  const ORDER   = ["USA","EU","ASIE","GLOBAL"];
  const tb      = document.getElementById("idx-tb");

  /* sparkline registry — destroyed before each re-render */
  var idxSparks = {};

  function renderIndices(){
    var I18N = window.SAINHE_I18N || {};
    var LOC  = window.SAINHE_LOCALE || 'en';
    /* column header labels */
    var colMap = {
      "th-index": I18N.col_index      ||"Index",
      "th-7d":    I18N.col_7d         ||"7d",
      "th-price": I18N.col_price      ||"Price",
      "th-day":   I18N.col_day_pct    ||"% Day",
      "th-rvol":  I18N.col_rvol       ||"RVOL",
      "th-sm":    I18N.col_smart_money||"Smart Money"
    };
    var colTips = {
      "th-7d":   "Price trend over the last 7 trading sessions.",
      "th-price":"Closing price in your selected display currency.",
      "th-day":  "Price change vs the previous session close.",
      "th-rvol": "Relative Volume — today's volume vs 20-day average. Highlighted in gold above 1.20.",
      "th-sm":   "Smart Money Bias — ACC when price rises with high volume (institutional buying), DIST when price drops with high volume (institutional selling)."
    };
    var colRows = {
      "th-7d":"7d", "th-price":"price", "th-day":"price", "th-rvol":"rvol", "th-sm":"sm"
    };
    Object.keys(colMap).forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      el.textContent = colMap[id];
      if(colTips[id] && window._ci) el.appendChild(window._ci(colTips[id],'indices',colRows[id]||null));
    });
    Object.values(idxSparks).forEach(function(c){ try{ c.destroy(); }catch(e){} });
    Object.keys(idxSparks).forEach(function(k){ delete idxSparks[k]; });

    let h = "", all = [];

    ORDER.forEach(region => {
      const items = REGIONS[region] || [];
      if (!items.length) return;
      h += `<tr><td colspan="6" style="padding:4px 10px 2px;font-size:9.5px;color:var(--muted);
        letter-spacing:.6px;text-transform:uppercase;background:var(--bg2);
        border-bottom:1px solid var(--border)">${esc(region)}</td></tr>`;
      items.forEach((x, i) => {
        const uid = region + "_" + i;
        all.push({uid, x});
        const chg = x.chg_pct || 0;
        const rv  = x.rvol;
        const c   = chg >= 0 ? "p-up" : "p-dn";
        const s   = chg >= 0 ? "+" : "";
        const rvTxt = rv != null ? rv.toFixed(2) : "—";
        const rvCls = rv != null && rv > 1.2 ? "rvol-hot" : "";

        /* Prix — 3 cas :
             1. convertible + devise gérée (USD/EUR/HKD) → symbole d'affichage
             2. convertible + devise inconnue (JPY/AUD/…) → valeur native + badge devise
             3. non-convertible (VIX, DXY, TNX, IRX)    → brut, sans symbole */
        let priceTxt;
        if (!x.convertible) {
          priceTxt = fmt(x.close);
        } else {
          const conv = window.fxConvert(x.close, x.native_devise);
          if (conv !== null) {
            priceTxt = window.fxSymbol() + conv.toLocaleString(LOC,{minimumFractionDigits:2,maximumFractionDigits:2});
          } else {
            priceTxt = fmt(x.close)
              + `<span class="idx-cur-badge">${esc(x.native_devise||"")}</span>`;
          }
        }

        let sm = "—", sc = "";
        if (x.chg_pct != null && rv != null) {
          if (chg > 0  && rv > 1.2) { sm=I18N.smb_accumulation||"ACCUMULATION"; sc="smb-acc";  }
          else if (chg > 0  && rv < 0.8) { sm=I18N.smb_weak_rally||"WEAK RALLY";   sc="smb-weak"; }
          else if (chg < 0  && rv > 1.2) { sm=I18N.smb_distribution||"DISTRIBUTION"; sc="smb-dist"; }
          else if (chg < 0  && rv < 0.8) { sm=I18N.smb_thin_slide||"THIN SLIDE";   sc="smb-thin"; }
          else                           { sm=I18N.smb_neutral||"NEUTRAL";      sc="smb-neut"; }
        } else if (x.chg_pct != null) {
          sm = chg > 0 ? (I18N.smb_rising||"RISING") : chg < 0 ? (I18N.smb_falling||"FALLING") : (I18N.smb_flat||"FLAT");
          sc = "smb-neut";
        }
        const st = staleInfo(x.ts_update);
        h += `<tr>
          <td>
            <strong style="color:var(--h)" translate="no">${esc(x.nom)}</strong><br>
            <span style="font-size:10px;color:var(--muted)" translate="no">${esc(x.ticker)}</span><br>
            <span class="ts-wrap ${st.cls}"><span class="ts-dot"></span><span class="ts-age">${st.label}</span></span>
          </td>
          <td><canvas class="idx-spark" id="isp_${esc(uid)}" width="56" height="22"></canvas></td>
          <td style="font-variant-numeric:tabular-nums">${priceTxt}</td>
          <td class="${c}" style="font-weight:600">${s}${(Math.abs(chg) * 100).toFixed(2)}%</td>
          <td style="font-variant-numeric:tabular-nums"><span class="${rvCls}">${esc(rvTxt)}</span></td>
          <td>${sc ? `<span class="smb ${sc}">${sm}</span>` : esc(sm)}</td>
        </tr>`;
      });
    });

    tb.innerHTML = h || `<tr><td colspan="6" style="padding:20px;color:var(--muted);text-align:center">${I18N.no_data_indices||"No data"}</td></tr>`;

    all.forEach(({uid, x}) => {
      const cv = document.getElementById("isp_" + uid);
      if (!cv) return;
      let raw = [];
      try { if(x.sparkline) raw = JSON.parse(x.sparkline); } catch(e) {}
      if (!raw.length) return;
      const ch = miniChart(cv, raw, x.chg_pct==null ? "rgb(120,110,90)" : x.chg_pct>=0 ? "rgb(44,122,62)" : "rgb(160,48,32)", false);
      if(ch) idxSparks["isp_" + uid] = ch;
    });

    /* Hub VIX + DXY — toujours en valeur native (indicateurs dimensionnels) */
    const flat = ORDER.flatMap(r => REGIONS[r] || []);
    const vix  = flat.find(x => x.ticker === "^VIX");
    const dxy  = flat.find(x => x.ticker === "DX-Y.NYB");
    let hub = "";
    if (vix && vix.close != null) {
      const reg = vix.close < 15 ? (I18N.vix_complacency||"Complacency")
                : vix.close < 20 ? (I18N.vix_normal||"Normal")
                : vix.close <= 30 ? (I18N.vix_fear||"Elevated Fear")
                : (I18N.vix_panic||"Panic");
      hub += `<span><strong>${I18N.hub_vix||"VIX:"}</strong> ${fmt(vix.close)} — ${reg}</span>`;
    }
    if (dxy && dxy.close != null) {
      const sp = (dxy.chg_pct||0) >= 0 ? "+" : "";
      const tr = (dxy.chg_pct||0) > 0 ? (I18N.dxy_bearish||"Bearish pressure on equities") : (I18N.dxy_supportive||"Supportive for equities");
      hub += `<span><strong>${I18N.hub_dxy||"DXY:"}</strong> ${fmt(dxy.close)} (${sp}${((dxy.chg_pct||0) * 100).toFixed(2)}%) — ${tr}</span>`;
    }
    document.getElementById("shub").innerHTML = hub;
  }

  /* expose pour le switcher de devise */
  window._sainheRenderIndices = renderIndices;
  renderIndices();
})();
</script>
