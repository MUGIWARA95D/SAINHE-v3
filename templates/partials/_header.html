<div id="scroll-prog"></div>
<header id="hdr">
  <span class="logo" onclick="(function(){
    var onDash = !!document.getElementById('box-macro');
    if(onDash){
      window._sainheIntro && window._sainheIntro(false);
    } else {
      sessionStorage.setItem('sainhe_logo_nav','1');
      location.href='/index.html';
    }
  })()" style="cursor:pointer">{{ site_name }}</span>
  <nav class="hdr-nav">
    <a href="#hero" class="hdr-nav-menu">Menu</a>
    {% for link in page_nav %}
    <a href="{{ link.href }}">{{ link.label }}</a>
    {% endfor %}
  </nav>
  <div class="spacer"></div>
  <!-- Currency dropdown -->
  <div class="hdr-dd" id="dd-cur">
    <button class="hdr-dd-btn" id="dd-cur-btn">{{ currency }}</button>
    <div class="hdr-dd-menu">
      {% for c in currencies %}
      <div class="hdr-dd-item{% if c == currency %} active{% endif %}"
           data-cur="{{ c }}"
           onclick="window._sainheSetCurrency('{{ c }}')">{{ c }}</div>
      {% endfor %}
    </div>
  </div>

  <!-- Onboarding / guided tour replay -->
  <button class="help-pill" id="onb-help" title="Take the guided tour" aria-label="Take the guided tour">?</button>

  <!-- Column info toggle -->
  <button class="ci-pill" id="ci-tgl" title="Toggle column hints" aria-label="Toggle column info">
    <span class="ci-glyph">i</span>
  </button>

  <!-- Dark mode pill -->
  <button class="thm-pill" id="thm" title="Toggle theme" aria-label="Toggle dark mode">
    <span class="tp-sun">&#9728;</span>
    <span class="tp-moon">&#9790;</span>
  </button>
</header>
<script>
/* Pill header: lift-on-scroll (tighter shadow + stronger blur once you start scrolling) */
(function(){
  var h = document.getElementById('hdr');
  if(!h) return;
  function upd(){ h.classList.toggle('scrolled', window.scrollY > 8); }
  upd();
  window.addEventListener('scroll', upd, {passive:true});
})();
</script>
