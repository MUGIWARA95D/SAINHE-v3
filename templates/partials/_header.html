<div id="scroll-prog"></div>
<header id="hdr">
  <span class="logo" onclick="(function(){
    var onDash = !!document.getElementById('box-macro');
    if(onDash){
      window._sainheIntro && window._sainheIntro(false);
    } else {
      sessionStorage.setItem('sainhe_logo_nav','1');
      location.href='index.html';
    }
  })()" style="cursor:pointer">{{ site_name }}</span>
  <span class="logo-sub">{{ site_slogan }}</span>
  <nav class="hdr-nav">
    <a href="#hero" class="hdr-nav-menu">{{ t.nav_menu }}</a>
    {% for link in page_nav %}
    <a href="{{ link.href }}">{{ link.label }}</a>
    {% endfor %}
  </nav>
  <div class="spacer"></div>
  <!-- Language dropdown -->
  <div class="hdr-dd" id="dd-lang">
    <button class="hdr-dd-btn" id="dd-lang-btn">{{ lang }}</button>
    <div class="hdr-dd-menu">
      {% for code in languages %}
      <div class="hdr-dd-item{% if code == lang %} active{% endif %}"
           onclick="window.location.href='{{ lang_urls[code] }}'">{{ code }}</div>
      {% endfor %}
    </div>
  </div>

  <!-- Currency dropdown -->
  <div class="hdr-dd" id="dd-cur">
    <button class="hdr-dd-btn" id="dd-cur-btn">{{ currency }}</button>
    <div class="hdr-dd-menu">
      {% for c in currencies %}
      <div class="hdr-dd-item{% if c == currency %} active{% endif %}"
           data-cur="{{ c }}"
           onclick="window._sainheSetCurrency('{{ c }}')">{{ c }}</div>
      {% endfor %}
    </div>
  </div>

  <!-- Dark mode pill -->
  <button class="thm-pill" id="thm" title="{{ t.toggle_theme }}" aria-label="{{ t.toggle_dark_mode }}">
    <span class="tp-sun">&#9728;</span>
    <span class="tp-moon">&#9790;</span>
  </button>
</header>
