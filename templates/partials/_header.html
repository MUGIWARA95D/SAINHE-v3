<div id="scroll-prog"></div>
<header id="hdr">
  <!-- 3-books navigation menu -->
  <div class="hdr-dd" id="dd-nav">
    <button class="hdr-dd-btn books-btn" id="dd-nav-btn" aria-label="Site navigation">
      <svg class="books-icon" viewBox="-2 -2 44 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Book 1 (left) -->
        <g class="bk-g bk1">
          <rect width="8" height="22" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <rect x="1.5" y="1.5" width="5" height="19" rx=".5" stroke="currentColor" stroke-width=".4" opacity=".2" fill="none"/>
          <path d="M0 22 L1 23.2 L9 23.2 L8 22" stroke="currentColor" stroke-width=".6" fill="none" opacity=".25"/>
        </g>
        <!-- Book 2 (center) -->
        <g class="bk-g bk2">
          <rect width="8" height="22" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <rect x="1.5" y="1.5" width="5" height="19" rx=".5" stroke="currentColor" stroke-width=".4" opacity=".2" fill="none"/>
          <path d="M0 22 L1 23.2 L9 23.2 L8 22" stroke="currentColor" stroke-width=".6" fill="none" opacity=".25"/>
        </g>
        <!-- Book 3 (right, most leaned) -->
        <g class="bk-g bk3">
          <rect width="8" height="22" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
          <rect x="1.5" y="1.5" width="5" height="19" rx=".5" stroke="currentColor" stroke-width=".4" opacity=".2" fill="none"/>
          <path d="M0 22 L1 23.2 L9 23.2 L8 22" stroke="currentColor" stroke-width=".6" fill="none" opacity=".25"/>
        </g>
      </svg>
    </button>
    <div class="hdr-dd-menu nav-menu">
      <div class="menu-books" aria-hidden="true">
        <svg width="72" height="46" viewBox="0 0 64 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Book 1 (bottom of pile — drawn first, behind) -->
          <g>
            <path d="M0,34 L2,37 L56,37 L54,34" stroke="currentColor" stroke-width=".6" fill="none" opacity=".2"/>
            <line x1="4" y1="35" x2="52" y2="35" stroke="currentColor" stroke-width=".3" opacity=".12"/>
            <line x1="4" y1="36" x2="52" y2="36" stroke="currentColor" stroke-width=".3" opacity=".08"/>
            <path d="M54,26 L57,28 L57,37 L54,34" stroke="currentColor" stroke-width=".6" fill="none" opacity=".15"/>
            <rect x="0" y="26" width="54" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <rect x="1.5" y="27.5" width="51" height="5" rx=".5" stroke="currentColor" stroke-width=".4" fill="none" opacity=".2"/>
          </g>
          <!-- Book 2 (middle) -->
          <g>
            <path d="M2,22 L4,25 L58,25 L56,22" stroke="currentColor" stroke-width=".6" fill="none" opacity=".2"/>
            <line x1="6" y1="23" x2="54" y2="23" stroke="currentColor" stroke-width=".3" opacity=".12"/>
            <line x1="6" y1="24" x2="54" y2="24" stroke="currentColor" stroke-width=".3" opacity=".08"/>
            <path d="M56,14 L59,16 L59,25 L56,22" stroke="currentColor" stroke-width=".6" fill="none" opacity=".15"/>
            <rect x="2" y="14" width="54" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <rect x="3.5" y="15.5" width="51" height="5" rx=".5" stroke="currentColor" stroke-width=".4" fill="none" opacity=".2"/>
          </g>
          <!-- Book 3 (top of pile — drawn last, in front) -->
          <g>
            <path d="M1,10 L3,13 L57,13 L55,10" stroke="currentColor" stroke-width=".6" fill="none" opacity=".2"/>
            <line x1="5" y1="11" x2="53" y2="11" stroke="currentColor" stroke-width=".3" opacity=".12"/>
            <line x1="5" y1="12" x2="53" y2="12" stroke="currentColor" stroke-width=".3" opacity=".08"/>
            <path d="M55,2 L58,4 L58,13 L55,10" stroke="currentColor" stroke-width=".6" fill="none" opacity=".15"/>
            <rect x="1" y="2" width="54" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
            <rect x="2.5" y="3.5" width="51" height="5" rx=".5" stroke="currentColor" stroke-width=".4" fill="none" opacity=".2"/>
          </g>
        </svg>
      </div>
      <div class="hdr-dd-item active" onclick="window.location.href='/'">Dashboard</div>
      <div class="hdr-dd-item" onclick="window.location.href='/fundamental'">Fundamental Analysis</div>
      <div class="hdr-dd-item" onclick="window.location.href='/learn'">Learn</div>
    </div>
  </div>

  <span class="logo" onclick="if(window._sainheIntro)window._sainheIntro()" style="cursor:pointer">{{ site_name }}</span>
  <span class="logo-sub">{{ site_slogan }}</span>
  <nav class="hdr-nav">
    <a href="#nav-indices" class="active">Indices</a>
    <a href="#nav-news">News</a>
    <a href="#nav-sectors">Sectors</a>
    <a href="#nav-sentiment">Sentiment</a>
    <a href="#nav-macro">Macro</a>
    <a href="#nav-portfolio">Portfolio</a>
  </nav>
  <div class="spacer"></div>
  <!-- Language dropdown -->
  <div class="hdr-dd" id="dd-lang">
    <button class="hdr-dd-btn" id="dd-lang-btn">{{ lang }}</button>
    <div class="hdr-dd-menu">
      {% for code in languages %}
      <div class="hdr-dd-item{% if code == lang %} active{% endif %}"
           onclick="window.location.href='?lang={{ code }}&amp;currency={{ currency }}'">{{ code }}</div>
      {% endfor %}
    </div>
  </div>

  <!-- Currency dropdown -->
  <div class="hdr-dd" id="dd-cur">
    <button class="hdr-dd-btn" id="dd-cur-btn">{{ currency }}</button>
    <div class="hdr-dd-menu">
      {% for c in currencies %}
      <div class="hdr-dd-item{% if c == currency %} active{% endif %}"
           onclick="window.location.href='?lang={{ lang }}&amp;currency={{ c }}'">{{ c }}</div>
      {% endfor %}
    </div>
  </div>

  <!-- Dark mode pill -->
  <button class="thm-pill" id="thm" title="Toggle theme" aria-label="Toggle dark mode">
    <span class="tp-sun">&#9728;</span>
    <span class="tp-moon">&#9790;</span>
  </button>
</header>
