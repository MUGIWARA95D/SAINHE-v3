<!-- ═══ SPINE / ROOT SYSTEM ══════════════════════════════════════════
     Three organic bezier root strands that emerge from the hero base,
     braid/cross each other as sections alternate left ↔ right, and
     grow progressively as the user scrolls down.

     GPU-only: stroke-dashoffset + opacity.
     pointer-events: none — never blocks any interaction.
     Respects prefers-reduced-motion.
     Hidden below 900 px (full-width layout on mobile).
═══════════════════════════════════════════════════════════════════ -->
<style>
/* ════════════════════════════════════════════════════════
   PAGE WRAPPER — roots SVG anchors inside this
════════════════════════════════════════════════════════ */
#page-wrap {
  position: relative;
  /* overflow:hidden would clip the SVG — keep visible */
}

/* ════════════════════════════════════════════════════════
   SPINE HOST + SVG
════════════════════════════════════════════════════════ */
.spine-host {
  position: absolute;
  inset: 0;
  width: 100%;
  pointer-events: none;
  z-index: 0;
}
#spine-svg {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  overflow: visible;
  pointer-events: none;
}

/* ════════════════════════════════════════════════════════
   ROOT STRANDS
════════════════════════════════════════════════════════ */
.rs {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
  will-change: stroke-dashoffset;
}
/* Three strands: A (secondary left), B (main trunk), C (secondary right) */
.rs-a { stroke: var(--gold-deep); stroke-width: 1.0; opacity: 0; transition: opacity 1.4s ease; }
.rs-b { stroke: var(--gold-deep); stroke-width: 1.7; opacity: 0; transition: opacity 1.4s ease; }
.rs-c { stroke: var(--gold-deep); stroke-width: 0.85; opacity: 0; transition: opacity 1.4s ease; }

[data-theme="dark"] .rs-a { stroke: var(--gold); }
[data-theme="dark"] .rs-b { stroke: var(--gold); }
[data-theme="dark"] .rs-c { stroke: var(--gold); }

/* Fade strands in once SVG is injected */
.spine-ready .rs-a { opacity: 0.13; }
.spine-ready .rs-b { opacity: 0.19; }
.spine-ready .rs-c { opacity: 0.09; }

[data-theme="dark"] .spine-ready .rs-a { opacity: 0.18; }
[data-theme="dark"] .spine-ready .rs-b { opacity: 0.26; }
[data-theme="dark"] .spine-ready .rs-c { opacity: 0.13; }

@media (prefers-reduced-motion: reduce) {
  .rs-a, .rs-b, .rs-c {
    opacity: 0.1 !important;
    transition: none !important;
    stroke-dasharray: unset !important;
    stroke-dashoffset: unset !important;
  }
  .spine-ready .rs-b { opacity: 0.15 !important; }
}

/* ════════════════════════════════════════════════════════
   SECTION NODE DOTS (on the main strand at each entry)
════════════════════════════════════════════════════════ */
.rn {
  fill: var(--gold-deep);
  opacity: 0;
  transition: opacity .55s ease;
}
.rn.lit { opacity: 0.52; }
[data-theme="dark"] .rn { fill: var(--gold); }
[data-theme="dark"] .rn.lit { opacity: 0.65; }

/* ════════════════════════════════════════════════════════
   SECTION BANDS — remove solid backgrounds, let roots breathe
════════════════════════════════════════════════════════ */
/* Override the chocolate and cream block backgrounds */
.sec-choc,
.sec-creme {
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  padding: 0 0 32px;
  margin-bottom: 0;
}
[data-theme="dark"] .sec-choc,
[data-theme="dark"] .sec-creme {
  background: transparent;
}

/* Restore text colors that were set for the dark-choc background */
.sec-choc .section-lbl h2 { color: var(--h); }
.sec-choc .section-lbl em { color: var(--muted); }
.sec-choc .section-num {
  background: var(--gold-bg);
  border-color: var(--gold-border);
  color: var(--gold-deep);
}
.sec-choc .section-lbl::before {
  background: linear-gradient(90deg, var(--border) 0%, transparent 55%);
}

/* Thin separator between consecutive bands */
.sec-band + .sec-band {
  border-top: 1px solid rgba(196, 149, 90, .07);
  padding-top: 4px;
}

/* Statement bar breathing room */
.statement-bar { margin-bottom: 52px; }

/* ════════════════════════════════════════════════════════
   ALTERNATING SECTION LAYOUT
   data-flow="left"  → label on LEFT,  roots visible on RIGHT
   data-flow="right" → label on RIGHT, roots visible on LEFT
════════════════════════════════════════════════════════ */

/* --- LEFT flow --- */
.sec-band[data-flow="left"] .section-lbl {
  max-width: 54%;
}
.sec-band[data-flow="left"] .section-lbl::before {
  background: linear-gradient(90deg, var(--border) 0%, transparent 55%);
}

/* --- RIGHT flow --- */
.sec-band[data-flow="right"] .section-lbl {
  margin-left: auto;
  max-width: 54%;
  justify-content: flex-end;
  text-align: right;
}
.sec-band[data-flow="right"] .section-lbl h2 { text-align: right; }
.sec-band[data-flow="right"] .section-lbl em { text-align: right; }
.sec-band[data-flow="right"] .section-lbl::before {
  background: linear-gradient(270deg, var(--border) 0%, transparent 55%);
}
/* Info (i) button moves to the opposite side from the label */
.sec-band[data-flow="right"] .bib-wrap { right: auto; left: 20px; }

/* --- Responsive: full-width on small screens --- */
@media (max-width: 900px) {
  .sec-band[data-flow="left"]  .section-lbl,
  .sec-band[data-flow="right"] .section-lbl {
    max-width: 100%;
    margin-left: 0;
    text-align: left;
    justify-content: flex-start;
  }
  .sec-band[data-flow="right"] .section-lbl h2 { text-align: left; }
  .sec-band[data-flow="right"] .section-lbl em { text-align: left; }
  .sec-band[data-flow="right"] .bib-wrap { right: 20px; left: auto; }
  /* Hide spine on mobile — clean layout */
  .spine-host { display: none; }
}

/* ════════════════════════════════════════════════════════
   PER-PAGE NUDE TINTS
   html[data-page-index] is already set by render_html.py
════════════════════════════════════════════════════════ */
html[data-page-index="0"] body { background: #F5F0E6; }  /* Dashboard — parchment */
html[data-page-index="1"] body { background: #EDE5D8; }  /* Stock     — cool nude */
html[data-page-index="2"] body { background: #F2EADA; }  /* Learn     — warm ivory */
html[data-page-index="3"] body { background: #E8DDD0; }  /* Contact   — dry sand  */
[data-theme="dark"] body { background: var(--bg) !important; }

/* Chip matching active page tint */
html[data-page-index="1"] .hero-chip:nth-child(2),
html[data-page-index="2"] .hero-chip:nth-child(3),
html[data-page-index="3"] .hero-chip:nth-child(4) {
  border-color: rgba(180, 100, 40, .4);
}
</style>

<script>
/* ═══ SPINE BUILD + SCROLL ANIMATION ══════════════════════════════
   Runs once after layout settles.
   Three bezier strands braid between sections that alternate
   left ↔ right: the crossing happens naturally from the path geometry.
═══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* Skip on reduced-motion or narrow screens */
  if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if (window.matchMedia('(max-width:900px)').matches) return;

  /* Seeded pseudo-random for deterministic organic wobble */
  var _seed = 137;
  function rng() { _seed = (_seed * 9301 + 49297) % 233280; return (_seed / 233280) - 0.5; }
  function resetSeed() { _seed = 137; }

  function buildSpine() {
    resetSeed();

    var wrap = document.getElementById('page-wrap');
    if (!wrap) return;

    var heroShell = document.querySelector('.hero-shell');
    var bands = Array.from(document.querySelectorAll('.sec-band[data-flow]'));
    if (!heroShell || !bands.length) return;

    /* Remove previous spine if rebuilding (e.g. on resize) */
    var old = wrap.querySelector('.spine-host');
    if (old) { wrap.removeChild(old); wrap.classList.remove('spine-ready'); }

    var wRect    = wrap.getBoundingClientRect();
    var W        = wrap.offsetWidth;
    var scrollY0 = window.scrollY;

    /* Hero bottom in wrap-local coordinates */
    var hRect  = heroShell.getBoundingClientRect();
    var heroY  = hRect.bottom - wRect.top + scrollY0;
    var heroX  = W / 2;

    /* Section anchors — where the main strand aims */
    var anchors = bands.map(function (b) {
      var lbl = b.querySelector('.section-lbl');
      var r   = (lbl || b).getBoundingClientRect();
      var y   = r.top + r.height * 0.40 - wRect.top + scrollY0;
      var flow = b.getAttribute('data-flow');

      /* X cluster: label is on the flow side, roots are on the OPPOSITE side.
         flow="left"  → label on left  → roots bunch on the RIGHT
         flow="right" → label on right → roots bunch on the LEFT
         Swapping clusters across sections causes the strands to cross/braid. */
      var xa, xb, xc;
      if (flow === 'left') {
        xa = W * 0.60;  xb = W * 0.76;  xc = W * 0.91;  /* roots RIGHT */
      } else {
        xa = W * 0.09;  xb = W * 0.24;  xc = W * 0.40;  /* roots LEFT  */
      }
      return { y: y, xa: xa, xb: xb, xc: xc };
    });

    var totalH = wrap.scrollHeight;

    /* Build a cubic-bezier path for one strand */
    function makePath(startX, getX) {
      var pts = [{ x: startX, y: heroY }];
      anchors.forEach(function (a) { pts.push({ x: getX(a), y: a.y }); });
      /* Trailing tail to page bottom — converge gently to center */
      pts.push({ x: W * 0.5 + (startX - W * 0.5) * 0.25, y: totalH + 40 });

      var d = 'M ' + pts[0].x.toFixed(0) + ' ' + pts[0].y.toFixed(0);
      for (var i = 1; i < pts.length; i++) {
        var p0 = pts[i - 1], p1 = pts[i];
        var dy = p1.y - p0.y;
        var wobble = W * 0.035;
        /* Bezier control points — organic lateral drift */
        var cp1x = p0.x + rng() * wobble;
        var cp1y = p0.y + dy * 0.36;
        var cp2x = p1.x + rng() * wobble;
        var cp2y = p1.y - dy * 0.26;
        d += ' C ' + cp1x.toFixed(1) + ' ' + cp1y.toFixed(1)
           + ',' + cp2x.toFixed(1) + ' ' + cp2y.toFixed(1)
           + ',' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1);
      }
      return d;
    }

    /* Strand A — leftmost tendril */
    var dA = makePath(heroX - 5, function (a) { return a.xa; });
    /* Strand B — main trunk (thickest, most visible) */
    var dB = makePath(heroX,     function (a) { return a.xb; });
    /* Strand C — rightmost tendril */
    var dC = makePath(heroX + 5, function (a) { return a.xc; });

    /* ── Build SVG ─────────────────────────────────────── */
    var NS  = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.id  = 'spine-svg';
    svg.setAttribute('width',  W);
    svg.setAttribute('height', totalH);
    svg.setAttribute('aria-hidden', 'true');

    function mkPath(d, cls) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('class', 'rs ' + cls);
      return p;
    }
    var pA = mkPath(dA, 'rs-a');
    var pB = mkPath(dB, 'rs-b');
    var pC = mkPath(dC, 'rs-c');

    /* Node dots at each section entry (ride the main trunk B) */
    var nodeEls = anchors.map(function (a) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', a.xb.toFixed(0));
      c.setAttribute('cy', a.y.toFixed(0));
      c.setAttribute('r',  '3.5');
      c.setAttribute('class', 'rn');
      c._trigY = a.y;
      return c;
    });

    [pA, pB, pC].forEach(function (p) { svg.appendChild(p); });
    nodeEls.forEach(function (n) { svg.appendChild(n); });

    /* Inject host BEFORE first child of wrap (behind all content) */
    var host = document.createElement('div');
    host.className = 'spine-host';
    host.appendChild(svg);
    wrap.insertBefore(host, wrap.firstChild);

    /* Calculate total lengths AFTER appending to DOM */
    [pA, pB, pC].forEach(function (p) {
      var len;
      try { len = p.getTotalLength(); } catch (e) { len = 5000; }
      p.setAttribute('stroke-dasharray',  len.toFixed(0));
      p.setAttribute('stroke-dashoffset', len.toFixed(0));
      p._len = len;
    });

    /* Fade strands in smoothly */
    setTimeout(function () { wrap.classList.add('spine-ready'); }, 60);

    /* ── Scroll-driven animation ──────────────────────── */
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var raf  = null;

    function tick() {
      raf = null;
      var sy   = window.scrollY;
      var prog = docH > 0 ? Math.min(sy / docH, 1) : 0;

      /* Roots grow as user scrolls — slight overshoot so they finish slightly before page end */
      [pA, pB, pC].forEach(function (p) {
        var off = p._len * Math.max(0, 1 - prog * 1.10);
        p.setAttribute('stroke-dashoffset', off.toFixed(1));
      });

      /* Light up section nodes as they scroll into view */
      var viewMid = sy + window.innerHeight * 0.60;
      nodeEls.forEach(function (n) {
        n.classList.toggle('lit', viewMid > n._trigY);
      });
    }

    window.addEventListener('scroll', function () {
      if (!raf) raf = requestAnimationFrame(tick);
    }, { passive: true });

    tick();

    /* Rebuild on resize (debounced 300 ms) */
    var resizeT;
    window.addEventListener('resize', function () {
      clearTimeout(resizeT);
      resizeT = setTimeout(buildSpine, 300);
    });
  }

  /* Wait for fonts + layout to settle before measuring DOM */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(buildSpine, 150); });
  } else {
    setTimeout(buildSpine, 150);
  }
})();
</script>
