<!-- ═══ HERO — shared across all pages ═══════════════════════ -->
<section class="hero" id="hero">
  <div class="hero-grid" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">
      <span class="hero-dot"></span>
      <span><span data-i18n="hero_platform">{{ t.hero_platform }}</span> &middot; {{ ts_render }}</span>
    </div>
    <h1 class="hero-title">
      <span data-i18n="hero_title_1">{{ t.hero_title_1 }}</span><br>
      <em data-i18n="hero_title_2">{{ t.hero_title_2 }}</em>
    </h1>
    <p class="hero-lede" data-i18n="hero_lede">{{ t.hero_lede }}</p>
  </div>
  <div class="hero-chips">
    <a class="hero-chip{% if current_page == 'dashboard' %} hero-chip-active{% endif %}"
       href="/index.html" data-i18n="nav_dashboard">{{ t.nav_dashboard }}</a>
    <a class="hero-chip{% if current_page == 'stock-analysis' %} hero-chip-active{% endif %}"
       href="/stock-analysis.html" data-i18n="nav_stock_analysis">{{ t.nav_stock_analysis }}</a>
    <a class="hero-chip{% if current_page == 'learn' %} hero-chip-active{% endif %}"
       href="/learn.html" data-i18n="nav_learn">{{ t.nav_learn }}</a>
    <a class="hero-chip{% if current_page == 'contact' %} hero-chip-active{% endif %}"
       href="/contact.html" data-i18n="nav_contact">{{ t.nav_contact }}</a>
  </div>
</section>
