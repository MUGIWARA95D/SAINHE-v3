<!-- ═══ HERO — shared across all pages ═══════════════════════ -->
<section class="hero" id="hero">
  <div class="hero-grid" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">
      <span class="hero-dot"></span>
      <span>{{ t.hero_platform }} &middot; {{ ts_render }}</span>
    </div>
    <h1 class="hero-title">
      {{ t.hero_title_1 }}<br>
      <em>{{ t.hero_title_2 }}</em>
    </h1>
    <p class="hero-lede">{{ t.hero_lede }}</p>
  </div>
  <div class="hero-chips">
    <a class="hero-chip{% if current_page == 'dashboard' %} hero-chip-active{% endif %}"
       href="{{ lang_urls['dashboard'] if lang_urls is defined else 'index.html' }}">{{ t.nav_dashboard }}</a>
    <a class="hero-chip{% if current_page == 'stock-analysis' %} hero-chip-active{% endif %}"
       href="{{ lang_urls['stock-analysis'] if lang_urls is defined else 'stock-analysis.html' }}">{{ t.nav_stock_analysis }}</a>
    <a class="hero-chip{% if current_page == 'learn' %} hero-chip-active{% endif %}"
       href="{{ lang_urls['learn'] if lang_urls is defined else 'learn.html' }}">{{ t.nav_learn }}</a>
    <a class="hero-chip{% if current_page == 'contact' %} hero-chip-active{% endif %}"
       href="{{ lang_urls['contact'] if lang_urls is defined else 'contact.html' }}">{{ t.nav_contact }}</a>
  </div>
</section>
