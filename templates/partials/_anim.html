<!-- ═══ SCROLL-IN ANIMATIONS — sober fade-up + slight blur ═══════════════════════ -->
<!-- Targets every dashboard box (.card) and every page section (.sec-band).   -->
<!-- Respects prefers-reduced-motion. GPU-only (opacity/transform/filter).     -->
<style>
.anim-init{opacity:0;transform:translateY(18px);filter:blur(2px);
  transition:opacity .98s cubic-bezier(.2,.6,.2,1),
             transform .98s cubic-bezier(.2,.6,.2,1),
             filter .82s ease-out;
  will-change:opacity,transform,filter}
.anim-in{opacity:1;transform:none;filter:none}
@media(prefers-reduced-motion:reduce){
  .anim-init,.anim-in{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
}
</style>
<script>
window._sainheAnimObserver = null;

window._sainheCleanupAnim = function(){
  if(window._sainheAnimObserver){
    window._sainheAnimObserver.disconnect();
    window._sainheAnimObserver = null;
  }
};

window._sainheInitAnim = function(){
  window._sainheCleanupAnim();
  if(!('IntersectionObserver' in window)) return;
  var COMPACT = window.matchMedia('(max-width:900px)').matches
             || window.matchMedia('(pointer:coarse)').matches;
  var TH = COMPACT ? 0    : 0.12;
  var RM = COMPACT ? '0px 0px 15% 0px' : '0px 0px -8% 0px';

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e, idx){
      if(!e.isIntersecting) return;
      e.target.style.transitionDelay = (idx * 90) + 'ms';
      e.target.classList.add('anim-in');
      io.unobserve(e.target);
    });
  }, {threshold: TH, rootMargin: RM});
  window._sainheAnimObserver = io;

  document.querySelectorAll('#main .card, #main .sec-band').forEach(function(el){
    el.classList.remove('anim-in');
    el.classList.add('anim-init');
    io.observe(el);
  });
};

window._sainheInitAnim();

/* ═══ COUNT-UP — animate any [data-count] number into view ═════════════════════ */
/* data-count="42.5" [data-dec="1"] [data-prefix="$"] [data-suffix="%"].         */
/* Respects prefers-reduced-motion (snaps to final value).                       */
window._sainheCountObserver = null;
window._sainheInitCountUp = function(){
  if(window._sainheCountObserver){ window._sainheCountObserver.disconnect(); }
  if(!('IntersectionObserver' in window)) return;
  var reduce = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  function run(el){
    var target = parseFloat(el.getAttribute('data-count'));
    if(!isFinite(target)){ return; }
    var dec = parseInt(el.getAttribute('data-dec') || '0', 10);
    var pre = el.getAttribute('data-prefix') || '';
    var suf = el.getAttribute('data-suffix') || '';
    var fmt = function(v){ return pre + v.toLocaleString('en',{minimumFractionDigits:dec,maximumFractionDigits:dec}) + suf; };
    if(reduce){ el.textContent = fmt(target); return; }
    var dur = 1100, t0 = performance.now();
    (function step(t){
      var p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * e);
      if(p < 1) requestAnimationFrame(step);
    })(performance.now());
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      run(e.target); io.unobserve(e.target);
    });
  }, {threshold: 0.4});
  window._sainheCountObserver = io;
  document.querySelectorAll('[data-count]').forEach(function(el){ io.observe(el); });
};
window._sainheInitCountUp();
</script>
