<!-- ═══ PAGE DOTS INDICATOR ═══════════════════════════════ -->
<div id="page-dots" aria-label="Page navigation" role="navigation">
  <button class="pg-dot" data-page="0" aria-label="Dashboard" title="Dashboard"></button>
  <button class="pg-dot" data-page="1" aria-label="Stock Analysis" title="Stock Analysis"></button>
  <button class="pg-dot" data-page="2" aria-label="Learn" title="Learn"></button>
  <button class="pg-dot" data-page="3" aria-label="Contact" title="Contact"></button>
</div>

<!-- ═══ SWIPE NAVIGATION ENGINE ══════════════════════════ -->
<script>
(function(){
  var PAGES = [
    { path: '/index.html' },
    { path: '/stock-analysis.html' },
    { path: '/learn.html' },
    { path: '/contact.html' },
  ];

  var cache = {};       /* index → { dom: HTMLElement, meta: object } */
  var currentPage = 0;
  var navigating  = false;
  var pushCount   = 0;  /* cap real history entries so back-stack never bloats */
  var MAX_PUSH    = 3;  /* after 3 URL changes, overwrite instead of stacking  */

  /* ── Init ───────────────────────────────────────────── */
  function init() {
    var idx = parseInt(document.documentElement.dataset.pageIndex, 10);
    currentPage = isNaN(idx) ? 0 : idx;

    var metaEl = document.getElementById('sainhe-page-meta');
    if (metaEl) {
      try {
        var meta = JSON.parse(metaEl.textContent);
        cache[currentPage] = { meta: meta, dom: null }; /* current page = no need to re-fetch DOM */
      } catch(e) {}
    }

    updateDots(currentPage);
    updateHeroChips(currentPage);
    history.replaceState({ page: currentPage }, '', location.pathname);

    /* Prefetch other pages after idle */
    setTimeout(prefetchAll, 1500);
  }

  /* ── Prefetch ───────────────────────────────────────── */
  function prefetchAll() {
    PAGES.forEach(function(_, i) {
      if (i !== currentPage && !cache[i]) fetchPage(i);
    });
  }

  function fetchPage(index) {
    if (cache[index] && cache[index].dom) return Promise.resolve(cache[index]);
    return fetch(PAGES[index].path, { cache: 'no-cache' })
      .then(function(r) { return r.text(); })
      .then(function(html) {
        var doc = (new DOMParser()).parseFromString(html, 'text/html');
        var main = doc.getElementById('main');
        var metaEl = doc.getElementById('sainhe-page-meta');
        var meta = {};
        if (metaEl) { try { meta = JSON.parse(metaEl.textContent); } catch(e) {} }
        cache[index] = { dom: main, meta: meta };
        return cache[index];
      })
      .catch(function() { return null; });
  }

  /* ── UI helpers ─────────────────────────────────────── */
  function updateDots(index) {
    document.querySelectorAll('.pg-dot').forEach(function(d) {
      d.classList.toggle('active', parseInt(d.dataset.page, 10) === index);
    });
  }

  function updateHeroChips(index) {
    var targetPath = PAGES[index] && PAGES[index].path;
    document.querySelectorAll('.hero-chip').forEach(function(chip) {
      var href = chip.getAttribute('href');
      var active = targetPath && (href === targetPath || href.replace('/index.html', '/') === targetPath);
      chip.classList.toggle('hero-chip-active', !!active);
    });
  }

  function updateHeaderNav(navLinks) {
    var nav = document.querySelector('.hdr-nav');
    if (!nav) return;
    Array.from(nav.querySelectorAll('a:not(.hdr-nav-menu)')).forEach(function(a) { a.remove(); });
    (navLinks || []).forEach(function(link) {
      var a = document.createElement('a');
      a.href = link.href;
      a.textContent = link.label;
      nav.appendChild(a);
    });
  }

  /* ── Cleanup ────────────────────────────────────────── */
  function destroyCharts() {
    if (typeof Chart !== 'undefined') {
      document.querySelectorAll('#main canvas').forEach(function(cv) {
        var c = Chart.getChart(cv);
        if (c) try { c.destroy(); } catch(e) {}
      });
    }
    /* Stop any D3 force simulation registered by the current page */
    if (window._sainheD3Sim) {
      try { window._sainheD3Sim.stop(); } catch(e) {}
      window._sainheD3Sim = null;
    }
  }

  /* ── Script re-execution — external deps load first, then inline ── */
  /* Problem: inline scripts that depend on external CDN libraries (e.g. D3)
     would run before those libraries finish loading if we executed everything
     immediately. Fix: collect external <script src> tags, wait for all to load
     (skipping ones whose global is already present), then run inline scripts. */
  function reRunScripts(container) {
    var all = Array.from(container.querySelectorAll('script'));
    var ext = all.filter(function(s) { return !!s.src; });
    var inl = all.filter(function(s) { return !s.src; });

    function runInline() {
      inl.forEach(function(old) {
        var s = document.createElement('script');
        s.textContent = old.textContent;
        if (old.parentNode) old.parentNode.replaceChild(s, old);
        else container.appendChild(s);
      });
    }

    if (!ext.length) { runInline(); return; }

    var pending = ext.length;
    function onLoad() { if (--pending === 0) runInline(); }

    ext.forEach(function(old) {
      /* D3 already loaded globally — skip re-fetching, just count it done */
      if (old.src.indexOf('d3') !== -1 && typeof window.d3 !== 'undefined') {
        old.remove(); onLoad(); return;
      }
      var s = document.createElement('script');
      s.src = old.src;
      s.async = false; /* preserve relative execution order */
      s.onload = s.onerror = onLoad;
      old.parentNode.replaceChild(s, old);
    });
  }

  /* ── Navigate ───────────────────────────────────────── */
  function navigate(targetIndex, pushState) {
    if (navigating) return;
    if (targetIndex < 0 || targetIndex >= PAGES.length) return; /* elastic stop */
    if (targetIndex === currentPage) return;
    navigating = true;
    pushState = (pushState !== false);

    var main = document.getElementById('main');
    if (!main) { navigating = false; return; }

    /* Fade out */
    main.style.opacity = '0';
    var prog = document.getElementById('scroll-prog');
    if (prog) prog.style.width = '0%';

    fetchPage(targetIndex).then(function(cached) {
      window.scrollTo({ top: 0, behavior: 'instant' });

      destroyCharts();
      window._sainheCleanupAnim && window._sainheCleanupAnim();

      if (cached && cached.dom) {
        main.innerHTML = cached.dom.innerHTML;

        var meta = cached.meta || {};
        if (meta.title) document.title = meta.title;
        updateHeaderNav(meta.nav || []);
        document.documentElement.dataset.pageIndex = targetIndex;

        if (pushState) {
          /* Keep at most MAX_PUSH entries in the back-stack: stack the first
             few URL changes, then overwrite so memory never grows unbounded. */
          if (pushCount < MAX_PUSH) {
            history.pushState({ page: targetIndex }, meta.title || '', PAGES[targetIndex].path);
            pushCount++;
          } else {
            history.replaceState({ page: targetIndex }, meta.title || '', PAGES[targetIndex].path);
          }
        }

        currentPage = targetIndex;
        updateDots(currentPage);
        updateHeroChips(currentPage);

        reRunScripts(main);
        /* Do NOT re-run the scroll-in reveal on swipe: freshly-injected static
           content is already visible, so cards and their (i) marks stay still
           instead of replaying the fade/blur entrance on every page change. */
      }

      main.style.opacity = '1';
      navigating = false;
    }).catch(function() {
      main.style.opacity = '1';
      navigating = false;
    });
  }

  /* ── Swipe-exclusion zones ──────────────────────────── */
  /* Returns true if the element (or any ancestor) belongs to a zone where
     horizontal interaction is owned by the content, not the page navigator.
     Covers: D3 mindmap (pan/zoom/drag), macro & signal carousels on mobile,
     and any element that is actually horizontally overflowing. */
  function inSwipeExclude(el) {
    if (!el) return false;
    var node = el;
    while (node && node !== document.body) {
      var id = node.id;
      /* Mindmap: D3 applies its own pan/zoom/drag — never steal those touches */
      if (id === 'mm-wrap' || id === 'mm-svg' || id === 'mm-bar') return true;
      /* Named carousels (class-based) */
      if (node.classList) {
        if (node.classList.contains('region-cards') || node.classList.contains('macro-grid')) return true;
      }
      /* Any element that is actually scrollable horizontally */
      try {
        var ox = window.getComputedStyle(node).overflowX;
        if ((ox === 'scroll' || ox === 'auto') && node.scrollWidth > node.clientWidth + 2) return true;
      } catch(e) {}
      node = node.parentElement;
    }
    return false;
  }

  /* ── Touch (mobile swipe) ───────────────────────────── */
  var touchX = 0, touchY = 0, touchTarget = null;
  document.addEventListener('touchstart', function(e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
    touchTarget = e.target;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    /* Ignore swipe that started inside a horizontally-interactive zone */
    if (inSwipeExclude(touchTarget)) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    /* horizontal must be ≥50px and > 1.5× vertical to avoid conflict with scroll */
    if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      navigate(currentPage + (dx > 0 ? -1 : 1));
    }
  }, { passive: true });

  /* ── Mouse drag (desktop) ───────────────────────────── */
  var mStartX = 0, mStartTarget = null, mDown = false, mDragged = false;
  document.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    mStartX      = e.clientX;
    mStartTarget = e.target;
    mDown        = true;
    mDragged     = false;
  });
  document.addEventListener('mousemove', function(e) {
    if (mDown && Math.abs(e.clientX - mStartX) > 10) mDragged = true;
  });
  document.addEventListener('mouseup', function(e) {
    if (mDown && mDragged && !inSwipeExclude(mStartTarget)) {
      var dx = e.clientX - mStartX;
      if (Math.abs(dx) >= 80) navigate(currentPage + (dx > 0 ? -1 : 1));
    }
    mDown = false; mDragged = false;
  });

  /* ── Keyboard (← →) ────────────────────────────────── */
  document.addEventListener('keydown', function(e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    var tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowRight') navigate(currentPage + 1);
    if (e.key === 'ArrowLeft')  navigate(currentPage - 1);
  });

  /* ── Dot clicks ── */
  /* Three-layer approach: pointerdown (capture) + mousedown (target) + click (target)
     so that no browser quirk can silently swallow the event. */
  document.addEventListener('pointerdown', function(e) {
    if (e.button !== undefined && e.button !== 0) return;
    var dot = e.target.closest ? e.target.closest('.pg-dot') : null;
    if (!dot) return;
    e.preventDefault();
    navigate(parseInt(dot.dataset.page, 10));
  }, true);
  document.querySelectorAll('.pg-dot').forEach(function(dot) {
    dot.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      navigate(parseInt(dot.dataset.page, 10));
    });
    dot.addEventListener('click', function(e) {
      navigate(parseInt(dot.dataset.page, 10));
    });
  });
  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var dot = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('pg-dot') ? document.activeElement : null;
    if (!dot) return;
    e.preventDefault();
    navigate(parseInt(dot.dataset.page, 10));
  });

  /* ── Header nav + hero chip clicks → swipe instead of full reload ── */
  document.addEventListener('click', function(e) {
    var a = e.target.closest('.hdr-nav a:not(.hdr-nav-menu), .hero-chip');
    if (!a) return;
    var href = a.getAttribute('href');
    /* Anchor links (#nav-macro etc.) scroll normally; page links navigate via swipe engine */
    if (href && !href.startsWith('#')) {
      e.preventDefault();
      var targetIdx = PAGES.findIndex(function(p) { return p.path === href || p.path.replace('/index.html', '/') === href; });
      if (targetIdx >= 0) navigate(targetIdx);
    }
  });

  /* ── Back / forward button ──────────────────────────── */
  window.addEventListener('popstate', function(e) {
    if (e.state && typeof e.state.page === 'number') navigate(e.state.page, false);
  });

  init();
})();
</script>
