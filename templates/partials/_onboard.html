<!-- ═══ ONBOARDING — welcome bar + opt-in guided tour + translation hint ══════ -->
<!-- Layer 1: dismissible bottom bar (first visit only).                        -->
<!-- Layer 2: spotlight tour, launched only on opt-in or via the header ? pill. -->
<style>
/* ── Layer 1: welcome bar ─────────────────────────────── */
#onb-bar{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(140%);
  z-index:8800;max-width:620px;width:calc(100% - 32px);
  background:var(--card);border:1px solid var(--border);border-left:3px solid var(--gold);
  border-radius:10px;box-shadow:var(--shadow-md);
  padding:16px 18px;display:flex;flex-direction:column;gap:10px;
  transition:transform .45s cubic-bezier(.4,0,.2,1);opacity:0;
  font-family:var(--sans);
}
#onb-bar.show{transform:translateX(-50%) translateY(0);opacity:1}
.onb-bar-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.onb-bar-txt{font-size:14px;color:var(--p);line-height:1.45}
.onb-bar-txt b{color:var(--h);font-weight:700}
.onb-bar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.onb-btn{
  font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;
  padding:8px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--card-alt);color:var(--p);transition:all .15s;white-space:nowrap;
}
.onb-btn:hover{border-color:var(--gold);color:var(--h)}
.onb-btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}
.onb-btn.primary:hover{filter:brightness(1.06);color:#fff}
.onb-x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:18px;
  line-height:1;padding:4px 6px;border-radius:5px}
.onb-x:hover{color:var(--h);background:var(--hover)}
.onb-trans{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);
  border-top:1px dashed var(--border);padding-top:10px;line-height:1.45}
.onb-trans b{color:var(--h)}

/* ── header ? pill (matches ci-pill / thm-pill sizing) ── */
.help-pill{
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  border:1.5px solid var(--border);background:none;color:var(--muted);
  font-family:Georgia,serif;font-weight:700;font-size:14px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
}
.help-pill:hover{border-color:var(--gold);color:var(--gold)}

/* ── Layer 2: spotlight tour ──────────────────────────── */
#onb-hole{
  position:fixed;border-radius:8px;pointer-events:none;z-index:9400;
  box-shadow:0 0 0 9999px rgba(20,15,8,.64);
  transition:all .28s cubic-bezier(.4,0,.2,1);opacity:0;
}
#onb-ov.on #onb-hole{opacity:1}
#onb-ov{position:fixed;inset:0;z-index:9390;display:none}
#onb-ov.on{display:block}
/* Fixed bottom-centre panel — never moves between steps */
#onb-tip{
  position:fixed;z-index:9500;
  bottom:76px;left:50%;transform:translateX(-50%);
  width:calc(100% - 32px);max-width:420px;
  background:var(--card);border:1px solid var(--border);border-top:3px solid var(--gold);
  border-radius:10px;box-shadow:var(--shadow-md);padding:16px 18px;
  font-family:var(--sans);opacity:0;transition:opacity .2s;
}
#onb-ov.on #onb-tip{opacity:1}
.onb-tip-step{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:700}
.onb-tip-title{font-size:16px;font-weight:700;color:var(--h);margin:5px 0 7px;font-family:var(--serif)}
.onb-tip-body{font-size:13.5px;color:var(--p);line-height:1.5}
.onb-tip-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}
.onb-dots{display:flex;gap:5px}
.onb-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.onb-dot.active{background:var(--gold)}
.onb-tip-btns{display:flex;gap:7px}

@media(max-width:560px){
  #onb-tip{bottom:68px}
  #onb-bar{bottom:68px}
  .onb-bar-row{flex-direction:column;align-items:stretch}
  .onb-bar-actions{justify-content:flex-end}
}
</style>

<div id="onb-bar" role="dialog" aria-label="Welcome to SAINHE">
  <div class="onb-bar-row">
    <div class="onb-bar-txt"><b>New to SAINHE?</b> Take a 30-second tour of the dashboard.</div>
    <div class="onb-bar-actions">
      <button class="onb-btn primary" id="onb-start">Quick tour</button>
      <button class="onb-x" id="onb-dismiss" aria-label="Dismiss">&times;</button>
    </div>
  </div>
  <div class="onb-trans" id="onb-trans" style="display:none">
    <span>🌐</span>
    <span><b>This site is in English.</b> Use your browser's <b>Translate</b> (the icon in the address bar, or right-click &rsaquo; Translate) to read it in your language.</span>
  </div>
</div>

<div id="onb-ov" aria-hidden="true">
  <div id="onb-hole"></div>
  <div id="onb-tip" role="dialog" aria-label="Guided tour step">
    <div class="onb-tip-step" id="onb-step"></div>
    <div class="onb-tip-title" id="onb-title"></div>
    <div class="onb-tip-body" id="onb-body"></div>
    <div class="onb-tip-foot">
      <div class="onb-dots" id="onb-dots"></div>
      <div class="onb-tip-btns">
        <button class="onb-btn" id="onb-back">Back</button>
        <button class="onb-btn primary" id="onb-next">Next</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var LS = "sainhe_onboarded";
  var bar = document.getElementById("onb-bar");
  var ov  = document.getElementById("onb-ov");
  var hole= document.getElementById("onb-hole");
  var tip = document.getElementById("onb-tip");
  if(!bar || !ov) return;

  // ── Tour steps — each step accepts a list of selector fallbacks. The first
  //    one that resolves to a VISIBLE element (non-zero box) is used. This way
  //    a step never highlights "nothing" when its primary target is hidden
  //    (e.g. .hdr-nav is display:none on mobile -> fall back to the Menu button).
  var STEPS = [
    {sels:[“#dd-cur”],                                title:”Display currency”,  body:”Switch prices between USD, EUR and HKD here. Everything is stored in USD and converted on the fly.”},
    {sels:[“.ci”,”.bib-wrap”,”.box-info-btn”],       title:”The (i) marks”,     body:”Spot an italic Ⓘ next to a metric? Click it to jump to the Learn page, right at the explanation for that exact signal.”},
    {sels:[“#page-dots”],                             title:”Navigate between pages”, body:”There are 4 pages: Dashboard · Stock Analysis · Learn · Contact.\n\nMobile: swipe left or right anywhere on the page.\nDesktop: press ← → arrow keys, or drag horizontally.\n\nThe gold dot shows where you are — tap any dot to jump directly.”},
    {sels:['a.hero-chip[href=”/learn.html”]','a[href=”/learn.html”]'], title:”Start with Learn”, body:”New to markets? Learn explains every concept on the site in plain language — look for the “read more” links.”},
    {sels:[“#onb-help”],                              title:”Replay anytime”,    body:”Click the ? button up here whenever you want to take this tour again.”}
  ];

  // ── Pick the first selector that resolves to a *visible* element ──────────
  function firstVisible(sels){
    for(var i=0;i<sels.length;i++){
      var nodes = document.querySelectorAll(sels[i]);
      for(var j=0;j<nodes.length;j++){
        var n = nodes[j];
        var r = n.getBoundingClientRect();
        if(r.width > 0 && r.height > 0) return n;
      }
    }
    return null;
  }

  var idx = 0, active = [];

  function isNew(){ try{ return !localStorage.getItem(LS); }catch(e){ return false; } }
  function markSeen(){ try{ localStorage.setItem(LS,"1"); }catch(e){} }

  // ── Layer 1: welcome bar ───────────────────────────────
  function showBar(){
    window.scrollTo({top:0, behavior:"smooth"});
    // contextual translation hint: only if the browser language isn't English
    var lang = (navigator.language || "en").toLowerCase();
    if(lang.indexOf("en") !== 0){ document.getElementById("onb-trans").style.display = "flex"; }
    bar.classList.add("show");
  }
  function hideBar(){ bar.classList.remove("show"); }

  document.getElementById("onb-dismiss").addEventListener("click", function(){ hideBar(); markSeen(); });
  document.getElementById("onb-start").addEventListener("click", function(){ hideBar(); markSeen(); startTour(); });
  var help = document.getElementById("onb-help");
  if(help) help.addEventListener("click", function(){ hideBar(); startTour(); });

  // ── Layer 2: spotlight tour ────────────────────────────
  function startTour(){
    window.scrollTo({top:0, behavior:"instant"});
    // Keep only steps whose target is *visible* in the current viewport/layout.
    active = STEPS.filter(function(s){ return firstVisible(s.sels) !== null; });
    if(!active.length) return;
    idx = 0;
    ov.classList.add("on"); ov.setAttribute("aria-hidden","false");
    renderDots();
    showStep();
    document.addEventListener("keydown", onKey);
  }
  function endTour(){
    ov.classList.remove("on"); ov.setAttribute("aria-hidden","true");
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e){
    if(e.key === "Escape") endTour();
    else if(e.key === "ArrowRight") next();
    else if(e.key === "ArrowLeft") prev();
  }
  function renderDots(){
    var d = document.getElementById("onb-dots"); d.textContent = "";
    active.forEach(function(_,i){
      var dot = document.createElement("span");
      dot.className = "onb-dot" + (i===idx ? " active" : "");
      d.appendChild(dot);
    });
  }
  function showStep(){
    var step = active[idx];
    var el = firstVisible(step.sels);
    // Element became hidden between filter and display (e.g. resize): skip
    if(!el){ next(); return; }
    // Hide the spotlight rectangle while we (re)measure — never highlight (0,0,0,0)
    hole.style.opacity = "0";
    el.scrollIntoView({block:"center", behavior:"smooth"});

    function paint(){
      var r = el.getBoundingClientRect();
      if(r.width <= 0 || r.height <= 0){
        // Target collapsed; skip rather than highlight empty space
        hole.style.opacity = "0"; next(); return;
      }
      var pad = 6;
      hole.style.top    = (r.top - pad) + "px";
      hole.style.left   = (r.left - pad) + "px";
      hole.style.width  = (r.width + pad*2) + "px";
      hole.style.height = (r.height + pad*2) + "px";
      hole.style.opacity = "1";

      document.getElementById("onb-step").textContent = "Step " + (idx+1) + " of " + active.length;
      document.getElementById("onb-title").textContent = step.title;
      document.getElementById("onb-body").textContent  = step.body;
      document.getElementById("onb-back").style.visibility = idx===0 ? "hidden" : "visible";
      document.getElementById("onb-next").textContent = idx===active.length-1 ? "Done" : "Next";
      renderDots();

      // Tooltip is CSS-anchored to bottom-centre — no JS positioning needed.
    }

    // Measure twice: once after smooth-scroll settles, once a tick later for
    // any layout pass (header animation, sticky elements).
    setTimeout(paint, 280);
    setTimeout(paint, 520);
  }
  function next(){ if(idx >= active.length-1){ endTour(); } else { idx++; showStep(); } }
  function prev(){ if(idx > 0){ idx--; showStep(); } }
  document.getElementById("onb-next").addEventListener("click", next);
  document.getElementById("onb-back").addEventListener("click", prev);
  ov.addEventListener("click", function(e){ if(e.target === ov) endTour(); });
  // On resize during the tour: re-filter visible steps (CSS breakpoints may have
  // switched which targets are rendered) and re-paint the current step.
  var _rzt;
  window.addEventListener("resize", function(){
    if(!ov.classList.contains("on")) return;
    clearTimeout(_rzt);
    _rzt = setTimeout(function(){
      var currentTitle = active[idx] && active[idx].title;
      active = STEPS.filter(function(s){ return firstVisible(s.sels) !== null; });
      if(!active.length){ endTour(); return; }
      var newIdx = active.findIndex(function(s){ return s.title === currentTitle; });
      idx = newIdx >= 0 ? newIdx : Math.min(idx, active.length - 1);
      showStep();
    }, 180);
  });

  // ── First-visit trigger: after the intro splash has faded (~1.1s) ──
  if(isNew()){
    setTimeout(showBar, 1100);
  }
})();
</script>
