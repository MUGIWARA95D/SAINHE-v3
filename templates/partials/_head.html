<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ site_name }}</title>
  <meta name="description" content="{{ site_name }} — {{ site_slogan }}. Macro signals, global indices, sector rotation, sentiment.">

  <!-- JSON-LD: machine-readable dataset catalog for AI agents & crawlers -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Dataset",
    "name": "{{ site_name }} financial data",
    "description": "{{ site_slogan }} — macro signals, global indices, sector rotation, sentiment, watchlist scan.",
    "creator": {"@type": "Organization", "name": "{{ site_name }}"},
    "isAccessibleForFree": true,
    "distribution": [
      {"@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "/data/index.json", "name": "Dataset manifest"},
      {"@type": "DataDownload", "encodingFormat": "application/json", "contentUrl": "/data/macro.json", "name": "Macro indicators"}
    ]
  }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>{% raw %}
/* ═══════════════════ DESIGN TOKENS ═══════════════════ */
:root {
  --bg:#F5F0E6;--bg2:#EDE7D9;--card:#FDFAF4;--card-alt:#F3EEE2;
  --border:#DDD5C4;--border-lt:#EBE5D6;--hover:#F0EADC;
  --h:#1C1710;--p:#3B3428;--muted:#8A7E6E;--faint:#B5AA96;
  --gold:#9E7A2E;--gold-bg:#F5ECC8;--gold-border:#D4B86A;
  --green:#2C7A3E;--green-bg:#E4F3E8;--green-border:#8CC99C;
  --red:#A03020;--red-bg:#FAE8E4;--red-border:#D4908A;
  --orange:#B06A18;--orange-bg:#FBF0D8;--orange-border:#D4A86A;
  --yellow:#8A7A10;--yellow-bg:#FAF4D0;
  --shadow:0 1px 4px rgba(80,60,20,.08);--shadow-md:0 4px 16px rgba(80,60,20,.10);
  --r:8px;--serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
}
[data-theme="dark"] {
  --bg:#131110;--bg2:#1C1916;--card:#262018;--card-alt:#322820;
  --border:#423828;--border-lt:#342C22;--hover:#3A3028;
  --h:#F4ECD8;--p:#D0C0A4;--muted:#8E7E6A;--faint:#524438;
  --gold:#D4A840;--gold-bg:#2E2410;--gold-border:#725E28;
  --green:#4AAA60;--green-bg:#162C1A;--green-border:#2E6038;
  --red:#D85048;--red-bg:#2C1816;--red-border:#703028;
  --orange:#DC9238;--orange-bg:#2C2012;--orange-border:#724E20;
  --yellow:#B8A832;--yellow-bg:#2C2A12;
  --shadow:0 1px 4px rgba(0,0,0,.35);--shadow-md:0 4px 20px rgba(0,0,0,.50);
}

/* ═══════════════════ RESET ═══════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--p);font-size:13px;line-height:1.5;
  transition:background .3s,color .3s}
a{color:var(--gold);text-decoration:none}
h1,h2,h3,h4{font-family:var(--serif);color:var(--h);font-weight:400}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ═══════════════════ HEADER ═══════════════════ */
/* Floating pill — page content scrolls underneath it */
#hdr{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;
  width:calc(100% - 32px);max-width:1180px;height:56px;
  padding:0 22px;display:flex;align-items:center;gap:12px;
  background:rgba(253,250,244,.78);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(221,213,196,.6);
  border-radius:999px;
  box-shadow:0 4px 20px rgba(60,40,15,.06),0 1px 3px rgba(60,40,15,.04);
  transition:background .25s,box-shadow .25s,border-color .25s,top .25s,height .25s}
#hdr.scrolled{background:rgba(253,250,244,.92);
  box-shadow:0 8px 28px rgba(60,40,15,.10),0 2px 6px rgba(60,40,15,.06);
  top:10px;height:52px}
[data-theme="dark"] #hdr{background:rgba(22,18,14,.72);border-color:rgba(66,56,40,.6)}
[data-theme="dark"] #hdr.scrolled{background:rgba(22,18,14,.92)}
/* compensate fixed header so the page hero isn't covered */
body{padding-top:84px}
@media(max-width:700px){
  #hdr{width:calc(100% - 18px);height:52px;padding:0 14px;top:10px}
  #hdr.scrolled{top:8px;height:48px}
  body{padding-top:74px}
}
.logo{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--gold);letter-spacing:4px}
.logo-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.hdr-nav{display:flex;gap:4px;position:absolute;left:50%;transform:translateX(-50%)}
@media(max-width:960px){.logo-sub{display:none}}
/* Collapse to "Menu only" as soon as nav links start to crowd / shrink.
 * Was 680px — but at that width links were already deformed, so we move
 * the breakpoint up to keep the pill clean. */
@media(max-width:900px){
  .hdr-nav{position:static;transform:none}
  .hdr-nav-menu{border-right:none;margin-right:0;padding-right:8px!important}
  .hdr-nav a:not(.hdr-nav-menu){display:none}
}
.hdr-nav a{font-size:11.5px;padding:4px 10px;border-radius:4px;color:var(--muted);
  letter-spacing:.3px;transition:all .15s}
.hdr-nav a:hover{color:var(--h);background:var(--hover)}
.hdr-nav a.active{color:var(--gold);font-weight:600;border-bottom:2px dotted var(--gold);padding-bottom:2px}
.spacer{flex:1}
.box-ts{font-size:9.5px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.2px}

/* ══ SCROLL PROGRESS ══════════════════════════════════ */
#scroll-prog{position:fixed;top:0;left:0;height:2px;width:0%;z-index:200;
  background:var(--gold);box-shadow:0 0 6px var(--gold);transition:width .1s linear;
  pointer-events:none}

/* ══ INTRO OVERLAY ════════════════════════════════════ */
#intro-ov{position:fixed;inset:0;z-index:9000;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .9s ease;pointer-events:all}
#intro-ov.hide{opacity:0;pointer-events:none}
#bk-wrap{perspective:1200px}
#bk-scene{width:154px;height:209px;position:relative;transform-style:preserve-3d}
#bk-back{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;gap:8px;
  background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:22px 20px}
.bk-rule{width:80%;height:1px;background:var(--gold-border);opacity:.6}
#bk-logo{font-family:var(--serif);font-size:22px;letter-spacing:3px;color:var(--gold);font-weight:700}
#bk-sub{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
#bk-front{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:left center;
  animation:bk-open 1.2s cubic-bezier(.4,0,.2,1) 1.2s both}
@keyframes bk-open{from{transform:rotateY(0deg)}to{transform:rotateY(-172deg)}}
#bk-face,#bk-face-in{position:absolute;inset:0;backface-visibility:hidden;
  -webkit-backface-visibility:hidden;border-radius:4px}
#bk-face{background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center}
#bk-face-in{background:var(--card-alt);border:1px solid var(--border);transform:rotateY(180deg)}

/* ══ WATERMARK ════════════════════════════════════════ */
#wm{position:fixed;top:12vh;width:110px;opacity:.18;
  pointer-events:none;z-index:0;transform-origin:center center;color:var(--gold);
  right:calc((100vw - 1600px) / 4 - 55px)}
[data-theme="dark"] #wm{opacity:.22}
@media(max-width:1750px){#wm{display:none}}

/* ══ PILL TOGGLE ══════════════════════════════════════ */
.thm-pill{background:var(--card-alt);border:1px solid var(--border);border-radius:20px;
  width:50px;height:24px;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;padding:0 5px;transition:border-color .15s;flex-shrink:0}
.thm-pill:hover{border-color:var(--gold)}
.thm-pill .tp-sun,.thm-pill .tp-moon{font-size:12px;line-height:1;transition:opacity .25s,color .25s}
[data-theme="light"] .thm-pill .tp-sun{color:var(--gold)}
[data-theme="dark"]  .thm-pill .tp-moon{color:var(--gold)}

/* ══ CUSTOM DROPDOWNS ════════════════════════════════ */
.hdr-dd{position:relative;flex-shrink:0}
.hdr-dd-btn{font-family:var(--serif);font-size:11px;letter-spacing:.3px;
  background:var(--card-alt);color:var(--p);border:1px solid var(--border);
  border-radius:4px;padding:3px 8px;cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:all .15s;white-space:nowrap}
.hdr-dd-btn:hover,.hdr-dd.open .hdr-dd-btn{border-color:var(--gold);color:var(--gold)}
.hdr-dd-btn::after{content:"▾";font-size:9px;opacity:.55;transition:transform .15s;font-family:var(--sans)}

.hdr-dd.open .hdr-dd-btn::after{transform:rotate(180deg)}
.hdr-dd-menu{position:absolute;top:calc(100% + 4px);right:0;min-width:72px;
  background:var(--card);border:1px solid var(--border);border-radius:6px;
  box-shadow:var(--shadow-md);z-index:500;overflow:hidden;
  display:none;flex-direction:column}
.hdr-dd.open .hdr-dd-menu{display:flex}
.hdr-dd-item{font-size:11px;padding:6px 12px;cursor:pointer;color:var(--p);
  font-family:var(--serif);letter-spacing:.3px;transition:background .1s;white-space:nowrap}
.hdr-dd-item:hover{background:var(--hover);color:var(--gold)}
.hdr-dd-item.active{color:var(--gold);border-left:2px solid var(--gold);padding-left:10px}

/* ═══════════════════ TICKER BAR ═══════════════════ */
#ticker{background:var(--h);height:30px;overflow:hidden;display:flex;align-items:center;position:relative;z-index:1;transform:translateZ(0);-webkit-transform:translateZ(0)}
[data-theme="dark"] #ticker{background:#1E1A14}
.tk-scroll{display:flex;animation:tkscroll 50s linear infinite;white-space:nowrap;will-change:transform;-webkit-backface-visibility:hidden;backface-visibility:hidden}
@media(hover:hover){#ticker:hover .tk-scroll{animation-play-state:paused}}
@keyframes tkscroll{from{transform:translateX(0) translateZ(0)}to{transform:translateX(-50%) translateZ(0)}}
.tk-item{display:inline-flex;align-items:center;gap:6px;padding:0 16px;font-size:11px;
  border-right:1px solid rgba(255,255,255,.08);height:30px;color:#F5F0E6}
[data-theme="dark"] .tk-item{color:var(--p)}
.tk-name{color:rgba(255,255,255,.4);font-size:10px;letter-spacing:.5px}
[data-theme="dark"] .tk-name{color:var(--muted)}
.tk-up{color:#7CC98A}.tk-dn{color:#E08080}

/* ═══════════════════ MAIN ═══════════════════ */
#main{padding:40px 60px;max-width:1600px;margin:0 auto;position:relative;z-index:1}
@media(max-width:1100px){#main{padding:32px 40px}}
@media(max-width:800px){#main{padding:20px 20px}}

/* ═══════════════════ CARD ═══════════════════ */
.card{background:var(--card);border:1px solid var(--border-lt);border-radius:20px;
  box-shadow:var(--shadow);transition:background .3s,border .3s,box-shadow .25s ease;margin-bottom:0;
  position:relative;
  /* anchor jumps land below the fixed pill header instead of behind it */
  scroll-margin-top:96px}
@media(max-width:700px){.card{scroll-margin-top:78px}}
.card:hover{box-shadow:var(--shadow-md)}
.card-h{display:flex;align-items:center;justify-content:space-between;
  padding:22px 28px;border-bottom:1px solid var(--border-lt)}
.card-t{font-family:var(--serif);font-size:15px;color:var(--h);letter-spacing:.1px}
.badge{font-size:9px;padding:2px 7px;border-radius:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.badge-gold{background:var(--gold-bg);color:var(--gold)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-green{background:var(--green-bg);color:var(--green)}

/* ═══════════════════ BOX_01 — NEWS ═══════════════════ */
#box-news{display:flex;flex-direction:column;height:520px}
#box-news .card-h{flex-shrink:0}
#box-news .tabs{flex-shrink:0}
#news-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.news-item{padding:10px 14px;border-bottom:1px solid var(--border-lt);transition:background .12s}
.news-item:last-child{border-bottom:none}
.news-item:hover{background:var(--hover)}
.news-anchor{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;color:var(--gold);
  background:var(--gold-bg);padding:2px 6px;border-radius:3px;display:inline-block;
  margin-bottom:4px;letter-spacing:.3px}
.news-meta{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.news-time{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.news-zone{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600;letter-spacing:.3px}
.zone-global{background:#F0EDE0;color:#6A5A30}
.zone-usa{background:#E8E4F4;color:#5A4A8A}
.zone-eu{background:#E0ECF4;color:#3A6A8A}
.zone-as{background:#F4E8E0;color:#8A5A3A}
[data-theme="dark"] .zone-global{background:#302C18;color:#B8A870}
[data-theme="dark"] .zone-usa{background:#282448;color:#A898D0}
[data-theme="dark"] .zone-eu{background:#182834;color:#82B0C8}
[data-theme="dark"] .zone-as{background:#362818;color:#C8A880}
.news-hl{font-size:15px;color:var(--h);line-height:1.4;font-family:var(--serif)}
a.news-hl{text-decoration:none;display:block}
a.news-hl:hover{color:var(--gold)}
.news-body{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-item:hover .news-body{-webkit-line-clamp:unset;overflow:visible}
.news-readmore{font-size:10px;color:var(--gold);margin-top:3px;display:none;text-decoration:none}
.news-readmore:hover{text-decoration:underline}
.news-item:hover .news-readmore{display:inline}

/* ═══════════════════ BOX — INDICES ══════════════════════ */
#box-indices table{width:100%;border-collapse:collapse;font-size:12px}
#box-indices th{text-align:left;padding:6px 10px;color:var(--muted);font-weight:500;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
#box-indices td{padding:7px 10px;border-bottom:1px solid var(--border-lt);vertical-align:middle}
#box-indices tr:hover td{background:var(--hover)}
.idx-spark{width:56px;height:22px}
.range-bar{width:80px;height:4px;background:var(--border);border-radius:2px;
  position:relative;display:inline-block;vertical-align:middle}
.range-dot{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;
  background:var(--gold);border:1.5px solid var(--card)}
.rvol-hot{font-weight:700;color:var(--gold)}
.idx-cur-badge{font-size:8.5px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted);background:var(--bg2);border:1px solid var(--border-lt);
  border-radius:3px;padding:0 4px;margin-left:4px;vertical-align:middle;font-family:var(--sans)}
.smb{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px;white-space:nowrap}
.smb-acc{background:var(--green-bg);color:var(--green)}
.smb-dist{background:var(--red-bg);color:var(--red)}
.smb-weak{background:var(--orange-bg);color:var(--orange)}
.smb-thin{background:var(--card-alt);color:var(--muted)}
.smb-neut{background:var(--card-alt);color:var(--muted)}
.sent-hub{display:flex;gap:20px;padding:8px 14px;border-top:1px solid var(--border-lt);
  font-size:11px;color:var(--muted)}
.sent-hub strong{color:var(--h);font-weight:600}


/* ═══════════════════ BOX — SECTORS ══════════════════════ */
#box-sectors{display:flex;flex-direction:column;height:500px}
#box-sectors .card-h{flex-shrink:0}
.tabs{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border-lt);flex-shrink:0}
.tab{flex:1;text-align:center;padding:11px 6px;font-size:11.5px;font-weight:500;color:var(--muted);
  background:var(--card-alt);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s ease}
.tab:hover{background:var(--hover);border-color:var(--gold-border);color:var(--h);transform:translateY(-1px)}
.tab.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);font-weight:600}
.ptabs{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border-lt);flex-shrink:0}
.ptab{flex:1;text-align:center;padding:9px 4px;font-size:10.5px;font-weight:500;color:var(--muted);
  background:var(--card-alt);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s ease}
.ptab:hover{background:var(--hover);border-color:var(--gold-border);color:var(--h);transform:translateY(-1px)}
.ptab.active{background:var(--gold-bg);border-color:var(--gold-border);color:var(--gold);font-weight:600}
#sec-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.sec-hdr{display:flex;align-items:center;gap:14px;padding:6px 16px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.sec-hdr-name{flex:1;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sec-hdr-spark{width:92px;font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);
  flex-shrink:0;text-align:center}
.sec-hdr-score{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  flex-shrink:0;min-width:62px;text-align:center}
.sec-hdr-perf{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  flex-shrink:0;min-width:72px;text-align:right}
.sec-row{display:flex;align-items:center;gap:14px;padding:11px 16px;
  border-bottom:1px solid var(--border-lt);transition:background .12s}
.sec-row:hover{background:var(--hover)}
.sec-row.sec-missing{opacity:.35}
.sec-row.golden-alpha{border-left:3px solid var(--gold-border);
  background:linear-gradient(90deg,var(--gold-bg) 0%,var(--card) 70%)}
.sec-name{flex:1;font-size:12px;color:var(--h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-spark{width:92px;height:28px;flex-shrink:0}
.sec-score{font-size:10px;font-weight:600;flex-shrink:0;min-width:62px;text-align:center;
  padding:2px 8px;border-radius:4px}
.sec-score-pos{background:var(--green-bg);color:var(--green)}
.sec-score-neg{background:var(--red-bg);color:var(--red)}
.sec-score-neu{background:var(--border-lt);color:var(--muted)}
.sec-perf{font-size:13px;font-weight:700;flex-shrink:0;min-width:72px;text-align:right}
.p-up{color:var(--green)}.p-dn{color:var(--red)}.p-flat{color:var(--muted)}

/* ═══════════════════ BOX_04 — SENTIMENT CARDS ═══════════════════ */
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;padding:12px 14px}
.sc{background:var(--card-alt);border:1px solid var(--border-lt);border-radius:6px;
  padding:12px;transition:all .15s}
.sc:hover{border-color:var(--gold-border);box-shadow:var(--shadow)}
.sc-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sc-name{font-family:var(--serif);font-size:13px;color:var(--h)}
.sc-score{font-size:12px;font-weight:700}
.gauge{width:100%;height:5px;background:var(--border);border-radius:3px;margin-bottom:8px;position:relative}
.gauge-fill{height:100%;border-radius:3px;transition:width .4s}
.gauge-dot{position:absolute;top:-3px;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--card);transition:left .4s}
.laws{margin-bottom:8px}
.law{display:flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 0;color:var(--muted)}
.law-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px}
.law-g{background:var(--green-bg);color:var(--green)}
.law-r{background:var(--red-bg);color:var(--red)}
.law-y{background:var(--yellow-bg);color:var(--yellow)}
.consensus{font-size:10.5px;color:var(--muted);border-top:1px solid var(--border-lt);padding-top:6px}
.consensus strong{color:var(--h)}
.sc-foot{font-size:9.5px;color:var(--faint);margin-top:6px;padding-top:4px;
  border-top:1px solid var(--border-lt)}
/* — info tooltip wrapper (right side of sc-hdr) — */
.sc-info{position:relative;display:inline-flex;align-items:center;gap:5px}
.sc-info-btn{display:inline-flex;align-items:center;justify-content:center;
  font-style:italic;font-weight:700;font-family:Georgia,serif;font-size:9px;
  width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(158,122,46,.45);
  color:rgba(158,122,46,.65);cursor:pointer;vertical-align:middle;margin-left:2px;
  opacity:0;transition:color .15s,border-color .15s,background .15s,opacity .15s;
  flex-shrink:0;line-height:1}
.sc:hover .sc-info-btn{opacity:1}
.sc-info:hover .sc-info-btn{opacity:1;color:var(--gold);border-color:var(--gold);background:var(--gold-bg)}
.sc-tip{visibility:hidden;opacity:0;pointer-events:none;
  position:absolute;bottom:calc(100% + 8px);right:0;z-index:300;
  background:var(--card);border:1px solid var(--border-lt);border-radius:7px;
  padding:9px 11px;min-width:200px;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
  transition:opacity .15s,visibility .15s}
.sc-info:hover .sc-tip{visibility:visible;opacity:1}
.sc-tip-title{font-size:9px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);margin-bottom:6px}
.sc-tip-row{display:flex;justify-content:space-between;align-items:center;
  gap:12px;font-size:10px;color:var(--p);padding:1.5px 0}
.sc-tip-row span:first-child{color:var(--h);font-weight:600}
.sc-tip-div{border-top:1px solid var(--border-lt);margin:5px 0}
.sc-tip-formula{font-size:9.5px;color:var(--muted);line-height:1.5}
.sc-tip-formula b{color:var(--p)}

/* ── Sentiment legend bar ─────────────────────────────── */
.sc-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;
  padding:7px 12px;margin:0 0 14px;
  background:var(--bg2);border:1px solid var(--border-lt);border-radius:6px;
  font-size:10px;color:var(--muted)}
.sc-legend-scale{display:flex;align-items:center;gap:5px;flex-shrink:0}
.sc-legend-track{width:48px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,var(--red),var(--gold) 50%,var(--green))}
.sc-legend-chips{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap}
.sc-legend-chip{display:flex;align-items:center;gap:4px;white-space:nowrap}
.sc-legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sc-legend-formula{font-size:9.5px;font-style:italic;color:var(--faint);
  margin-left:auto;white-space:nowrap}
.sc-legend-link{font-size:10px;font-weight:600;color:var(--gold);white-space:nowrap;
  text-decoration:none;flex-shrink:0}
.sc-legend-link:hover{text-decoration:underline}
/* ═══════════════════ BOX_05 — MACRO ═══════════════════ */
.macro-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 14px}
@media(max-width:700px){.macro-grid{grid-template-columns:1fr}}
.mc{background:var(--card-alt);border:1px solid var(--border-lt);border-radius:6px;padding:16px}
.mc-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:4px;
  display:flex;align-items:center;justify-content:space-between}
.mc-val{font-family:var(--serif);font-size:28px;color:var(--h);font-weight:700;margin-bottom:2px}
.mc-sub{font-size:11px;color:var(--muted);line-height:1.5}
.mc-sig{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;margin-top:8px}

.sig{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px}
.sig-buy{background:var(--green-bg);color:var(--green)}
.sig-avoid{background:var(--red-bg);color:var(--red)}
.sig-watch{background:var(--yellow-bg);color:var(--yellow)}
.sig-na{background:var(--card-alt);color:var(--muted)}
.evidence{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;color:var(--muted)}

/* ══════════════════════════════════════════════════════════════ */
/* ═══  TERMINAL-INSPIRED LAYER — cream & coffee cinematic    ═══ */
/* ══════════════════════════════════════════════════════════════ */

/* Extended palette — espresso / caramel / ivoire */
:root{
  --espresso:#2C1A0E;--espresso-2:#3A2416;--coffee:#5A3A24;
  --caramel:#8B5E3C;--tan:#B98A5F;--cream:#F5F0E6;
  --ivoire:#FBF7EC;--parchment:#F9F4E6;
  --gold-warm:#C4955A;--gold-deep:#9E7A2E;
}
[data-theme="dark"]{
  --espresso:#120C08;--espresso-2:#1C1410;--coffee:#2C2016;
  --caramel:#7A5232;--tan:#A07A52;--cream:#1C1610;
  --ivoire:#22201A;--parchment:#2A2420;
  --gold-warm:#D4A840;--gold-deep:#A88030;
}

/* ══════ HERO ══════════════════════════════════════════════════ */
.hero{position:relative;margin:20px 0 28px;padding:54px 44px 48px;
  background:linear-gradient(135deg,#F0C8A0 0%,#FFE5CC 100%);
  border-radius:14px;overflow:hidden;color:#3A1E08;
  box-shadow:0 20px 60px -20px rgba(180,100,40,.22);
  scroll-margin-top:60px}
[data-theme="dark"] .hero{background:linear-gradient(135deg,#2E1A0C 0%,#4A2A14 100%)}
.hero-grid{position:absolute;inset:0;opacity:.07;pointer-events:none;
  background-image:
    linear-gradient(rgba(210,230,160,.5) 1px,transparent 1px),
    linear-gradient(90deg,rgba(210,230,160,.5) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 70% 30%,#000 40%,transparent 80%)}
.hero-inner{position:relative;max-width:760px;margin:0 auto;text-align:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:10.5px;
  letter-spacing:2px;text-transform:uppercase;color:#9E5A28;
  background:rgba(180,100,40,.10);border:1px solid rgba(180,100,40,.28);
  padding:6px 14px;border-radius:999px;margin-bottom:24px;font-variant-numeric:tabular-nums}
.hero-dot{width:6px;height:6px;border-radius:50%;background:#C07840;
  box-shadow:0 0 10px rgba(192,120,64,.55);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.hero-title{font-family:var(--serif);font-size:clamp(34px,5.2vw,62px);line-height:1.04;
  font-weight:400;color:#2A1008;letter-spacing:-.01em;margin:0 0 22px}
.hero-title em{color:#9E5A28;font-style:italic;font-weight:400}
.hero-lede{font-size:15px;line-height:1.65;color:rgba(60,28,8,.68);
  max-width:640px;margin:0 0 32px}
.hero-chips{display:flex;gap:10px;width:100%}
.hero-chip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 8px;border-radius:10px;
  background:rgba(180,100,40,.10);border:1px solid rgba(180,100,40,.28);
  color:#5A2E10;font-size:12px;letter-spacing:.3px;
  transition:all .2s ease;text-align:center}
.hero-chip:hover{background:rgba(180,100,40,.20);border-color:#C07840;
  transform:translateY(-2px);color:#2A1008;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.hero-chip span{font-family:var(--serif);font-size:10.5px;color:#9E5A28;
  background:rgba(180,100,40,.14);padding:2px 7px;border-radius:999px;
  font-variant-numeric:tabular-nums;letter-spacing:.5px}
@media(max-width:720px){.hero{padding:36px 22px 32px;margin:14px 0 22px}
  .hero-lede{font-size:13.5px;margin-bottom:22px}}

/* ══════ STATEMENT BAR ════════════════════════════════════════ */
.statement-bar{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding:22px 28px;margin:0 0 6px;
  background:var(--parchment);border:1px solid var(--border-lt);
  border-left:3px solid var(--gold-warm);border-radius:8px}
.sb-label{font-family:var(--serif);font-size:13px;color:var(--gold-deep);
  letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.sb-body{font-family:var(--serif);font-style:italic;font-size:17px;
  color:var(--espresso);line-height:1.4;flex:1;min-width:280px}
[data-theme="dark"] .sb-body{color:var(--h)}

/* ══════ SECTION LABELS — numbered ════════════════════════════ */
/* The label is BOTH the visual gap between two boxes AND the anchor target.
 * scroll-margin-top is intentionally small (8) so that on anchor jumps the
 * top of the label sits right under the pill — its own padding-top fills
 * the visible gap below the pill, hiding any tail of the previous box.
 * padding-top is generous so the gap stays airy and the previous box slides
 * fully behind the pill on click. */
.section-lbl{padding:128px 0 40px;display:flex;align-items:center;gap:18px;
  scroll-margin-top:8px;position:relative}
.section-lbl::before{content:"";position:absolute;top:64px;left:0;right:0;height:1px;
  background:linear-gradient(90deg,var(--border) 0%,transparent 55%)}
.section-lbl:first-of-type{padding-top:80px}
@media(max-width:900px){
  .section-lbl{padding:96px 0 32px;scroll-margin-top:8px}
  .section-lbl::before{top:48px}
  .section-lbl:first-of-type{padding-top:56px}
}
.section-lbl:first-of-type::before{display:none}
.section-num{font-family:var(--serif);font-size:11px;font-variant-numeric:tabular-nums;
  color:var(--gold-deep);background:var(--gold-bg);
  padding:5px 12px;border-radius:999px;letter-spacing:1.5px;font-weight:600;
  border:1px solid var(--gold-border);position:relative;z-index:1;flex-shrink:0}
.section-lbl h2{font-family:var(--serif);font-size:clamp(26px,3vw,38px);
  color:var(--h);font-weight:400;letter-spacing:-.01em;line-height:1}
.section-lbl em{font-style:italic;font-size:13px;color:var(--muted);
  letter-spacing:.3px;text-transform:none;font-family:var(--serif)}

/* ══════ PIPELINE STRIP ═══════════════════════════════════════ */
.pipeline{display:flex;align-items:center;justify-content:center;gap:12px;
  margin:48px 0 10px;padding:16px 20px;flex-wrap:wrap;
  font-family:var(--serif);font-size:11.5px;color:var(--muted);
  letter-spacing:2px;text-transform:uppercase;
  border-top:1px solid var(--border-lt);border-bottom:1px solid var(--border-lt)}
.pipeline span:first-child{color:var(--gold-deep);font-weight:600}
.pl-dot{width:4px;height:4px;border-radius:50%;background:var(--gold-warm)}
.pl-arr{color:var(--faint);font-family:var(--sans);font-size:10px}

/* ══════ SHELL PLACEHOLDER (empty-page sections) ══════════════ */
.shell-placeholder{
  padding:48px 32px;border-radius:14px;
  background:var(--card);border:1px dashed var(--border-lt);
  text-align:center;color:var(--muted);font-style:italic;
  font-family:var(--serif);font-size:14px;line-height:1.7;
  margin:0 0 8px}
.sec-choc .shell-placeholder{
  background:rgba(255,255,255,.06);border-color:rgba(196,149,90,.25);
  color:rgba(245,232,208,.55)}

/* ══════ STALENESS INDICATOR ══════════════════════════════════ */
.ts-wrap{display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.ts-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;display:inline-block}
.ts-age{font-size:9px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
/* fresh  < 6h  */ .ts-fresh .ts-dot{background:#2C7A3E} .ts-fresh .ts-age{color:#2C7A3E}
/* ok     6-30h */ .ts-ok    .ts-dot{background:#B06A18} .ts-ok    .ts-age{color:#B06A18}
/* stale  30-72h*/ .ts-stale .ts-dot{background:#A03020} .ts-stale .ts-age{color:#A03020}
/* old    >72h  */ .ts-old   .ts-dot{background:#7A0A18;box-shadow:0 0 4px rgba(160,30,20,.5)} .ts-old .ts-age{color:#A03020;font-weight:700}
/* unknwn        */ .ts-unk  .ts-dot{background:var(--faint)} .ts-unk .ts-age{color:var(--faint)}

/* ══════ FLOATING NAV PILL (refined) ══════════════════════════ */
.hdr-nav a.active{background:var(--gold-bg);border-bottom:none;padding:4px 10px;border-radius:4px}

.hdr-nav-menu{font-weight:600;color:var(--gold)!important;letter-spacing:.5px;border-right:1px solid var(--border-lt);margin-right:4px;padding-right:14px!important}
.hdr-nav-menu::after{content:" ↑";font-size:9px;opacity:.6}
.hero-chip-active{background:rgba(180,100,40,.22)!important;border-color:#C07840!important;
  color:#2A1008!important}

/* ══════ FOOTER upgrade ═══════════════════════════════════════ */
#foot{padding:22px 20px 32px;font-size:11px;letter-spacing:.5px;
  font-family:var(--serif);color:var(--muted);border-top:none}

/* ══════════════════════════════════════════════════════════════ */
/* ═══  ALTERNATING BANDS — chocolat au lait / crème          ═══ */
/* ══════════════════════════════════════════════════════════════ */

/* Band base */
.sec-band{ margin:0; padding:0; scroll-margin-top:96px; position:relative; }
@media(max-width:700px){.sec-band{scroll-margin-top:78px}}

/* ── CHOCOLAT AU LAIT — rectangle flottant, cards claires à l'intérieur ── */
.sec-choc{
  background:#3E200C;
  border-radius:20px;
  padding:0 44px 52px;
  box-shadow:0 20px 60px -20px rgba(40,20,8,.45);
  overflow:hidden;
  margin-bottom:52px;
}
[data-theme="dark"] .sec-choc{ background:#1E1208; }

/* Seul le section-label (sur fond sombre) prend des couleurs claires */
.sec-choc .section-lbl h2   { color:#F5E8D0 }
.sec-choc .section-lbl em   { color:#A87850 }
.sec-choc .section-num      { background:rgba(196,149,90,.18);border-color:rgba(196,149,90,.38);color:#C4955A }
.sec-choc .section-lbl::before{ background:linear-gradient(90deg,rgba(196,149,90,.25) 0%,transparent 55%) }

/* ── CRÈME — rectangle café clair ────────────────────────── */
.sec-creme{
  background:#EDD9BB;
  border-radius:20px;
  padding:0 44px 52px;
  box-shadow:0 8px 32px -12px rgba(120,70,20,.18);
  margin-bottom:52px;
}
[data-theme="dark"] .sec-creme{ background:#28201A; }

/* Statement bar — contenu, coins arrondis */
.statement-bar{ border-radius:14px; padding:22px 28px; margin:0 0 40px }

/* Pipeline — simple */
.pipeline{ padding:20px 0; margin:16px 0 0 }

/* (SortableJS removed — sector order is fixed) */

/* ═══════════════════════════════════════════════════════════ */
/* ══════ DARK MODE — contrast fixes ══════ */
[data-theme="dark"] .hero-eyebrow{color:#C4955A;background:rgba(196,149,90,.12);border-color:rgba(196,149,90,.30)}
[data-theme="dark"] .hero-title{color:#F5ECD8}
[data-theme="dark"] .hero-title em{color:#D4A840}
[data-theme="dark"] .hero-lede{color:rgba(240,218,178,.80)}
[data-theme="dark"] .hero-chip{color:rgba(230,210,170,.88);background:rgba(196,149,90,.12);border-color:rgba(196,149,90,.30)}
[data-theme="dark"] .hero-chip span{color:#D4A840;background:rgba(196,149,90,.16)}
[data-theme="dark"] .hero-chip:hover{color:#F5ECD8;background:rgba(196,149,90,.22);border-color:#D4A840}
[data-theme="dark"] .hero-chip-active{color:#F5ECD8!important;background:rgba(180,100,40,.35)!important;border-color:#D4A840!important}
[data-theme="dark"] .sec-creme .lrn-panel-row{border-color:rgba(196,149,90,.18)}
[data-theme="dark"] .sec-creme .lrn-panel-row-lbl{background:rgba(196,149,90,.10);border-right-color:rgba(196,149,90,.15);color:rgba(196,149,90,.75)}
[data-theme="dark"] .sec-creme .lrn-panel-row-val{color:rgba(205,188,158,.82)}
[data-theme="dark"] .sec-creme .lrn-panel-row-val strong{color:#EEE0C4}
[data-theme="dark"] .ts-fresh .ts-dot{background:var(--green)}
[data-theme="dark"] .ts-fresh .ts-age{color:var(--green)}
[data-theme="dark"] .ts-ok .ts-dot{background:var(--orange)}
[data-theme="dark"] .ts-ok .ts-age{color:var(--orange)}
[data-theme="dark"] .ts-stale .ts-dot{background:var(--red)}
[data-theme="dark"] .ts-stale .ts-age{color:var(--red)}
[data-theme="dark"] .ts-old .ts-dot{background:var(--red);box-shadow:0 0 4px rgba(216,80,72,.5)}
[data-theme="dark"] .ts-old .ts-age{color:var(--red);font-weight:700}

/* ══  MOBILE — 680px                                       ══ */
/* ═══════════════════════════════════════════════════════════ */
@media(max-width:680px){

  /* Header */
  #hdr{padding:0 12px;gap:8px}
  .logo{font-size:15px;letter-spacing:2px}
  .hdr-nav{position:static;transform:none}
  .hdr-nav-menu{border-right:none;margin-right:0;padding-right:8px!important}
  .hdr-nav a:not(.hdr-nav-menu){display:none}
  /* book intro: shift right so cover has room to swing left */
  #bk-wrap{transform:translateX(77px)}
  .hdr-dd-btn{font-size:10px;padding:2px 6px}

  /* Main padding */
  #main{padding:12px 12px}

  /* Hero */
  .hero{padding:28px 18px 24px;margin:10px 0 18px;border-radius:10px}
  .hero-eyebrow{font-size:9px;padding:4px 10px;margin-bottom:16px}
  .hero-lede{font-size:13px;margin-bottom:20px}
  .hero-chips{gap:6px;flex-wrap:wrap}
  .hero-chip{flex:0 0 calc(50% - 3px);padding:10px 6px;font-size:11px}

  /* Statement bar */
  .statement-bar{padding:14px 16px;border-radius:8px}
  .sb-body{font-size:14px}

  /* Bands — le gros problème : 44px → 14px */
  .sec-choc,.sec-creme{padding:0 14px 28px;border-radius:12px;margin-bottom:28px}

  /* Section labels — top:44px keeps h2 below the ::before line (top:32px);
     right:40px clears the ⓘ button (22px wide at right:20px) */
  .section-lbl{padding:44px 40px 14px 0}
  .section-lbl h2{font-size:22px}
  .section-lbl em{font-size:11px}
  .section-num{font-size:10px;padding:4px 10px}

  /* [1] Cards — titre + badge wrappent si trop long */
  .card-h{padding:14px 16px;flex-wrap:wrap;gap:6px}
  .card-t{font-size:13px}
  .box-ts{font-size:9px}

  /* [2] Tables — scroll horizontal; min-width réduit */
  #box-indices,#box-portfolio{overflow-x:auto;-webkit-overflow-scrolling:touch}
  #box-indices table{min-width:460px;font-size:11px}
  #box-portfolio table{min-width:520px;font-size:11px}
  /* quand les deux groupes sont repliés (état par défaut) : 7 cols → 380px suffit */
  #pt-table.pt-ret-collapsed.pt-sig-collapsed{min-width:380px}
  #box-indices th,#box-indices td,#box-portfolio th,#box-portfolio td{padding:5px 7px}

  /* [3] Box news & sectors hauteur réduite — macro laissé auto (4 cards empilées = 520px) */
  #box-news,#box-sectors{height:380px}
  #box-macro{height:auto}

  /* Sector grid — 1 colonne */
  .sector-grid{grid-template-columns:1fr;padding:8px 10px}

  /* Macro grid — déjà 1 col à 700px, juste padding */
  .macro-grid{padding:8px 10px}
  .mc-val{font-size:24px!important}

  /* [4] Tabs — scroll horizontal propre, cibles tactiles 36px */
  .tabs,.ptabs{overflow-x:auto;-webkit-overflow-scrolling:touch;
    flex-wrap:nowrap;gap:4px;padding-bottom:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar,.ptabs::-webkit-scrollbar{display:none}
  .tab,.ptab{min-height:36px;white-space:nowrap;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center}

  /* [5] Portfolio Pulse — 4 cols serrées → 2×2 grid */
  #pt-pulse{flex-wrap:wrap}
  .pt-pulse-col{flex:0 0 50%;min-width:0;
    border-right:none;border-bottom:1px solid var(--border-lt)}
  .pt-pulse-col:nth-child(odd){border-right:1px solid var(--border-lt)}
  .pt-pulse-col:nth-child(3),.pt-pulse-col:nth-child(4){border-bottom:none}

  /* Pipeline */
  .pipeline{font-size:10px;gap:6px;padding:14px 0;letter-spacing:1px}

  /* Footer */
  #foot{padding:16px 12px 24px;font-size:10px}

  /* Ticker */
  #ticker{height:26px}
  .tk-item{font-size:10px;padding:0 10px}
}

/* ══  TRÈS PETIT — 380px  (Galaxy S, SE…)  ════════════════ */
@media(max-width:380px){
  .hdr-nav{display:none}  /* nav cachée, accès via chips hero */
  .hero-chips{flex-wrap:wrap}
  .hero-chip{flex:0 0 calc(50% - 4px);padding:10px 4px;font-size:10.5px}
  .sec-choc,.sec-creme{padding:0 10px 20px}
  #main{padding:8px 8px}
}

/* ══════════════════════════════════════════════════════════════ */
/* ═══  LEARN PAGE — educational layout                       ═══ */
/* ══════════════════════════════════════════════════════════════ */

/* 2-column layout: sticky TOC + scrollable body */
.lrn-wrap{display:flex;gap:44px;align-items:flex-start}
.lrn-toc{width:172px;flex-shrink:0;position:sticky;top:72px;padding:24px 0;
  display:flex;flex-direction:column;gap:0}
.lrn-toc-label{font-size:9px;text-transform:uppercase;letter-spacing:1.8px;
  color:rgba(196,149,90,.5);margin-bottom:16px;font-weight:600;padding-left:2px}
.lrn-toc-link{display:flex;align-items:center;gap:9px;
  padding:10px 13px;border-radius:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(196,149,90,.18);
  color:rgba(245,232,208,.5);font-size:11.5px;letter-spacing:.2px;
  text-decoration:none;transition:all .2s ease;margin-bottom:9px}
.lrn-toc-link:last-child{margin-bottom:0}
.lrn-toc-link:hover{background:rgba(196,149,90,.14);border-color:rgba(196,149,90,.45);
  color:rgba(245,232,208,.9);transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(0,0,0,.25)}
.lrn-toc-link.active{background:rgba(196,149,90,.2);border-color:rgba(196,149,90,.6);
  color:#C4955A;font-weight:600}
.lrn-toc-num{font-family:var(--serif);font-size:9.5px;font-variant-numeric:tabular-nums;
  color:#C4955A;opacity:.8;flex-shrink:0;letter-spacing:.5px}
.lrn-body{flex:1;min-width:0;padding:0}

/* Section blocks inside learn */
.lrn-block{margin-bottom:48px}
.lrn-block:last-child{margin-bottom:0}
.lrn-block-hdr{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;padding-bottom:10px;
  border-bottom:1px solid rgba(196,149,90,.18)}
.lrn-block-hdr h3{font-family:var(--serif);font-size:18px;font-weight:400;
  color:#F5E8D0;letter-spacing:.05em}
.lrn-block-hdr em{font-style:normal;font-size:10.5px;color:rgba(196,149,90,.65);
  text-transform:uppercase;letter-spacing:1px}

/* 3×2 grid of dashboard box cards */
.lrn-grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:0}
@media(max-width:900px){.lrn-grid6{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.lrn-grid6{grid-template-columns:1fr}}
.lrn-card{background:rgba(255,255,255,.06);border:1px solid rgba(196,149,90,.2);
  border-radius:12px;padding:18px 16px;transition:all .2s ease;
  display:flex;flex-direction:column;gap:8px}
.lrn-card:hover{background:rgba(255,255,255,.10);border-color:rgba(196,149,90,.45);
  transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.28)}
.lrn-card-num{font-family:var(--serif);font-size:10px;font-variant-numeric:tabular-nums;
  color:#C4955A;background:rgba(196,149,90,.15);padding:2px 8px;border-radius:999px;
  letter-spacing:1.5px;font-weight:600;align-self:flex-start;
  border:1px solid rgba(196,149,90,.3)}
.lrn-card-title{font-family:var(--serif);font-size:14px;color:#F5E8D0;
  font-weight:400;line-height:1.2}
.lrn-card-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;
  font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 6px;border-radius:3px;align-self:flex-start}
.lrn-card-badge-live{background:rgba(160,48,32,.25);color:#E08080}
.lrn-card-badge-gold{background:rgba(196,149,90,.18);color:#C4955A}
.lrn-card-badge-green{background:rgba(44,122,62,.2);color:#7CC98A}
.lrn-card-desc{font-size:11.5px;color:rgba(245,232,208,.5);line-height:1.55;
  font-family:var(--sans)}

/* Metrics explained */
.lrn-metric{display:grid;grid-template-columns:120px 1fr;gap:0;
  border:1px solid rgba(196,149,90,.18);border-radius:10px;overflow:hidden;
  margin-bottom:12px}
.lrn-metric:last-child{margin-bottom:0}
.lrn-metric-label{padding:16px 14px;background:rgba(196,149,90,.09);
  border-right:1px solid rgba(196,149,90,.18);display:flex;flex-direction:column;
  gap:6px;justify-content:center}
.lrn-metric-name{font-family:var(--serif);font-size:14px;color:#F5E8D0;font-weight:400}
.lrn-metric-tag{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;
  color:#C4955A}
.lrn-metric-body{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.lrn-metric-formula{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;
  color:#C4955A;background:rgba(196,149,90,.1);padding:4px 10px;border-radius:4px;
  display:inline-block;align-self:flex-start;letter-spacing:.3px}
.lrn-metric-desc{font-size:11.5px;color:rgba(245,232,208,.55);line-height:1.6}
.lrn-metric-desc strong{color:rgba(245,232,208,.82);font-weight:600}

/* Tab panels — shown/hidden by JS */
.lrn-tab-panel{display:none}
.lrn-tab-panel.active{display:flex;flex-direction:column;gap:20px}
/* Box explanation header inside panel */
.lrn-panel-hdr{display:flex;align-items:center;gap:12px;padding-bottom:14px;
  border-bottom:1px solid rgba(196,149,90,.18);margin-bottom:4px}
.lrn-panel-num{font-family:var(--serif);font-size:10px;color:#C4955A;
  background:rgba(196,149,90,.15);padding:3px 10px;border-radius:999px;
  letter-spacing:1.5px;font-weight:600;border:1px solid rgba(196,149,90,.3);flex-shrink:0}
.lrn-panel-title{font-family:var(--serif);font-size:19px;color:#F5E8D0;font-weight:400}
/* Row of "what/how/look-for" blocks */
.lrn-panel-rows{display:flex;flex-direction:column;gap:14px}
.lrn-panel-row{display:grid;grid-template-columns:110px 1fr;gap:0;
  border:1px solid rgba(196,149,90,.15);border-radius:8px;overflow:hidden}
.lrn-panel-row-lbl{padding:13px 12px;background:rgba(196,149,90,.08);
  border-right:1px solid rgba(196,149,90,.15);font-size:9px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;color:rgba(196,149,90,.7);
  display:flex;align-items:flex-start;padding-top:15px}
.lrn-panel-row-val{padding:13px 16px;font-size:12px;color:rgba(245,232,208,.6);
  line-height:1.65}
.lrn-panel-row-val strong{color:rgba(245,232,208,.88);font-weight:600}
.lrn-panel-row-val code{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;
  color:#C4955A;background:rgba(196,149,90,.12);padding:1px 6px;border-radius:3px}
/* TOC link as button */
.lrn-toc-link{background:none;font-family:inherit;cursor:pointer}
/* Overview chip — slightly distinct */
.lrn-toc-overview{border-style:dashed;margin-bottom:16px}
.lrn-toc-overview.active{border-style:solid}

@media(max-width:680px){
  .lrn-wrap{flex-direction:column;gap:20px}
  .lrn-toc{width:100%;position:static;padding:8px 0;
    flex-direction:row;flex-wrap:wrap;gap:8px}
  .lrn-toc-label{width:100%;margin-bottom:0}
  .lrn-toc-link{flex:0 0 calc(50% - 4px);margin-bottom:0;padding:9px 12px;
    justify-content:center}
  .lrn-metric{grid-template-columns:1fr}
  .lrn-metric-label{border-right:none;border-bottom:1px solid rgba(196,149,90,.18)}
}
/* ── Learn panel section sub-header ─────────────────────── */
.lrn-panel-subhdr{
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;
  color:rgba(196,149,90,.55);padding:6px 0 4px;margin-top:6px;
  border-top:1px solid rgba(196,149,90,.12);display:flex;align-items:center;gap:8px}
.lrn-panel-subhdr::after{content:"";flex:1;height:1px;background:rgba(196,149,90,.1)}
/* ── CI system callout in Learn ─────────────────────────── */
.lrn-ci-callout{
  display:flex;flex-direction:column;gap:10px;
  padding:14px 16px;border-radius:8px;
  border:1px solid rgba(196,149,90,.2);background:rgba(196,149,90,.05);
  margin-bottom:6px}
.lrn-ci-callout-hdr{font-size:11px;font-weight:700;color:rgba(196,149,90,.8);
  text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:8px}
.lrn-ci-callout-body{font-size:12px;color:rgba(245,232,208,.55);line-height:1.65}
.lrn-ci-callout-body strong{color:rgba(245,232,208,.82)}
.lrn-ci-callout-body code{font-family:'SF Mono',Consolas,monospace;font-size:10.5px;
  color:#C4955A;background:rgba(196,149,90,.12);padding:1px 5px;border-radius:3px}
/* Mini demo card inside callout */
.lrn-ci-demo{display:inline-flex;align-items:flex-start;gap:12px;margin-top:8px;flex-wrap:wrap}
.lrn-ci-demo-card{
  padding:10px 14px;border-radius:6px;background:var(--card-alt,#1a1a1a);
  border-left:3px solid rgba(196,149,90,.3);min-width:160px;display:flex;flex-direction:column;gap:4px}
.lrn-ci-demo-lbl{font-size:11px;color:rgba(245,232,208,.45);text-transform:uppercase;
  letter-spacing:.4px;display:flex;align-items:center;gap:4px}
.lrn-ci-demo-val{font-size:18px;font-weight:700;color:rgba(76,170,96,1)}
.lrn-ci-demo-sig{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;
  background:rgba(76,170,96,.15);color:rgba(76,170,96,.9);text-transform:uppercase;
  letter-spacing:.5px;align-self:flex-start}
.lrn-ci-demo-note{font-size:11px;color:rgba(245,232,208,.4);line-height:1.55;
  max-width:200px;padding-top:2px}
/* ── sec-creme overrides for lrn-panel classes ─────────── */
.sec-creme .lrn-panel-row{border-color:rgba(62,32,12,.12)}
.sec-creme .lrn-panel-row-lbl{background:rgba(62,32,12,.06);border-right-color:rgba(62,32,12,.1);color:rgba(62,32,12,.55)}
.sec-creme .lrn-panel-row-val{color:rgba(44,26,14,.72)}
.sec-creme .lrn-panel-row-val strong{color:#2C1A0E}
/* ══════ Box Portfolio ═══════════════════════════════════ */
#box-portfolio table{width:100%;border-collapse:collapse;font-size:12px}
#box-portfolio th{text-align:left;padding:6px 10px;color:var(--muted);font-weight:500;font-size:10px;
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
#box-portfolio th[data-sort]{cursor:pointer;user-select:none;white-space:nowrap}
#box-portfolio th[data-sort]:hover{color:var(--h)}
#box-portfolio th.pt-sort-active{color:var(--gold)}
/* CI ⓘ in portfolio headers — inline like other boxes (only PRICE + SCORE visible by default) */
/* sort arrows — pure CSS, left of label */
#box-portfolio thead th[data-sort]::before{content:"↕ ";opacity:.42;font-size:9px;font-weight:400}
#box-portfolio thead th[data-dir="desc"]::before{content:"↓ ";opacity:1;color:var(--gold);font-size:9px;font-weight:700}
#box-portfolio thead th[data-dir="asc"]::before{content:"↑ ";opacity:1;color:var(--gold);font-size:9px;font-weight:700}
#box-portfolio td{padding:7px 10px;border-bottom:1px solid var(--border-lt);vertical-align:middle}
#box-portfolio tr:hover td{background:var(--hover)}
#box-portfolio tbody tr{cursor:pointer}
/* ── Pulse bandeau */
#pt-pulse{display:flex;border-bottom:1px solid var(--border);background:var(--card-alt)}
.pt-pulse-col{flex:1;padding:10px 14px;border-right:1px solid var(--border-lt)}
.pt-pulse-col:last-child{border-right:none}
.pt-pulse-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.pt-pulse-val{font-family:'SF Mono',Consolas,monospace;font-size:13px;font-weight:700}
/* ── Anomalies feed */
#pt-anomalies:not(:empty){border-bottom:1px solid var(--border)}
.pt-anom-hdr{padding:5px 14px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);background:var(--card-alt);border-bottom:1px solid var(--border-lt)}
.pt-alert{display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:11px;
  font-family:'SF Mono',Consolas,monospace;border-bottom:1px solid var(--border-lt)}
.pt-alert:last-child{border-bottom:none}
.pt-alert-ticker{font-weight:700;flex-shrink:0}
.pt-alert-msg{color:var(--muted);flex:1}
.pt-alert-time{font-size:10px;color:var(--faint);flex-shrink:0}
.al-green{border-left:3px solid var(--green);background:rgba(44,122,62,.05)}
.al-red{border-left:3px solid var(--red);background:rgba(160,48,32,.05)}
.al-gold{border-left:3px solid var(--gold);background:rgba(158,122,46,.05)}
/* ── Returns toggle */
.pt-ret-toggle{display:inline-block;cursor:pointer;font-size:13px;font-weight:700;
  color:var(--gold);padding:0 4px;border-radius:3px;user-select:none;line-height:1;vertical-align:middle}
.pt-ret-toggle:hover{background:var(--gold-bg)}
#pt-table.pt-ret-collapsed .pt-ret{display:none}
/* ── Momentum/detail toggle */
.pt-sig-toggle{display:inline-block;cursor:pointer;font-size:13px;font-weight:700;
  color:var(--gold);padding:0 4px;border-radius:3px;user-select:none;line-height:1;vertical-align:middle}
.pt-sig-toggle:hover{background:var(--gold-bg)}
#pt-table.pt-sig-collapsed .pt-sig{display:none}
/* ── Group parent / child visual connectors (box-shadow avoids border-collapse conflicts) */
.pt-ret-parent,.pt-sig-parent{box-shadow:inset 0 -3px 0 var(--gold)}
#pt-table.pt-ret-collapsed .pt-ret-parent,
#pt-table.pt-sig-collapsed .pt-sig-parent{background:rgba(158,122,46,.06)}
/* when expanded, underline spans parent + all children → continuous gold bar */
#pt-table:not(.pt-ret-collapsed) thead .pt-ret,
#pt-table:not(.pt-sig-collapsed) thead .pt-sig{box-shadow:inset 0 -3px 0 var(--gold)}
/* ── Expansion panel */
.pt-expand-td{padding:0!important;border-left:3px solid var(--gold)}
.pt-expand-inner{padding:14px 18px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;
  background:var(--gold-bg);animation:pt-slide .2s ease}
@keyframes pt-slide{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.pt-expand-spark{flex-shrink:0}
.pt-expand-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px;
  font-size:11px;font-family:'SF Mono',Consolas,monospace;color:var(--p)}
.pt-expand-rets{color:var(--muted)}

/* ── Finance Mindmap — Force Graph ──────────────────────── */
#mm-wrap{position:relative;background:#fff;border-radius:12px;
  border:1px solid rgba(90,60,30,.14);overflow:hidden;
  box-shadow:0 4px 24px rgba(62,32,12,.08)}
#mm-bar{display:flex;align-items:center;justify-content:flex-end;
  padding:8px 12px;border-bottom:1px solid rgba(90,60,30,.09);background:#faf7f3}
#mm-zoom-btns{display:flex;gap:4px}
#mm-zoom-btns button{background:#fff;border:1px solid rgba(90,60,30,.2);border-radius:6px;
  width:28px;height:28px;cursor:pointer;font-size:.95rem;color:#5A3A24;
  display:flex;align-items:center;justify-content:center;transition:all .15s}
#mm-zoom-btns button:hover{background:rgba(90,60,30,.08);border-color:rgba(90,60,30,.4)}
#mm-svg{display:block;width:100%;cursor:grab;user-select:none}
#mm-legend{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem 1.2rem;
  padding:10px 14px;border-top:1px solid rgba(90,60,30,.08);
  background:#faf7f3;font-size:.72rem;color:#5A3020}
.mm-li{display:flex;align-items:center;gap:5px}
.mm-dot{display:inline-block;border-radius:50%;width:7px;height:7px;flex-shrink:0}
.mm-li-line{opacity:.65}
/* tooltip */
#mm-tip{display:none;position:absolute;z-index:99;pointer-events:auto;
  background:#fff;border:1px solid rgba(90,60,30,.18);border-radius:10px;
  box-shadow:0 8px 28px rgba(62,32,12,.16);padding:12px 14px 11px;max-width:252px;
  font-family:var(--sans)}
#mm-tip.mm-tip-pinned{border-color:rgba(122,92,26,.5);
  box-shadow:0 8px 32px rgba(62,32,12,.22)}
.mm-tip-close{position:absolute;top:7px;right:9px;
  background:none;border:none;cursor:pointer;font-size:1rem;
  color:rgba(90,60,30,.35);line-height:1;padding:2px 4px;border-radius:4px}
.mm-tip-close:hover{color:#3E200C;background:rgba(90,60,30,.07)}
.mm-tip-type{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(90,60,30,.42);margin-bottom:3px}
.mm-tip-label{font-size:.92rem;font-weight:600;color:#1A0800;margin-bottom:7px;
  font-family:var(--serif);padding-right:18px;line-height:1.3}
.mm-tip-desc{font-size:.76rem;color:#5A3020;line-height:1.52;margin-bottom:9px}
.mm-tip-wiki{display:inline-block;font-size:.74rem;color:#7A5C1A;font-weight:600;
  text-decoration:none;padding:.28rem .7rem;border-radius:5px;
  background:rgba(122,92,26,.08);border:1px solid rgba(122,92,26,.25);
  transition:all .15s}
.mm-tip-wiki:hover{background:rgba(122,92,26,.16);border-color:rgba(122,92,26,.5)}
/* mobile: tooltip becomes a bottom sheet so node info + Read more are always reachable */
@media(max-width:700px){
  #mm-tip{position:fixed;left:10px;right:10px;bottom:10px;top:auto!important;
    max-width:none;width:auto;padding:16px 16px 15px;z-index:9600;
    box-shadow:0 -6px 30px rgba(62,32,12,.26)}
  .mm-tip-label{font-size:1.05rem}
  .mm-tip-desc{font-size:.85rem}
  .mm-tip-wiki{font-size:.92rem;padding:.55rem 1.05rem;margin-top:2px}
  .mm-tip-close{font-size:1.5rem;padding:6px 11px;top:8px;right:10px}
}
/* ── Box Info Button (ⓘ — coin haut-droit du band) ─────── */
.bib-wrap{position:absolute;top:20px;right:20px;z-index:100}
.box-info-btn{background:none;border:1.5px solid rgba(196,149,90,.5);cursor:pointer;font-size:11px;
  font-style:italic;font-weight:700;font-family:Georgia,serif;color:rgba(196,149,90,.8);
  width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;transition:all .2s;padding:0;flex-shrink:0;line-height:1}
.box-info-btn:hover,.box-info-btn.bib-on{border-color:#C4955A;color:#fff;background:#C4955A;
  box-shadow:0 0 0 3px rgba(196,149,90,.2)}
.box-info-pop{display:none;position:absolute;top:calc(100% + 6px);right:0;width:256px;
  max-width:calc(100vw - 48px);background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:200}
.box-info-pop.bip-open{display:block;animation:bip-in .12s ease}
@keyframes bip-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.bip-desc{font-size:12px;line-height:1.65;color:var(--p);margin:0 0 10px}
.bip-link{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.3px;
  text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:opacity .15s}
.bip-link:hover{opacity:.7}
/* ── CI toggle pill (single round button) ────────────────── */
.ci-pill{background:none;border:none;cursor:pointer;padding:0;flex-shrink:0;
  display:inline-flex;align-items:center;justify-content:center}
.ci-pill .ci-glyph{font-style:italic;font-weight:700;font-family:Georgia,serif;font-size:12px;
  width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;position:relative;line-height:1;transition:all .2s}
[data-ci="on"]  .ci-pill .ci-glyph{color:rgba(158,122,46,.55);border:1.5px solid rgba(158,122,46,.35);background:none;font-weight:400}
[data-ci="off"] .ci-pill .ci-glyph{color:var(--p);border:2px solid var(--border);
  background:var(--card-alt)}
[data-ci="off"] .ci-pill .ci-glyph::after{content:"";position:absolute;
  top:calc(50% - 1px);left:-3px;right:-3px;height:2px;
  background:var(--muted);transform:rotate(-45deg);border-radius:1px}
.ci-pill:hover .ci-glyph{border-color:var(--gold)!important;color:var(--gold)!important}
/* ── Column info button (.ci) ─────────────────────────────── */
.ci{display:inline-flex;align-items:center;justify-content:center;
  font-style:italic;font-weight:700;font-family:Georgia,serif;font-size:9px;
  width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(158,122,46,.45);
  color:rgba(158,122,46,.65);cursor:pointer;vertical-align:middle;margin-left:4px;
  transition:color .15s,border-color .15s,background .15s;flex-shrink:0;line-height:1}
.ci:hover{color:var(--gold);border-color:var(--gold);background:var(--gold-bg)}
[data-ci="off"] .ci{visibility:hidden;pointer-events:none}
/* ── CI floating tooltip ──────────────────────────────────── */
#ci-tip{display:none;position:fixed;z-index:9999;pointer-events:none;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;max-width:252px;font-size:11.5px;line-height:1.6;
  color:var(--p);box-shadow:0 6px 20px rgba(0,0,0,.18);
  font-weight:400;font-family:var(--sans);font-style:normal}
#ci-tip.ci-vis{display:block;pointer-events:auto}
#ci-tip .ci-hint{display:none;margin-top:5px;padding-top:5px;
  border-top:1px solid var(--border-lt);font-size:10px;color:var(--gold);
  font-weight:600;letter-spacing:.2px;cursor:pointer}
#ci-tip .ci-hint:hover{text-decoration:underline}
/* ── Sentiment sc-info respects the toggle ────────────────── */
[data-ci="off"] .sc-info{pointer-events:none}
[data-ci="off"] .sc-info-btn{opacity:0!important}
[data-ci="off"] .sc-tip{visibility:hidden!important}
/* ── Learn sidebar flash (arrive via deep-link from dashboard) ─ */
@keyframes lrn-flash{0%,100%{border-color:rgba(196,149,90,.18);background:none;color:rgba(245,232,208,.5)}
  35%,65%{border-color:#C4955A;background:rgba(196,149,90,.22);color:#C4955A}}

  <!-- CI toggle — early init (before box scripts run) -->
  <script>
  (function(){
    try{document.documentElement.dataset.ci=localStorage.getItem('sainhe_ci')||'on';}
    catch(e){document.documentElement.dataset.ci='on';}
    window._ci=function(tip,tab,row){
      var el=document.createElement('span');
      el.className='ci'; el.dataset.tip=tip; el.textContent='i'; el.translate=false;
      if(tab) el.dataset.tab=tab;
      if(row) el.dataset.row=row;
      return el;
    };
  })();
  </script>

  <!-- FX / Currency System — injected at render time, applied client-side -->
  <script>
  window.SAINHE_FX  = {{ fx_rates_js | tojson }};
  window.SAINHE_CUR = localStorage.getItem('sainhe_currency') || 'USD';

  /* Convert amount from native_devise → current display currency.
     Uses SAINHE_FX lookup — supports all pairs stored in fx_rates (JPY, CHF, GBP…).
     GBp / GBX = British pence (1/100 GBP) — divided by 100 before applying GBP rate.
     Returns null only for devises absent from the FX table. */
  window.fxConvert = function(amount, native_devise){
    if(amount == null) return null;
    var fx = window.SAINHE_FX, cur = window.SAINHE_CUR || 'USD';
    var nd = native_devise || 'USD';
    var usd;
    if(nd === 'GBp' || nd === 'GBX'){
      if(fx['GBP'] === undefined) return null;
      usd = (amount / 100) / fx['GBP']; // pence → GBP → USD
    } else if(nd === 'USD'){
      usd = amount;
    } else if(fx[nd] !== undefined){
      usd = amount / fx[nd];   // native → USD  (fx[nd] = USD per 1 native unit)
    } else {
      return null;             // devise inconnue (pas dans fx_rates)
    }
    return usd * (fx[cur] !== undefined ? fx[cur] : 1.0);
  };

  /* Format a price with conversion; shows raw value if devise unknown */
  window.fxFmt = function(amount, native_devise){
    var val = window.fxConvert(amount, native_devise);
    if(val == null)
      return amount != null
        ? amount.toLocaleString(window.SAINHE_LOCALE||'en',{minimumFractionDigits:2,maximumFractionDigits:2})
        : '—';
    return val.toLocaleString(window.SAINHE_LOCALE||'en',{minimumFractionDigits:2,maximumFractionDigits:2});
  };

  /* Format price WITH currency symbol — symbol only prepended when conversion succeeds.
     Use this for price cells; fxFmt alone is symbol-free. */
  window.fxPrice = function(amount, native_devise){
    var val = window.fxConvert(amount, native_devise);
    if(val == null)
      return amount != null
        ? amount.toLocaleString(window.SAINHE_LOCALE||'en',{minimumFractionDigits:2,maximumFractionDigits:2})
        : '—';
    return window.fxSymbol() + val.toLocaleString(window.SAINHE_LOCALE||'en',{minimumFractionDigits:2,maximumFractionDigits:2});
  };

  /* Currency prefix symbol */
  window.fxSymbol = function(){
    var c = window.SAINHE_CUR || 'USD';
    if(c === 'EUR') return '€ ';
    if(c === 'HKD') return 'HK$ ';
    return '$ ';  /* USD — toujours affiché pour distinguer des indicateurs */
  };

  /* Called by the header dropdown — updates state and re-renders price boxes */
  window._sainheSetCurrency = function(c){
    if(['USD','EUR','HKD'].indexOf(c) < 0) return;
    window.SAINHE_CUR = c;
    localStorage.setItem('sainhe_currency', c);
    var btn = document.getElementById('dd-cur-btn');
    if(btn){ var t = btn.childNodes[0]; if(t && t.nodeType===3) t.nodeValue = c; }
    document.querySelectorAll('#dd-cur .hdr-dd-item').forEach(function(el){
      el.classList.toggle('active', el.dataset.cur === c);
    });
    var lbl = document.getElementById('pt-cur-label');
    if(lbl) lbl.textContent = c;
    if(window._sainheRenderIndices)   window._sainheRenderIndices();
    if(window._sainheRenderPortfolio) window._sainheRenderPortfolio();
  };

  /* On load: restore header button label if a non-USD currency was saved */
  document.addEventListener('DOMContentLoaded', function(){
    var saved = localStorage.getItem('sainhe_currency');
    if(saved && saved !== 'USD'){
      var btn = document.getElementById('dd-cur-btn');
      if(btn){ var t = btn.childNodes[0]; if(t && t.nodeType===3) t.nodeValue = saved; }
      document.querySelectorAll('#dd-cur .hdr-dd-item').forEach(function(el){
        el.classList.toggle('active', el.dataset.cur === saved);
      });
      var lbl = document.getElementById('pt-cur-label');
      if(lbl) lbl.textContent = saved;
    }
  });
  </script>

  <!-- miniChart — shared sparkline helper (used by box_02, box_03, box_06) -->
  <script>
  function miniChart(cv, data, color, fill){
    if(!cv || !data || !data.length) return null;
    const bg = fill ? color.replace("rgb(","rgba(").replace(")",",0.12)") : "transparent";
    return new Chart(cv, {
      type:"line",
      data:{labels:data.map((_,i)=>i), datasets:[{data, borderColor:color, borderWidth:1.5,
        fill:!!fill, backgroundColor:bg, tension:.4, pointRadius:0}]},
      options:{responsive:false, animation:{duration:0},
        plugins:{legend:{display:false}, tooltip:{enabled:false}},
        scales:{x:{display:false}, y:{display:false}}}
    });
  }
  </script>

  <script>

  document.documentElement.lang='en';
  </script>
